name: Prediction models refresh (PL + NFL)

# Twice a week through the 2026-27 season this re-runs the /predictions
# league models: grades any played fixtures in the ledgers, folds real
# results into the ratings, refreshes market odds, re-simulates the season
# and freezes picks for the next round of fixtures.
#   Tue 06:40 UTC - grade the weekend's games with final results
#   Fri 11:40 UTC - fresh odds + picks ahead of the weekend
# Data-only commit riding [vercel skip]; the pages read the JSONs via ISR
# from GitHub raw, so no build is needed. Self-tests gate every run.

# SCHEDULE RETIRED 2026-08-07: the Mac mini's dispatcher owns both slots now
# (mac-mini-jobs/jobs.toml, ids "predictions-tue" and "predictions-fri").
# This is the FOURTH and LAST job in the github-to-mini-migration thread;
# business-daily, forecast and mlb-sim went before it. Retired because GitHub
# dispatches cron 1-4 hours late across 348 measured runs, and the Friday slot
# is the NFL ledger freeze, where arriving late means freezing a pick on less
# information.
#
# workflow_dispatch stays as the manual fallback. If the mini dies for good,
# uncomment the schedule below and comment out the mini's jobs.toml rows --
# never both at once, or two runners race the same commit.
#
# jobs.toml's ROLLOUT STATE block is the authority for who owns what.
on:
  # schedule:
  #   - cron: "40 6 * * 2"
  #   - cron: "40 11 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: predictions-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install numpy (fast sim path)
        run: pip install numpy

      - name: Self-tests (offline decision logic)
        run: |
          python3 scripts/predictions/build_pl_sim.py --self-test
          python3 scripts/predictions/build_nfl_sim.py --self-test

      - name: Rebuild the Premier League model
        run: python3 scripts/predictions/build_pl_sim.py

      - name: Rebuild the NFL model
        run: python3 scripts/predictions/build_nfl_sim.py

      - name: Commit if anything changed
        run: |
          git add public/data/pl-sim.json public/data/pl-predictions.json \
                  public/data/nfl-sim.json public/data/nfl-predictions.json
          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git config user.name "predictions-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: refresh PL + NFL prediction models [vercel skip]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."; exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push after retries." >&2; exit 1

      - name: Revalidate site caches (on-demand ISR)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          # Fail-open by design: the 6h ISR window on lib/plSim.ts and
          # lib/nflSim.ts is the backstop, so a missing secret or a failed ping
          # must never fail the data run. See app/api/revalidate/route.ts.
          # Runs even on no-change days; a redundant flush is harmless.
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping (6h ISR backstop applies)."
            exit 0
          fi
          # raw.githubusercontent serves from a ~5-min CDN cache; flushing
          # before it expires would re-render from the previous model and
          # re-cache THAT for 6h. Wait out the raw TTL, then flush.
          echo "Waiting out the GitHub raw CDN TTL before flushing..."
          sleep 300
          for attempt in 1 2 3; do
            code="$(curl -s -o /tmp/reval.out -w '%{http_code}' -X POST \
              -H "x-revalidate-secret: $REVALIDATE_SECRET" \
              "https://rankings.citizenofnowhere.org/api/revalidate?tag=predictions-daily")" || code=000
            if [ "$code" = "200" ]; then
              cat /tmp/reval.out; echo
              echo "Revalidated on attempt $attempt."
              # revalidateTag() invalidates but does NOT regenerate: Vercel
              # serves the OLD copy (cache=STALE) to the first request after
              # the flush and rebuilds behind it, so only the request AFTER
              # THAT sees fresh data. Measured 2026-08-06 on /business/markets,
              # where a real visitor ate the stale hit 67 minutes later. Warm
              # the hubs here so this job takes that hit. Best-effort,
              # fail-open, parallel, 20s cap. Mirrors _warm_paths() in
              # mac-mini-jobs/runners/_common.sh -- keep the two in step.
              # /predictions/mlb is warmed by mlb-sim-refresh.yml, which shares
              # the predictions-daily tag; a flush invalidates all three, so
              # include it here too rather than leave it cold on Tue/Fri.
              for p in /predictions/pl /predictions/nfl /predictions/mlb /predictions; do
                ( wcode="$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
                    "https://rankings.citizenofnowhere.org$p")" || wcode=000
                  echo "warm $p -> HTTP $wcode" ) &
              done
              wait
              exit 0
            fi
            echo "revalidate ping attempt $attempt returned HTTP $code"
            sleep $((attempt * 5))
          done
          echo "WARN: on-demand revalidation failed; pages refresh via the 6h ISR window instead." >&2
