name: 2026 Women's Basketball World Cup tracker

# The 2026 FIBA Women's Basketball World Cup is being played in Germany in
# September 2026. This job asks Wikipedia once a day whether the final has a
# score yet, and the day it does, writes the edition into the committed
# results dump and rebuilds public/data/wbasketball.
#
# WHY THE COMMIT CARRIES [vercel skip]. lib/wbasketball.ts reads every one of
# its files through lib/liveData (GitHub raw + ISR, bundled copy only as a
# fallback), so a data-only commit reaches readers without a production build.
# That is checked, not assumed: there is no readFileSync in lib/wbasketball.ts,
# and scripts/check-live-data.mjs enforces it. If that ever changes, DROP THE
# SKIP TAG in the same commit, or the result sits in the repo unread.
#
# The self-test runs first and gates the write. track_wwc.py exits 2 when the
# article has a Final section it cannot parse, which fails this job loudly
# rather than reporting "not played yet" for the rest of the tournament.

#
# SCHEDULE RETIRED 2026-09-15 (Ashwin). The job is done: the final (United States 97-79
# France, third Spain 81-58 Germany) was recorded on 09-14 in 8f43c6971. Every run after
# that could only say "2026 already present", and while the self-tests still assumed an
# unplayed 2026 each daily run failed, emailed and drew an ops-autofix re-run and ntfy.
# workflow_dispatch stays as the manual trigger; re-enable the cron for 2030.
on:
  # schedule:
  #   - cron: "0 6 8-30 9 *"   # 06:00 UTC daily, 8-30 September
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wwc-2026-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Self-test the builder and the tracker
        run: |
          python3 scripts/basketball/build_intl_wbasketball.py --self-test
          python3 scripts/basketball/track_wwc.py --self-test

      - name: Track the final
        run: python3 scripts/basketball/track_wwc.py --write

      - name: Commit and push only if the result landed
        run: |
          if git diff --quiet -- public/data/wbasketball scripts/basketball/wbasketball_worldcup.txt; then
            echo "No 2026 result yet; nothing to commit."
            exit 0
          fi
          git config user.name "wwc-2026-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/wbasketball scripts/basketball/wbasketball_worldcup.txt
          git commit -m "Auto: 2026 Women's Basketball World Cup result [vercel skip]"
          git push
