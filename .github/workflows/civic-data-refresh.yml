name: Civic data refresh (weekly, no deploy)

# One weekly job (also runnable on demand) that keeps every officeholder feed
# current from Wikidata. SAFE half auto-applies to main: add-only gap-fills
# (leaders, governors), the COUNTED Congress splits, and the mayors refresh.
# REVIEW half: proposed OVERWRITES of existing curated leaders go to a branch
# and open a Pull Request for human review (Wikidata is noisy on who holds
# office now). All commits carry [vercel skip]; frontends ISR-read from GitHub
# raw, so nothing here triggers a Vercel build (needs the Ignored Build Step).

on:
  # schedule DISABLED 2026-07-06: mini's egress-refresh (Sun 10:00) owns civic; manual-only, no double-run.
  # schedule:
  #   - cron: "30 6 * * 1"   # Mondays 06:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: civic-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests openpyxl pyyaml

      - name: Self-test refresh logic (offline)
        run: |
          python scripts/civic/civic_common.py --self-test
          python scripts/civic/refresh_governors.py --self-test
          python scripts/civic/refresh_congress.py --self-test
          python scripts/civic/refresh_mayors.py --self-test
          python scripts/civic/build_senate_history.py --self-test
          python scripts/civic/build_executive_history.py --self-test
          python scripts/civic/sync_history_from_current.py --self-test
          python scripts/civic/refresh_cabinet.py --self-test
          python scripts/civic/refresh_house_leadership.py --self-test

      # ---- SAFE: auto-applied to main ----
      - name: World leaders (auto-apply changes from Wikidata)
        # No --add-only: a plausible, unambiguous change to a current head of
        # state/government is applied to _current.json AND the per-country
        # history file, and logged to public/data/leaders/_changes.json.
        run: python scripts/leaders/refresh-current-leaders.py

      - name: US governors (add-only gap-fill)
        run: python scripts/civic/refresh_governors.py --add-only

      - name: US Congress (counted party splits + roster)
        run: python scripts/civic/refresh_congress.py

      - name: US time-machine history (authoritative rebuild + sync tails)
        # Senate + President/VP history rebuilt from the authoritative,
        # continuously-maintained congress-legislators project (safe to auto-commit).
        # Cabinet + Governor current tails are then synced from the just-refreshed
        # snapshot (us-congress.json / governors.json) so ONE edit to the snapshot
        # flows to /us-political-leadership AND .../time-machine. History bulk for
        # cabinet/governors is stable and NOT re-pulled weekly (avoids Wikidata noise).
        run: |
          python scripts/civic/build_senate_history.py --build
          python scripts/civic/build_executive_history.py --build
          python scripts/civic/sync_history_from_current.py --sync

      - name: Mayors (top-100 primary cities - probe/refresh)
        continue-on-error: true
        run: python scripts/civic/refresh_mayors.py

      - name: Executive & Cabinet
        # President/VP/Cabinet were previously untouched by any refresh script
        # (refresh_congress.py explicitly passes `executive` through). Live-
        # validated clean across multiple real Wikidata rounds (see git
        # history / HANDOFF.md) -- --write enabled 2026-07-21. A position that
        # can't be unambiguously resolved is left untouched, not guessed at.
        continue-on-error: true
        run: python scripts/civic/refresh_cabinet.py --write

      - name: House leadership
        # Speaker/Majority-Minority Leader+Whip/Conference-Caucus Chairs were
        # previously untouched by any refresh script (same passthrough gap as
        # executive/Cabinet). Live-validated clean -- --write enabled
        # 2026-07-21. Majority/Minority Whip are a genuine Wikidata data gap
        # (no federal item, no P39 statements from the actual officeholders --
        # see refresh_house_leadership.py's docstring) and stay untouched/
        # manual until Wikidata models the role.
        continue-on-error: true
        run: python scripts/civic/refresh_house_leadership.py --write

      - name: Billionaires (Forbes real-time list)
        continue-on-error: true
        run: |
          python scripts/billionaires/fetch-billionaires.py
          python scripts/billionaires/build-billionaires.py

      - name: Team valuations (from OtherLeagues.xlsx)
        continue-on-error: true
        run: python scripts/build-valuations-data.py

      - name: Team owners (from the curated seed)
        # Writes nothing unless scripts/data/team-owners-seed.json changed. It
        # runs weekly anyway because it re-validates the join against the
        # valuations board in BOTH directions: if a team is renamed or added
        # upstream, this step goes red instead of the Owner column silently
        # going blank on /sports/valuations.
        continue-on-error: true
        run: python scripts/build-team-owners-data.py

      - name: Owners watchlist (review dates)
        # Deterministic dead-man's switch over the contested ownership rows: no
        # scraping, no network, just pending_review_by against today. Fails only
        # when a review is more than 14 days overdue.
        continue-on-error: true
        run: python scripts/check-owners-watchlist.py

      - name: World Power Rankings (top 100)
        continue-on-error: true
        run: python scripts/build-power-ranking.py

      - name: Zone Zero Cup (weekly regeneration)
        # Preflight-guarded: the script refuses to write a hollowed-out Cup if an
        # upstream pillar input has collapsed (see preflight() in the script).
        # continue-on-error so a tripped guard leaves the Cup stale (safe) and
        # still lets the rest of the weekly refresh commit; the red step is the signal.
        continue-on-error: true
        run: python scripts/zzc_v1_multipillar.py

      - name: Commit safe auto changes to main
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # scripts/civic/city-qids.json, cabinet-positions.json, and
          # house-leadership-positions.json are the mayors/cabinet/house-leadership
          # QID/position caches; committing them alongside public/data keeps this
          # manual-fallback run and the mini's weekly run sharing one warm cache
          # instead of cold-starting each time.
          DATA_PATHS="public/data scripts/civic/city-qids.json scripts/civic/cabinet-positions.json scripts/civic/house-leadership-positions.json"
          if git diff --quiet -- $DATA_PATHS; then
            echo "No auto changes this run."
            exit 0
          fi
          # Some of what this job refreshes is read by lib/ with readFileSync at
          # BUILD time, so a [vercel skip] commit would leave it in the repo doing
          # nothing until an unrelated commit happened to trigger a build:
          # vercel-ignore.sh rule 1 skips on the tag BEFORE the path test, and
          # run-deploy-watch.sh skips past tagged subjects when choosing TARGET,
          # so neither the guard nor the healer sees it. Those paths live in
          # scripts/refresh-needs-build-paths.txt, shared with the mini's
          # metro-mini-refresh.sh so the two cannot drift. Until 2026-08-11 this
          # test was hardcoded to leaders/_changes.json alone and silently missed
          # valuations. The Zone Zero Cup is correctly NOT in that list:
          # lib/zoneZeroCup.ts ISR-reads it from GitHub raw, as does every other
          # refresh here, and those keep riding [vercel skip].
          NEEDS_BUILD_FILE="scripts/refresh-needs-build-paths.txt"
          test -f "$NEEDS_BUILD_FILE" || { echo "missing $NEEDS_BUILD_FILE"; exit 1; }
          NEEDS_BUILD_PATHS=$(grep -v '^#' "$NEEDS_BUILD_FILE" | grep -v '^[[:space:]]*$')
          test -n "$NEEDS_BUILD_PATHS" || { echo "$NEEDS_BUILD_FILE has no paths"; exit 1; }
          if git diff --quiet -- $NEEDS_BUILD_PATHS; then
            MSG="data: weekly refresh - officeholders, billionaires, valuations, World Power Rankings [vercel skip]"
          else
            echo "build-time-read data changed: $(git diff --name-only -- $NEEDS_BUILD_PATHS | tr '\n' ' ')"
            MSG="data: weekly refresh - build-time-read data changed, rebuild required"
          fi
          git add $DATA_PATHS
          git commit -m "$MSG"
          git push origin HEAD:main

      # ---- REVIEW: proposed leader overwrites -> Pull Request ----
      - name: Propose leader overwrites for review (PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python scripts/leaders/refresh-current-leaders.py
          # Cabinet: propose confirmed-holder changes + flag stale entries
          # (snapshot holder whose Wikidata term now shows an end date).
          # Noisy on current officials, so it rides the REVIEW PR, never auto-main.
          python scripts/civic/refresh_cabinet.py --check || true
          if git diff --quiet -- public/data; then
            echo "Wikidata agrees with curation; no proposed overwrites this week."
            exit 0
          fi
          BR=civic-proposed-changes
          git checkout -B "$BR"
          git add public/data
          git commit -m "data: PROPOSED weekly officeholder changes - review before merge [vercel skip]"
          git push -f origin "$BR"
          printf '%s\n' "Auto-generated from Wikidata. These overwrite existing curated leader entries, so review before merging - Wikidata is often stale or wrong on current officeholders. Safe gap-fills and Congress splits were already applied to main. Merging needs no Vercel build (vercel-skip + ISR). Close to reject." > pr_body.txt
          CMP="https://github.com/ashwin-desikan/metro-power-rankings/compare/main...$BR"
          if gh pr view "$BR" --json number > /dev/null 2>&1; then
            echo "Existing review PR updated."
          else
            gh pr create --base main --head "$BR" --title "Weekly civic data: proposed officeholder changes for review" --body-file pr_body.txt \
              || echo "Could not auto-create the PR. Enable 'Allow GitHub Actions to create and approve pull requests' in repo Settings > Actions > General, or open it manually: $CMP"
          fi
          rm -f pr_body.txt
