name: Civic data refresh (weekly, no deploy)

# One weekly job (also runnable on demand) that keeps every officeholder feed
# current from Wikidata. SAFE half auto-applies to main: add-only gap-fills
# (leaders, governors), the COUNTED Congress splits, and the mayors refresh.
# REVIEW half: proposed OVERWRITES of existing curated leaders go to a branch
# and open a Pull Request for human review (Wikidata is noisy on who holds
# office now). All commits carry [vercel skip]; frontends ISR-read from GitHub
# raw, so nothing here triggers a Vercel build (needs the Ignored Build Step).

on:
  schedule:
    - cron: "30 6 * * 1"   # Mondays 06:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: civic-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Self-test refresh logic (offline)
        run: |
          python scripts/civic/civic_common.py --self-test
          python scripts/civic/refresh_governors.py --self-test
          python scripts/civic/refresh_congress.py --self-test
          python scripts/civic/refresh_mayors.py --self-test

      # ---- SAFE: auto-applied to main ----
      - name: World leaders (add-only gap-fill)
        run: python scripts/leaders/refresh-current-leaders.py --add-only

      - name: US governors (add-only gap-fill)
        run: python scripts/civic/refresh_governors.py --add-only

      - name: US Congress (counted party splits + roster)
        run: python scripts/civic/refresh_congress.py

      - name: Mayors (top-100 primary cities - probe/refresh)
        run: python scripts/civic/refresh_mayors.py

      - name: Commit safe auto changes to main
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data; then
            echo "No safe auto changes this run."
          else
            git add public/data
            git commit -m "data: weekly civic refresh - gap-fills + Congress splits + mayors [vercel skip]"
            git push origin HEAD:main
          fi

      # ---- REVIEW: proposed leader overwrites -> Pull Request ----
      - name: Propose leader overwrites for review (PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python scripts/leaders/refresh-current-leaders.py
          if git diff --quiet -- public/data; then
            echo "Wikidata agrees with curation; no proposed overwrites this week."
            exit 0
          fi
          BR=civic-proposed-changes
          git checkout -B "$BR"
          git add public/data
          git commit -m "data: PROPOSED weekly officeholder changes - review before merge [vercel skip]"
          git push -f origin "$BR"
          printf '%s\n' "Auto-generated from Wikidata. These overwrite existing curated leader entries, so review before merging - Wikidata is often stale or wrong on current officeholders. Safe gap-fills and Congress splits were already applied to main. Merging needs no Vercel build (vercel-skip + ISR). Close to reject." > pr_body.txt
          CMP="https://github.com/ashwin-desikan/metro-power-rankings/compare/main...$BR"
          if gh pr view "$BR" --json number > /dev/null 2>&1; then
            echo "Existing review PR updated."
          else
            gh pr create --base main --head "$BR" --title "Weekly civic data: proposed officeholder changes for review" --body-file pr_body.txt \
              || echo "Could not auto-create the PR. Enable 'Allow GitHub Actions to create and approve pull requests' in repo Settings > Actions > General, or open it manually: $CMP"
          fi
          rm -f pr_body.txt
