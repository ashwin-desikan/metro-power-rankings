name: Business daily refresh (markets + FX)

# Daily refresh for the two /business datasets that actually move daily:
#   - markets.json      (index + commodity levels, Yahoo chart API, keyless)
#   - fx.json           (USD rates, exchangerate-api.com free plan - its own
#                        rates refresh once daily upstream; one call per run
#                        = ~30 of the 1,500 monthly requests)
# Everything else in the hub stays on its slower cadence by design: the
# mktcap universe + movers belong to the Saturday drill's parity discipline,
# S&P 500 membership churns a few times a quarter, Leaders follows the
# weekly Wikidata cycle, Owners is quarterly (SEC 13F calendar), Crossovers
# derives from the weekly snapshot. Decision 2026-08-03 with Ashwin.
#
# Cost: zero marginal. Data-only commit riding [vercel skip] (and the
# vercel-ignore.sh path check as backstop) - the pages read these JSONs via
# ISR from GitHub raw, so no build ever triggers. Both scripts keep
# append-only history files (deduped by date), so week-over-week movement
# on the pages is computed from our own tracked days.
#
# 05:50 UTC daily - after Asia's close, before the European open, and clear
# of predictions (Tue 06:40) and honours (Wed 08:10). Self-tests gate every
# run; a failing Yahoo symbol degrades gracefully, fewer than six indices
# aborts the write.

on:
  schedule:
    - cron: "50 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: business-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Self-tests (offline decision logic)
        run: |
          python3 scripts/business/build_markets.py --self-test
          python3 scripts/business/build_fx.py --self-test

      - name: Refresh markets (Yahoo, keyless)
        run: python3 scripts/business/build_markets.py

      - name: Refresh FX (exchangerate-api)
        env:
          EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
        run: python3 scripts/business/build_fx.py

      - name: Commit if anything changed
        run: |
          git add public/data/business/markets.json public/data/business/markets-history.json \
                  public/data/business/fx.json public/data/business/fx-history.json \
                  public/data/business/fx-series
          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git config user.name "business-refresh-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: daily markets + FX refresh [vercel skip]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."; exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push after retries." >&2; exit 1

      - name: Revalidate site caches (on-demand ISR)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          # Fail-open by design: the 6h ISR window on lib/business.ts fetches
          # is the backstop, so a missing secret or a failed ping must never
          # fail the data run. See app/api/revalidate/route.ts. Runs even on
          # no-change days; a redundant flush is harmless.
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping (6h ISR backstop applies)."
            exit 0
          fi
          # raw.githubusercontent serves from a ~5-min CDN cache; flushing
          # before it expires would re-render from the previous day's JSON and
          # re-cache THAT for 6h. Wait out the raw TTL, then flush.
          echo "Waiting out the GitHub raw CDN TTL before flushing..."
          sleep 300
          for attempt in 1 2 3; do
            code="$(curl -s -o /tmp/reval.out -w '%{http_code}' -X POST \
              -H "x-revalidate-secret: $REVALIDATE_SECRET" \
              "https://rankings.citizenofnowhere.org/api/revalidate?tag=business-daily")" || code=000
            if [ "$code" = "200" ]; then
              cat /tmp/reval.out; echo
              echo "Revalidated on attempt $attempt."
              exit 0
            fi
            echo "revalidate ping attempt $attempt returned HTTP $code"
            sleep $((attempt * 5))
          done
          echo "WARN: on-demand revalidation failed; pages refresh via the 6h ISR window instead." >&2
