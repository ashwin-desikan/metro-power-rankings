name: Business daily refresh (markets + FX)

# Daily refresh for the two /business datasets that actually move daily:
#   - markets.json      (index + commodity levels, Yahoo chart API, keyless)
#   - fx.json           (USD rates, exchangerate-api.com free plan - its own
#                        rates refresh once daily upstream; one call per run
#                        = ~30 of the 1,500 monthly requests)
# Everything else in the hub stays on its slower cadence by design: the
# mktcap universe + movers belong to the Saturday drill's parity discipline,
# S&P 500 membership churns a few times a quarter, Leaders follows the
# weekly Wikidata cycle, Owners is quarterly (SEC 13F calendar), Crossovers
# derives from the weekly snapshot. Decision 2026-08-03 with Ashwin.
#
# Cost: zero marginal. Data-only commit riding [vercel skip] (and the
# vercel-ignore.sh path check as backstop) - the pages read these JSONs via
# ISR from GitHub raw, so no build ever triggers. Both scripts keep
# append-only history files (deduped by date), so week-over-week movement
# on the pages is computed from our own tracked days.
#
# 05:50 UTC daily - after Asia's close, before the European open, and clear
# of predictions (Tue 06:40) and honours (Wed 08:10). Self-tests gate every
# run; a failing Yahoo symbol degrades gracefully, fewer than six indices
# aborts the write.

# SCHEDULE RETIRED 2026-08-05: the Mac mini owns this job now.
#
# Why: GitHub dispatches cron 1-4h late in this repo. Measured across 348
# schedule-event runs (20 Jul - 4 Aug), every run succeeded and every run was
# late; this workflow's 05:50 slot landed at 08:10 on 4 Aug and 08:08 on 5 Aug.
# For most of the fleet that is harmless, but markets.json and fx.json carry a
# visible "as of" date, so /business/markets sat on yesterday until mid-morning
# every single day. The mini runs it at 05:50 UTC for real.
#
# The mini's copy is a literal port, guards included:
# mac-mini-jobs/runners/business-daily.sh, scheduled by mac-mini-jobs/jobs.toml.
# Validated there on 5 Aug: dispatcher self-test 19/19, DRY_RUN diff clean, real
# run committed dd7459bf3, /api/revalidate ping 200.
#
# workflow_dispatch is KEPT ON PURPOSE as the manual fallback for when the mini
# is down. Run it from the Actions tab and it behaves exactly as before.
#
# ONE RUNNER RULE: do not re-enable the schedule while the mini's jobs.toml has
# business-daily active, or the two race and produce duplicate commits (which is
# what happened on 5 Aug, harmlessly, while both were live).
#
# If the mini dies for good, uncomment the schedule below and delete the mini's
# entry. Freshness reverts to "yesterday until ~08:10", not to broken.
#
# The dead-man's switch that catches a silently dead mini is
# .github/workflows/staleness-watch.yml (markets.json and fx.json, 30h budget).
on:
  # schedule:
  #   - cron: "50 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: business-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Self-tests (offline decision logic)
        run: |
          python3 scripts/business/build_markets.py --self-test
          python3 scripts/business/build_fx.py --self-test

      - name: Refresh markets (Yahoo, keyless)
        run: python3 scripts/business/build_markets.py

      - name: Refresh FX (exchangerate-api)
        env:
          EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
        run: python3 scripts/business/build_fx.py

      - name: Commit if anything changed
        run: |
          git add public/data/business/markets.json public/data/business/markets-history.json \
                  public/data/business/fx.json public/data/business/fx-history.json \
                  public/data/business/fx-series
          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git config user.name "business-refresh-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: daily markets + FX refresh [vercel skip]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."; exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push after retries." >&2; exit 1

      - name: Revalidate site caches (on-demand ISR)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          # Fail-open by design: the 6h ISR window on lib/business.ts fetches
          # is the backstop, so a missing secret or a failed ping must never
          # fail the data run. See app/api/revalidate/route.ts. Runs even on
          # no-change days; a redundant flush is harmless.
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping (6h ISR backstop applies)."
            exit 0
          fi
          # raw.githubusercontent serves from a ~5-min CDN cache; flushing
          # before it expires would re-render from the previous day's JSON and
          # re-cache THAT for 6h. Wait out the raw TTL, then flush.
          echo "Waiting out the GitHub raw CDN TTL before flushing..."
          sleep 300
          for attempt in 1 2 3; do
            code="$(curl -s -o /tmp/reval.out -w '%{http_code}' -X POST \
              -H "x-revalidate-secret: $REVALIDATE_SECRET" \
              "https://rankings.citizenofnowhere.org/api/revalidate?tag=business-daily")" || code=000
            if [ "$code" = "200" ]; then
              cat /tmp/reval.out; echo
              echo "Revalidated on attempt $attempt."
              # revalidateTag() only marks the cache entry dirty; it does NOT
              # regenerate it. Vercel serves the OLD copy (cache=STALE) to the
              # first request after invalidation and regenerates behind it, so
              # only the request AFTER THAT sees fresh content. Measured
              # 2026-08-06: nobody hit /business/markets for 67 minutes after a
              # confirmed-200 ping, so a real visitor ate the stale hit and saw
              # yesterday's data. Warm the hub pages here so THIS job eats it.
              # Best-effort and fail-open, same posture as the ping: parallel,
              # capped at 20s each, a failure never fails the run. Mirrors
              # _warm_paths() in mac-mini-jobs/runners/_common.sh -- keep the
              # two in step. Detail pages under /business/currencies/<code> are
              # deliberately NOT warmed: they have real traffic and the 6h ISR
              # window covers a rare miss.
              # SERIAL, not parallel -- mirrors _warm_paths() in mac-mini-jobs/runners/_common.sh.
              # The zone is on Cloudflare's FREE plan: one rate-limiting rule, a fixed 10-SECOND
              # counting window, and cached responses counted too ('requests to origin only' is a
              # paid parameter). So only a BURST can trip it. Firing these together with `&` put
              # every warm plus the POST above on the wire in one instant. A rate-limited warm
              # returns 429/1015, the fail-open posture swallows it, and the page is left cold --
              # the exact problem the warm exists to prevent. Keep this list short and serial.
              for p in /business /business/markets /business/currencies; do
                wcode="$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
                  "https://rankings.citizenofnowhere.org$p")" || wcode=000
                echo "warm $p -> HTTP $wcode"
                sleep 5
              done
              exit 0
            fi
            echo "revalidate ping attempt $attempt returned HTTP $code"
            sleep $((attempt * 5))
          done
          echo "WARN: on-demand revalidation failed; pages refresh via the 6h ISR window instead." >&2
