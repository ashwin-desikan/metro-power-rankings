name: Test

# Runs the unit test suites on every push/PR: Vitest for lib/ ranking and
# tier logic, pytest for the pure helpers in scripts/ (extract, sync,
# staging), and the table-scroll AST guard that catches tables silently
# losing mobile scroll/sticky behavior. Does not touch public/data or push
# anything; read-only checks.

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm test

      - name: Check table scroll wrapping
        run: npm run check:table-scroll

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run pytest suite
        run: pytest scripts/tests
