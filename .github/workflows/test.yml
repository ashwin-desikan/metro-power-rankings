name: Test

# Runs the unit test suites on every push/PR: Vitest for lib/ ranking and
# tier logic, pytest for the pure helpers in scripts/ (extract, sync,
# staging), and the table-scroll AST guard that catches tables silently
# losing mobile scroll/sticky behavior. Does not touch public/data or push
# anything; read-only checks.

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  # Guards the ignored-build-step script that decides whether a push costs a
  # production build. It let 13 through in one day on 2026-08-06, and the first
  # fix attempt nearly stopped legitimate ones instead. Both directions are
  # expensive and neither is visible by reading the diff, so it gets its own job.
  # fetch-depth: 0 is REQUIRED -- the cases are pinned to real shas and a shallow
  # clone would pass vacuously (the suite fails itself if too few cases run).
  vercel-ignore-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Verify the build-skip guard
        run: sh scripts/test-vercel-ignore.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm test

      - name: Check table scroll wrapping
        run: npm run check:table-scroll

      - name: Check mobile layout rules
        run: npm run check:mobile

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run pytest suite
        run: pytest scripts/tests
