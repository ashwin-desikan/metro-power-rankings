name: WC2026 daily simulation refresh

# Pulls the latest World Cup 2026 results, reconditions the Monte Carlo
# simulator, patches the knockout bracket, and commits the refreshed JSON with
# [vercel skip]. The page fetches wc2026.json + wc2026-sim.json at runtime via
# ISR (revalidate: 1800) from GitHub raw, so live odds update without a deploy.
# Primary results source is API-Football (api-sports.io); ESPN's public feed
# is an automatic fallback if that call fails. The simulator uses a fixed RNG
# seed, so output only changes when results change: quiet days produce no commit.

on:
  schedule:
    # Every 3 hours. Knockout matches finish at varied US/Mexico/Canada kickoff
    # times (often overnight UTC), so a once- or twice-daily run can leave a
    # result waiting up to ~12h. Every run is cheap and safe: it commits ONLY
    # when a result actually changed, and always with [vercel skip], so it never
    # triggers a Vercel build. Can revert to twice daily after the final (2026-07-19).
    - cron: "0 */3 * * *"
  workflow_dispatch: {}    # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write          # let the built-in GITHUB_TOKEN push the refreshed data

concurrency:
  group: wc2026-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy

      - name: Refresh results (api-sports primary, ESPN fallback)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          set -e
          ok=0
          if [ -n "$APISPORTS_KEY" ]; then
            if curl -s --fail -H "x-apisports-key: $APISPORTS_KEY" \
                 "https://v3.football.api-sports.io/fixtures?league=1&season=2026" \
                 -o /tmp/apisports.json; then
              if python3 scripts/parse-apisports-wc2026.py /tmp/apisports.json; then
                ok=1
                echo "Results sourced from api-sports."
              fi
            fi
          else
            echo "APISPORTS_KEY not set; using ESPN."
          fi
          if [ "$ok" -ne 1 ]; then
            echo "Falling back to ESPN public feed."
            mkdir -p /tmp/espn
            start=20260611
            end=20260719
            today=$(date -u +%Y%m%d)
            if [ "$today" -lt "$end" ]; then end=$today; fi
            d=$start
            while [ "$d" -le "$end" ]; do
              iso=$(echo "$d" | sed 's/\(....\)\(..\)\(..\)/\1-\2-\3/')
              curl -sf "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=$d" \
                -o "/tmp/espn/espn-$d.json" || echo "no data for $d"
              d=$(date -u -d "$iso +1 day" +%Y%m%d)
            done
            python3 scripts/parse-espn-wc2026.py /tmp/espn/*.json
          fi

      - name: Rebuild the simulation
        run: python3 scripts/build-wc2026-simulation.py

      - name: Patch bracket slots with real teams and scores
        run: python3 scripts/patch-wc2026-bracket.py

      - name: Commit and push only if anything changed
        run: |
          if git diff --quiet -- public/data/international/wc2026-sim.json \
                                  public/data/international/wc2026.json; then
            echo "No change in simulation output; nothing to deploy."
            exit 0
          fi
          git config user.name "wc2026-refresh-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/international/wc2026-results.json \
                  public/data/international/wc2026-sim.json \
                  public/data/international/wc2026.json
          git commit -m "Auto: refresh WC2026 bracket and projections [vercel skip]"
          # Integrate anything that landed on main during the run, then push.
          # Retry so a concurrent push (e.g. a human commit) cannot fail the job.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."; exit 0
            fi
            echo "Push race on attempt $attempt; retrying after fetch/rebase..."; sleep $((attempt * 5))
          done
          echo "Failed to push after retries." >&2; exit 1
