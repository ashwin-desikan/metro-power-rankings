name: Majors auto-update (ESPN -> Supabase -> site)

# Fully automatic, no human step. Daily it reads ESPN's golf and tennis feeds and,
# when a major shows final, records the new champion straight into the live
# golf_majors / tennis_majors Supabase tables (host metro auto-resolved from a
# prior edition of the same venue/tournament), then rebuilds the majors JSON from
# Supabase and commits it. It then appends the same champion to the public.champions
# ledger (scripts/champions/majors_to_champions.py, same template-the-previous-row
# idiom as the AFL/NRL finalizer) and re-emits public/data/champions-history.json,
# so /sports/champions and the Time Machine update in this same run too.
#
# NO BUILD (changed 2026-09-15). This commit used to omit [vercel skip] on
# purpose, because the golf/tennis hubs and the Current board all baked their
# JSON at build time, and the header here argued that ~8 majors a year made a
# build each cheap. Two things were wrong with that. It was not only ~8: the
# champions ledger in the same commit also carries boxing, the AFL/NRL premiers
# and anything else the finalizers append, which came to 7 real production
# builds in the 180 days to 2026-09-14. And the cost that matters is not the
# money, it is that a 05:30 UTC bot spends one of the 2 daily slots allowed by
# scripts/vercel-ignore.sh before anyone starts work.
#
# lib/majors.ts and lib/championsCurrent.ts now read their JSON at runtime from
# GitHub raw on an hourly ISR window, so this commit is skip-tagged and the
# champion is published by the revalidate ping below instead. Deliberately still
# build-time: the <ChampionBadge> on team pages, the metro Championship History
# and the all-time rolls, which pick the champion up on the next natural deploy.
# Idempotent: already-recorded champions are skipped and quiet days commit nothing.
#
# Needs the SUPABASE_WRITE_KEY repo secret (Supabase key with insert/update on the
# majors tables and public.champions). Without it the detect and ledger-append steps
# run dry and nothing is written.

on:
  schedule:
    - cron: "30 5 * * *"   # daily 05:30 UTC (finals finish the prior day)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: majors-ingest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      # The first three steps are stdlib-only (majors_ingest.py,
      # build-majors-data.py and majors_to_champions.py all use urllib), which is
      # why this workflow had no install step at all. The champions bridge in
      # 5640996d0 broke that assumption: build_champions.py imports requests.
      #
      # Exactly ONE run was lost, and the dating matters if you ever bisect this:
      # the bridge was committed 2026-09-11 20:00:52Z, AFTER that day's scheduled
      # run had already finished green at 09:51:05Z. The first run to carry it was
      # the 09-12 scheduled run (09:27:37Z), which died here with
      # ModuleNotFoundError -- and it died AFTER majors_ingest.py had written to
      # Supabase and the ledger append had run, so the cost was a red tile and a
      # champions-history.json that was never re-emitted, not bad data. Verified
      # fixed by a 09-12 16:10:45Z workflow_dispatch (scheduled runs land ~4h past
      # the 05:30 cron on shared runners, so judge freshness by run time, not cron).
      #
      # footy-refresh.yml, the other caller of build_champions.py, installs it
      # the same way.
      - name: Install deps (build_champions.py imports requests)
        run: pip install requests

      - name: Detect and record new major champions
        env:
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: |
          if [ -z "$SUPABASE_WRITE_KEY" ]; then
            echo "SUPABASE_WRITE_KEY not set; detect-only dry run (nothing written)."
          fi
          python3 scripts/ingest/majors_ingest.py

      - name: Rebuild majors JSON from Supabase
        run: python3 scripts/build-majors-data.py

      - name: Append new major champions to the champions ledger
        env:
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: |
          if [ -z "$SUPABASE_WRITE_KEY" ]; then
            echo "SUPABASE_WRITE_KEY not set; ledger-append dry run (nothing written)."
          fi
          python3 scripts/champions/majors_to_champions.py --self-test
          python3 scripts/champions/majors_to_champions.py --write

      - name: Re-emit champions JSON if the ledger gained a champion
        env:
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: |
          mkdir -p scripts/mktcap
          printf '%s' "$SUPABASE_WRITE_KEY" > scripts/mktcap/supabase_key.txt
          python3 scripts/champions/build_champions.py
          rm -f scripts/mktcap/supabase_key.txt

      - name: Commit refreshed JSON if anything changed
        id: commit
        run: |
          git add public/data/majors/golf.json public/data/majors/tennis.json public/data/majors/zzc-titles.json \
                  public/data/champions-history.json public/data/champions-metro-extra.json \
                  public/data/champions-current.json
          if git diff --cached --quiet; then
            echo "No change in majors output; nothing to publish."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "majors-update-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: record new major champion(s) [vercel skip]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying..."; sleep $((attempt * 5))
          done
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "Failed to push after retries." >&2; exit 1

      - name: Revalidate site caches (on-demand ISR)
        if: steps.commit.outputs.pushed == 'true'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          # Fail-open by design: the 1h ISR window on lib/majors.ts and
          # lib/championsCurrent.ts is the backstop, so a missing secret or a
          # failed ping must never fail the data run. See
          # app/api/revalidate/route.ts. Gated on an actual push, unlike the
          # business job: majors are crowned about eight times a year, so on
          # ~357 days of the year there is nothing to flush and no reason to
          # spend five minutes of runner time sleeping.
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping (1h ISR backstop applies)."
            exit 0
          fi
          # raw.githubusercontent serves from a ~5-min CDN cache; flushing
          # before it expires would re-render from the PREVIOUS champion list
          # and re-cache that for the full hour. Wait out the raw TTL, then
          # flush. Same reasoning as business-daily-refresh.yml.
          echo "Waiting out the GitHub raw CDN TTL before flushing..."
          sleep 300
          for tag in majors champions; do
            for attempt in 1 2 3; do
              code="$(curl -s -o /tmp/reval.out -w '%{http_code}' -X POST \
                -H "x-revalidate-secret: $REVALIDATE_SECRET" \
                "https://rankings.citizenofnowhere.org/api/revalidate?tag=$tag")" || code=000
              if [ "$code" = "200" ]; then
                cat /tmp/reval.out; echo
                echo "Revalidated '$tag' on attempt $attempt."
                break
              fi
              echo "revalidate ping for '$tag' attempt $attempt returned HTTP $code"
              sleep $((attempt * 5))
            done
          done
          # revalidateTag() only marks the entry dirty; it does not regenerate
          # it. Vercel serves the OLD copy to the first request after
          # invalidation and regenerates behind it, so only the request AFTER
          # that sees the new champion. Warm the three affected pages here so
          # THIS job eats the stale hit rather than the first real visitor.
          # SERIAL with a gap, not parallel: the zone is on Cloudflare's free
          # plan with a 10-second rate-limit window, and a burst trips it.
          # Mirrors business-daily-refresh.yml and _warm_paths() in
          # mac-mini-jobs/runners/_common.sh; keep the three in step.
          for p in /sports/champions /teams/tennis /teams/golf; do
            wcode="$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
              "https://rankings.citizenofnowhere.org$p")" || wcode=000
            echo "warm $p -> HTTP $wcode"
            sleep 5
          done
