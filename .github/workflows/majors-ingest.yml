name: Majors auto-update (ESPN -> Supabase -> site)

# Fully automatic, no human step. Daily it reads ESPN's golf and tennis feeds and,
# when a major shows final, records the new champion straight into the live
# golf_majors / tennis_majors Supabase tables (host metro auto-resolved from a
# prior edition of the same venue/tournament), then rebuilds the majors JSON from
# Supabase and commits it. It then appends the same champion to the public.champions
# ledger (scripts/champions/majors_to_champions.py, same template-the-previous-row
# idiom as the AFL/NRL finalizer) and re-emits public/data/champions-history.json,
# so /sports/champions and the Time Machine update in this same run too. The
# golf/tennis hubs and /sports/champions bake their JSON at build time (readFileSync),
# so the commit intentionally triggers a normal Vercel deploy to publish the champion
# — only ~8 majors a year, so a build each is cheap.
# Idempotent: already-recorded champions are skipped and quiet days commit nothing.
#
# Needs the SUPABASE_WRITE_KEY repo secret (Supabase key with insert/update on the
# majors tables and public.champions). Without it the detect and ledger-append steps
# run dry and nothing is written.

on:
  schedule:
    - cron: "30 5 * * *"   # daily 05:30 UTC (finals finish the prior day)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: majors-ingest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      # The first three steps are stdlib-only (majors_ingest.py,
      # build-majors-data.py and majors_to_champions.py all use urllib), which is
      # why this workflow had no install step at all. The champions bridge in
      # 5640996d0 broke that assumption: build_champions.py imports requests.
      #
      # Exactly ONE run was lost, and the dating matters if you ever bisect this:
      # the bridge was committed 2026-09-11 20:00:52Z, AFTER that day's scheduled
      # run had already finished green at 09:51:05Z. The first run to carry it was
      # the 09-12 scheduled run (09:27:37Z), which died here with
      # ModuleNotFoundError -- and it died AFTER majors_ingest.py had written to
      # Supabase and the ledger append had run, so the cost was a red tile and a
      # champions-history.json that was never re-emitted, not bad data. Verified
      # fixed by a 09-12 16:10:45Z workflow_dispatch (scheduled runs land ~4h past
      # the 05:30 cron on shared runners, so judge freshness by run time, not cron).
      #
      # footy-refresh.yml, the other caller of build_champions.py, installs it
      # the same way.
      - name: Install deps (build_champions.py imports requests)
        run: pip install requests

      - name: Detect and record new major champions
        env:
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: |
          if [ -z "$SUPABASE_WRITE_KEY" ]; then
            echo "SUPABASE_WRITE_KEY not set; detect-only dry run (nothing written)."
          fi
          python3 scripts/ingest/majors_ingest.py

      - name: Rebuild majors JSON from Supabase
        run: python3 scripts/build-majors-data.py

      - name: Append new major champions to the champions ledger
        env:
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: |
          if [ -z "$SUPABASE_WRITE_KEY" ]; then
            echo "SUPABASE_WRITE_KEY not set; ledger-append dry run (nothing written)."
          fi
          python3 scripts/champions/majors_to_champions.py --self-test
          python3 scripts/champions/majors_to_champions.py --write

      - name: Re-emit champions JSON if the ledger gained a champion
        env:
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: |
          mkdir -p scripts/mktcap
          printf '%s' "$SUPABASE_WRITE_KEY" > scripts/mktcap/supabase_key.txt
          python3 scripts/champions/build_champions.py
          rm -f scripts/mktcap/supabase_key.txt

      - name: Commit refreshed JSON if anything changed
        run: |
          git add public/data/majors/golf.json public/data/majors/tennis.json public/data/majors/zzc-titles.json \
                  public/data/champions-history.json public/data/champions-metro-extra.json
          if git diff --cached --quiet; then
            echo "No change in majors output; nothing to publish."
            exit 0
          fi
          git config user.name "majors-update-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: record new major champion(s)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."; exit 0
            fi
            echo "Push race on attempt $attempt; retrying..."; sleep $((attempt * 5))
          done
          echo "Failed to push after retries." >&2; exit 1
