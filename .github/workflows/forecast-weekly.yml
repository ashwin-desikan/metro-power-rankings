name: Election forecast refresh (Mon/Wed/Fri, no deploy)

# Re-scrapes the polling sources (Wikipedia polling tables; the GE2024
# constituency base is fetched once and kept), reruns the forecast
# simulation and commits public/data/forecast.json plus the accumulated
# inputs with [vercel skip]. /elections/forecast reads it via ISR from
# GitHub raw, so updates appear with no Vercel build. Stdlib only — no
# pip install needed.

# History: re-enabled 2026-08-01 when the forecast moved OFF the mini's weekly
# Sunday job (metro-mini-refresh.sh) onto this Action, so it refreshed ~3x/week
# instead of drifting a full week between Sunday runs. The forecast steps were
# removed from metro-mini-refresh.sh in the same change to avoid a double-run.
# Commits ride the skip marker; /elections and /elections/forecast ISR-read the
# JSON from GitHub raw, so no build is ever triggered.

# SCHEDULE RETIRED 2026-08-05: the Mac mini owns this job now. Second job to
# move, after business-daily.
#
# Why: GitHub dispatches cron 1-4h late in this repo, measured across 348
# schedule-event runs (20 Jul - 4 Aug). This was the worst-lagged slot on the
# board: the 06:00-06:10 UTC band averages ~3h50, and today's 06:10 slot landed
# at 08:49. The mini runs it at 06:10 UTC for real.
#
# The mini's copy is a literal port, guards included:
# mac-mini-jobs/runners/forecast.sh, scheduled by mac-mini-jobs/jobs.toml
# (weekdays [1,3,5], catchup 20h). Validated there on 5 Aug: DRY_RUN exercised
# the change-detected path (6 files staged, +239/-210, reset without
# committing), then the real run committed 25663fe3e and logged
# "Revalidated on attempt 1" after the 300s raw-CDN sleep.
#
# workflow_dispatch is KEPT ON PURPOSE as the manual fallback for when the mini
# is down. Run it from the Actions tab and it behaves exactly as before.
#
# ONE RUNNER RULE: do not re-enable the schedule while the mini's jobs.toml has
# forecast active, or the two race and produce duplicate commits.
#
# If the mini dies for good, uncomment the schedule below and delete the mini's
# entry. Freshness reverts to "Mon/Wed/Fri but ~4h late", not to broken.
#
# Watch item: the mini's first UNATTENDED forecast tick is Fri 2026-08-07
# 06:10Z. It is the first job to use the weekdays filter, and
# scripts/ops/staleness_check.py gives forecast.json a deliberately loose 9-day
# budget (it is change-gated), so a single missed run will NOT alert. If Friday
# is quiet, check the mini's dispatcher.log before assuming the data simply did
# not move.

on:
  # schedule:
  #   - cron: "10 6 * * 1,3,5"   # 06:10 UTC Mon/Wed/Fri
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forecast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Fetch polls + rebuild forecast
        run: |
          set -e
          python scripts/forecast/fetch_data.py
          python scripts/forecast/build_forecast.py
      - name: Commit if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/forecast.json data/forecast
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: weekly election forecast refresh [vercel skip]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Revalidate site caches (on-demand ISR)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          # Fail-open by design: the 6h ISR window on lib/forecast.ts is the
          # backstop, so a missing secret or a failed ping must never fail the
          # data run. See app/api/revalidate/route.ts. Runs even on no-change
          # days; a redundant flush is harmless.
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping (6h ISR backstop applies)."
            exit 0
          fi
          # raw.githubusercontent serves from a ~5-min CDN cache; flushing
          # before it expires would re-render from the previous forecast and
          # re-cache THAT for 6h. Wait out the raw TTL, then flush.
          echo "Waiting out the GitHub raw CDN TTL before flushing..."
          sleep 300
          for attempt in 1 2 3; do
            code="$(curl -s -o /tmp/reval.out -w '%{http_code}' -X POST \
              -H "x-revalidate-secret: $REVALIDATE_SECRET" \
              "https://rankings.citizenofnowhere.org/api/revalidate?tag=forecast-weekly")" || code=000
            if [ "$code" = "200" ]; then
              cat /tmp/reval.out; echo
              echo "Revalidated on attempt $attempt."
              # revalidateTag() invalidates but does NOT regenerate: Vercel
              # serves the OLD copy (cache=STALE) to the first request after
              # the flush and rebuilds behind it, so only the request AFTER
              # THAT sees fresh data. Measured 2026-08-06 on /business/markets,
              # where a real visitor ate the stale hit 67 minutes later. Warm
              # the pages here so this job takes that hit instead. Best-effort,
              # fail-open, parallel, 20s cap. Mirrors _warm_paths() in
              # mac-mini-jobs/runners/_common.sh -- keep the two in step.
              for p in /elections/forecast /predictions; do
                ( wcode="$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
                    "https://rankings.citizenofnowhere.org$p")" || wcode=000
                  echo "warm $p -> HTTP $wcode" ) &
              done
              wait
              exit 0
            fi
            echo "revalidate ping attempt $attempt returned HTTP $code"
            sleep $((attempt * 5))
          done
          echo "WARN: on-demand revalidation failed; pages refresh via the 6h ISR window instead." >&2
