name: AFL + NRL season refresh

# Daily in-season: pull the current AFL ladder and NRL ladder from ESPN, upsert
# each in-progress season into Supabase (public.afl_nrl_ladders, idempotent on
# sport+season+team), refresh the finals bracket feed
# (public/data/{afl,nrl}/finals.json, scripts/ingest/footy_finals.py), run the
# season-end finalizer (scripts/ingest/footy_finalize.py: minor premiership +
# finals flags at season end; Grand Final result + premiership flags + the
# champions-ledger append once ESPN shows a completed GF), rebuild the AFL/NRL
# hub JSON from Supabase, and commit. The build's Team List falls back to the
# committed all-teams.json, so no workbook is needed in CI. Quiet days produce
# no commit.
#
# Commit tagging: ladder/finals refreshes are ISR-from-raw ([vercel skip]).
# The run that crowns a premier also changes champions-history.json (and
# data.json's honours), which the site bakes at build time -- THAT commit goes
# untagged on purpose, so the champion triggers exactly one real build. That
# is twice a season (late Sep AFL, early Oct NRL), not a budget concern.
#
# September/October cadence: finals are played Thu-Sun evenings AEST; the
# extra crons put a refresh shortly after full time so brackets and scores
# land same-night, plus the finalizer fires within hours of the Grand Final.
#
# AFL uses ESPN australian-football/afl; NRL uses rugby-league/3 (league id 3,
# nickname displayNames, gamesWon/gamesLost/gamesDrawn) per lib/_footyStandings.ts.
#
# REQUIRES repo secret SUPABASE_WRITE_KEY (sb_secret_..., new key system).

on:
  schedule:
    - cron: "0 22 * * *"     # 22:00 UTC daily; ingests are a no-op in the offseason
    - cron: "0 6,12 * 9,10 *"  # finals season: post-match AEST catch-ups (Sep-Oct)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: footy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Ingest ESPN AFL ladder -> Supabase
        env:
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: python3 scripts/ingest/afl_ingest.py

      - name: Ingest ESPN NRL ladder -> Supabase
        env:
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: python3 scripts/ingest/nrl_ingest.py

      - name: Finals feed self-test, then refresh finals.json
        run: |
          python3 scripts/ingest/footy_finals.py --self-test
          python3 scripts/ingest/footy_finals.py

      - name: Season-end finalizer (flags, Grand Final, champions ledger)
        env:
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: |
          python3 scripts/ingest/footy_finalize.py --self-test
          python3 scripts/ingest/footy_finalize.py --write

      - name: Re-emit champions JSON if the ledger gained a premier
        env:
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: |
          mkdir -p scripts/mktcap
          printf '%s' "$SUPABASE_WRITE_KEY" > scripts/mktcap/supabase_key.txt
          python3 scripts/champions/build_champions.py
          rm -f scripts/mktcap/supabase_key.txt

      - name: Rebuild AFL/NRL hub JSON from Supabase
        run: python3 scripts/build-afl-nrl-data.py OtherLeagues.xlsx MetroAreas.xlsx public/data

      - name: Commit and push only if the data changed
        id: commit
        run: |
          PATHS="public/data/afl/data.json public/data/nrl/data.json \
                 public/data/afl/finals.json public/data/nrl/finals.json \
                 public/data/champions-history.json public/data/champions-metro-extra.json \
                 public/data/champions-current.json"
          if git diff --quiet -- $PATHS; then
            echo "No change in AFL/NRL data; nothing to deploy."
            echo "premier=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 2026-09-15: this used to drop [vercel skip] whenever
          # champions-history.json changed, because the Current board baked that
          # file in and a premier could not otherwise be published. The board now
          # reads public/data/champions-current.json at runtime
          # (lib/championsCurrent.ts), so a premier is published by the
          # revalidate ping below and EVERY commit from this job skips. The
          # message still says which one crowned a premier, because that is worth
          # seeing in the log, and it gates the ping.
          if git diff --quiet -- public/data/champions-current.json; then
            MSG="Auto: refresh AFL+NRL live seasons from ESPN [vercel skip]"
            echo "premier=false" >> "$GITHUB_OUTPUT"
          else
            MSG="Auto: AFL/NRL premier crowned -- champions + hubs updated [vercel skip]"
            echo "premier=true" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "footy-refresh-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit -m "$MSG"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."; exit 0
            fi
            echo "Push race on attempt $attempt; retrying..."; sleep $((attempt * 5))
          done
          echo "Failed to push after retries." >&2; exit 1

      - name: Revalidate the champions board (on-demand ISR)
        if: steps.commit.outputs.premier == 'true'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          # Only fires on the one run a season that crowns a premier. Fail-open:
          # the 1h ISR window on lib/championsCurrent.ts is the backstop, so a
          # missing secret or a failed ping must never fail the data run.
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping (1h ISR backstop applies)."
            exit 0
          fi
          # Wait out raw.githubusercontent's ~5-min CDN cache first, or the
          # flush re-renders from the previous list and re-caches THAT for the
          # hour. Same reasoning as business-daily-refresh.yml.
          echo "Waiting out the GitHub raw CDN TTL before flushing..."
          sleep 300
          for attempt in 1 2 3; do
            code="$(curl -s -o /tmp/reval.out -w '%{http_code}' -X POST \
              -H "x-revalidate-secret: $REVALIDATE_SECRET" \
              "https://rankings.citizenofnowhere.org/api/revalidate?tag=champions")" || code=000
            if [ "$code" = "200" ]; then
              cat /tmp/reval.out; echo
              echo "Revalidated on attempt $attempt."
              break
            fi
            echo "revalidate ping attempt $attempt returned HTTP $code"
            sleep $((attempt * 5))
          done
          # revalidateTag() marks the entry dirty but does not regenerate it, so
          # the first request after the flush still gets the stale copy. Warm the
          # board here so this job eats that hit, not a visitor.
          wcode="$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
            "https://rankings.citizenofnowhere.org/sports/champions")" || wcode=000
          echo "warm /sports/champions -> HTTP $wcode"
