name: MLB playoff odds refresh

# Deliberately SEPARATE from predictions-refresh.yml (PL + NFL) rather than a
# third step inside it. That workflow runs Tue/Fri because its ledgers freeze
# a pick the first time a fixture enters the 8-day window; moving it to daily
# would quietly freeze NFL picks earlier, on less information, mid-season.
# Baseball has no ledger and plays every day, so a September pennant race
# wants daily odds. Two cadences, two workflows.
#
# Months restricted to March-November: the regular season runs late March to
# early October and the postseason to early November. Out of season the script
# exits clean without writing (see main()), but there is no reason to burn a
# run every winter morning.
#
# Data-only commit riding [vercel skip]; /teams/mlb and /sports/standings read
# mlb-sim.json via ISR from GitHub raw, so no Vercel build is needed.

# SCHEDULE RETIRED 2026-08-07: the Mac mini's dispatcher owns this job now
# (mac-mini-jobs/jobs.toml, id "mlb-sim", 09:40 UTC). Retired because GitHub
# dispatches cron 1-4 hours late, measured across 348 runs, and a pennant race
# is exactly where that lateness is visible to a reader. Validated on the mini
# first: self-test 30/30, ESPN standings 30/30 teams, both warm pings 200.
#
# workflow_dispatch stays as the manual fallback. If the mini dies for good,
# uncomment the schedule below and comment out the mini's jobs.toml row --
# never both at once, or two runners race the same commit.
#
# jobs.toml's ROLLOUT STATE block is the authority for who owns what.
on:
  # schedule:
  #   - cron: "40 9 * 3-11 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mlb-sim-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Self-test (offline decision logic)
        run: python3 scripts/predictions/build_mlb_sim.py --self-test

      - name: Rebuild the MLB model
        # build() hard-fails if the derived W-L disagrees with ESPN's own
        # standings, so a silent schedule-parse break stops the run rather
        # than publishing a plausible-looking wrong table.
        run: python3 scripts/predictions/build_mlb_sim.py

      - name: Commit if anything changed
        run: |
          git add public/data/mlb-sim.json
          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git config user.name "predictions-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: refresh MLB playoff odds [vercel skip]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."; exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push after retries." >&2; exit 1

      - name: Revalidate site caches (on-demand ISR)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          # Fail-open by design, exactly as in predictions-refresh.yml: the 6h
          # ISR window on lib/mlbSim.ts is the backstop, so a missing secret or
          # a failed ping must never fail the data run.
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping (6h ISR backstop applies)."
            exit 0
          fi
          # raw.githubusercontent serves from a ~5-min CDN cache; flushing
          # before it expires would re-render from the previous model and
          # re-cache THAT for 6h. Wait out the raw TTL, then flush.
          echo "Waiting out the GitHub raw CDN TTL before flushing..."
          sleep 300
          for attempt in 1 2 3; do
            code="$(curl -s -o /tmp/reval.out -w '%{http_code}' -X POST \
              -H "x-revalidate-secret: $REVALIDATE_SECRET" \
              "https://rankings.citizenofnowhere.org/api/revalidate?tag=predictions-daily")" || code=000
            if [ "$code" = "200" ]; then
              cat /tmp/reval.out; echo
              echo "Revalidated on attempt $attempt."
              # revalidateTag() invalidates but does NOT regenerate: Vercel
              # serves the OLD copy (cache=STALE) to the first request after
              # the flush and rebuilds behind it, so only the request AFTER
              # THAT sees fresh data. Measured 2026-08-06 on /business/markets,
              # where a real visitor ate the stale hit 67 minutes later.
              # /predictions/mlb is the same shape of low-traffic page, so warm
              # it here and let this job take the hit. Best-effort, fail-open,
              # parallel, 20s cap. Mirrors _warm_paths() in
              # mac-mini-jobs/runners/_common.sh -- keep the two in step.
              # NOTE: predictions-refresh.yml shares the predictions-daily tag
              # but warms /predictions/pl and /predictions/nfl instead, because
              # a flush of the tag invalidates all three.
              # SERIAL, not parallel -- mirrors _warm_paths() in mac-mini-jobs/runners/_common.sh.
              # The zone is on Cloudflare's FREE plan: one rate-limiting rule, a fixed 10-SECOND
              # counting window, and cached responses counted too ('requests to origin only' is a
              # paid parameter). So only a BURST can trip it. Firing these together with `&` put
              # every warm plus the POST above on the wire in one instant. A rate-limited warm
              # returns 429/1015, the fail-open posture swallows it, and the page is left cold --
              # the exact problem the warm exists to prevent. Keep this list short and serial.
              for p in /predictions/mlb /predictions; do
                wcode="$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
                  "https://rankings.citizenofnowhere.org$p")" || wcode=000
                echo "warm $p -> HTTP $wcode"
                sleep 5
              done
              exit 0
            fi
            echo "revalidate ping attempt $attempt returned HTTP $code"
            sleep $((attempt * 5))
          done
          echo "WARN: on-demand revalidation failed; pages refresh via the 6h ISR window instead." >&2
