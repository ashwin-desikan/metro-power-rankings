# Daily rebuild of rankings.citizenofnowhere.org. Triggers a fresh Vercel
# production build so the next ETL-driven pages pull the latest external
# data without manual intervention. Two consumers benefit:
#
#   1. Home-page Featured Articles strip (hydrated from Substack RSS via
#      lib/substack.ts at build time).
#   2. Live MLB and NFL standings on /teams/{league}/[slug] pages
#      (lib/mlb-standings.ts and lib/standings.ts fetch ESPN at build
#      time and serve via 1-hour ISR thereafter). The daily rebuild puts
#      a fresh ESPN snapshot into the static cache once a day so the
#      in-progress season row reflects yesterday's games as soon as
#      readers wake up.
#
# Why this exists
#   Although both data sources self-refresh via Next ISR for request-time
#   renders, the statically generated pages only re-render on a fresh
#   build. A daily rebuild guarantees freshness within 24 hours even when
#   no other commit lands. Mirrors the pattern shipped on citizenofnowhere-brand.
#
# How it works
#   1. GitHub Actions invokes this workflow on the schedule below (and on
#      manual dispatch from the Actions tab).
#   2. The workflow POSTs to the Vercel Deploy Hook URL stored in the
#      VERCEL_DEPLOY_HOOK_URL repo secret.
#   3. Vercel queues a fresh production build of the main branch. The build
#      pulls the latest Substack RSS, regenerates the home-page HTML, and ships.
#
# Secret setup (one-time)
#   - In Vercel: Project Settings → Git → Deploy Hooks → Create Hook.
#       Name: daily-substack-refresh
#       Branch: main
#     Copy the URL it returns.
#   - In GitHub: Repo Settings → Secrets and variables → Actions → New
#     repository secret.
#       Name:  VERCEL_DEPLOY_HOOK_URL
#       Value: <the hook URL from Vercel>
#
# Cost / footprint
#   One HTTP POST per day. No checkout, no install, no build runtime burned in
#   GitHub. Vercel build minutes cost is identical to a manual redeploy.

name: Daily rebuild (Substack + live standings)

on:
  schedule:
    # 08:00 UTC daily. Chosen so the freshly-baked ESPN standings cache
    # reflects "yesterday's" MLB and NFL games:
    #   - East Coast late games end around 03:00-04:00 UTC.
    #   - West Coast late games end around 05:00-09:00 UTC. The 08:00
    #     timing catches almost all of them; the rare 12-inning Pacific
    #     game running past 09:00 UTC will simply be in the next day's
    #     refresh.
    # The team page's in-progress live row labels the data "as of
    # {yesterday}" so the date matches what readers see when they open
    # the page during US daytime hours.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

# Only one rebuild in flight at a time.
concurrency:
  group: daily-rebuild
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger-vercel-deploy:
    name: Trigger Vercel deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify secret is configured
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set. See workflow header for setup steps."
            exit 1
          fi
          echo "Secret present (length: ${#HOOK_URL})."

      - name: POST to Vercel Deploy Hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -H "Content-Type: application/json" \
            -d '{"trigger":"github-actions-daily"}' \
            "$HOOK_URL")
          echo "Vercel response: $response"
