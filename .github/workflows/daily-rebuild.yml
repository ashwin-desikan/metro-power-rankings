# Daily Substack snapshot refresh.
#
# Refreshes public/data/substack-feed.json from the live RSS feed and commits
# any change back to main with [vercel skip]. This snapshot is the build-time
# fallback for the home-page Featured Articles strip — lib/substack.ts always
# prefers the live ISR fetch, so the snapshot is only used when Substack is
# unreachable. Committing with [vercel skip] means the snapshot update never
# consumes a build slot.
#
# The daily Vercel deploy hook that used to live here has been removed (2026-06-27).
# It was originally needed to re-cache MLB/NBA/NHL standings and Substack posts.
# All three now use runtime ISR (fetch + revalidate) so a daily rebuild adds
# no value and wastes the build budget.
#
# Acceptable non-ISR exceptions tracked separately:
#   - fiba-ranking.yml  (FIBA rankings, readFileSync, ~few times/year)
#   - rugby-rankings.yml (World Rugby rankings, readFileSync, ~weekly in season)
# Those workflows intentionally trigger a Vercel build on the rare occasions
# the underlying data actually changes.

name: Daily Substack snapshot refresh

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-rebuild
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-snapshot:
    name: Refresh Substack feed snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh Substack snapshot
        continue-on-error: true
        run: node scripts/refresh-substack-feed.mjs

      - name: Commit snapshot if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/substack-feed.json; then
            echo "No snapshot changes; nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/substack-feed.json
            git commit -m "chore(substack): refresh feed snapshot [vercel skip]"
            git push origin HEAD:main
            echo "Pushed snapshot update."
          fi
