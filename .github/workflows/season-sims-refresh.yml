name: Season sims refresh (AFL/NRL/WNBA/CFL/NPB/MLS)

# Daily playoff + championship odds for the six non-MLB leagues, one script:
# scripts/predictions/build_season_sims.py.
#
# SCHEDULE RETIRED 2026-08-11: folded into the Mac mini's "mlb-sim" dispatcher
# job (mac-mini-jobs/jobs.toml, id "mlb-sim", now 14:30 UTC -- moved from its
# old 09:40 to this workflow's original time, since 14:30 is the only slot
# that also catches AFL/NRL/NPB evening games; MLB has no equivalent
# constraint). Retired for the same reason mlb-sim-refresh.yml was: reliable
# on-time firing beats GitHub's 1-4h-late cron dispatch, and running both at
# once double-commits the same six files.
#
# Known gap at retirement time: AFL/NRL (both sourced from afltables.com)
# failed to build on the mini's first live dry run -- afltables.com does not
# resolve through the mini's Tailscale DNS (SERVFAIL from 100.100.100.100)
# though it resolves fine via public resolvers (8.8.8.8, 1.1.1.1). Not a code
# issue: WNBA/CFL/NPB/MLS/MLB all built correctly in the same run. The mini
# job alerts (notify.py) on every partial failure, and lib/seasonSim.ts's
# 10-day simIsCurrent gate hides stale odds columns if this isn't fixed soon.
# Root-causing the Tailscale DNS routing is a separate, still-open thread.
#
# workflow_dispatch stays as the manual fallback. If the mini dies for good,
# uncomment the schedule below and comment out the mini's jobs.toml row --
# never both at once, or two runners race the same commit.
on:
  # schedule:
  #   - cron: "30 14 * 3-11 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: season-sims-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Self-test (offline parsers + bracket logic)
        run: python3 scripts/predictions/build_season_sims.py --self-test

      - name: Rebuild the season sims
        # Each builder hard-fails when its derived records disagree with the
        # source's own standings, so a parse break stops that league rather
        # than publishing a plausible-looking wrong table. A failed league
        # writes nothing; the others still write.
        run: |
          if ! python3 scripts/predictions/build_season_sims.py; then
            echo "PARTIAL_FAILURE=1" >> "$GITHUB_ENV"
          fi

      - name: Commit if anything changed
        run: |
          git add public/data/afl-sim.json public/data/nrl-sim.json \
                  public/data/wnba-sim.json public/data/cfl-sim.json \
                  public/data/npb-sim.json public/data/mls-sim.json \
                  public/data/nwsl-sim.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git config user.name "predictions-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: refresh season sims [vercel skip]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."; exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push after retries." >&2; exit 1

      - name: Revalidate site caches (on-demand ISR)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          # Fail-open, exactly as in mlb-sim-refresh.yml: the 6h ISR window on
          # lib/seasonSim.ts is the backstop. Wait out GitHub raw's ~5-min CDN
          # TTL first, or the flush re-caches the previous model for 6h.
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping (6h ISR backstop applies)."
            exit 0
          fi
          echo "Waiting out the GitHub raw CDN TTL before flushing..."
          sleep 300
          for attempt in 1 2 3; do
            code="$(curl -s -o /tmp/reval.out -w '%{http_code}' -X POST \
              -H "x-revalidate-secret: $REVALIDATE_SECRET" \
              "https://rankings.citizenofnowhere.org/api/revalidate?tag=predictions-daily")" || code=000
            if [ "$code" = "200" ]; then
              cat /tmp/reval.out; echo
              echo "Revalidated on attempt $attempt."
              # revalidateTag() invalidates but does not regenerate; warm the
              # main consumers so a real visitor doesn't eat the stale hit
              # (same rationale as mlb-sim-refresh.yml).
              # SERIAL, not parallel -- mirrors _warm_paths() in mac-mini-jobs/runners/_common.sh.
              # The zone is on Cloudflare's FREE plan: one rate-limiting rule, a fixed 10-SECOND
              # counting window, and cached responses counted too ('requests to origin only' is a
              # paid parameter). So only a BURST can trip it. Firing these together with `&` put
              # every warm plus the POST above on the wire in one instant. A rate-limited warm
              # returns 429/1015, the fail-open posture swallows it, and the page is left cold --
              # the exact problem the warm exists to prevent. Keep this list short and serial.
              for p in /sports/standings /teams/afl /teams/nrl /teams/wnba /teams/cfl /teams/baseball/npb /teams/wfootball /teams/wfootball/leagues/united-states; do
                wcode="$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
                  "https://rankings.citizenofnowhere.org$p")" || wcode=000
                echo "warm $p -> HTTP $wcode"
                sleep 5
              done
              break
            fi
            echo "revalidate ping attempt $attempt returned HTTP $code"
            sleep $((attempt * 5))
          done

      - name: Surface partial failures
        run: |
          if [ "${PARTIAL_FAILURE:-}" = "1" ]; then
            echo "One or more leagues failed to build (see the rebuild step)." >&2
            exit 1
          fi
