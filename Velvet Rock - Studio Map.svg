<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#1a1d24"/>
    </linearGradient>
    <radialGradient id="pinPrimary" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </radialGradient>
    <radialGradient id="pinSatellite" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a8b4c4"/>
      <stop offset="100%" stop-color="#6e7a8a"/>
    </radialGradient>
    <radialGradient id="pinIsland" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e85a9b"/>
      <stop offset="100%" stop-color="#a72d68"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- Title block -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" fill="#f3eed9" font-size="32" font-weight="700" letter-spacing="1">VELVET ROCK</text>
    <text x="0" y="28" fill="#a3a7b0" font-size="14" letter-spacing="2">THE GEOGRAPHY OF PRODUCER-DRIVEN MUSIC, 1974 TO 1989</text>
    <text x="0" y="56" fill="#7d8290" font-size="12" font-style="italic">Six cities, two islands. The transatlantic recording economy.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(800, 50)">
    <circle cx="10" cy="6" r="7" fill="url(#pinPrimary)"/>
    <text x="26" y="11" fill="#f3eed9" font-size="12" font-weight="500">Primary capital</text>
    <circle cx="10" cy="32" r="6" fill="url(#pinSatellite)"/>
    <text x="26" y="37" fill="#f3eed9" font-size="12" font-weight="500">Satellite</text>
    <circle cx="10" cy="58" r="6" fill="url(#pinIsland)"/>
    <text x="26" y="63" fill="#f3eed9" font-size="12" font-weight="500">Offshore island branch</text>
  </g>

  <!-- Stylized world land masses (rough silhouettes, equirectangular-ish) -->
  <g fill="#222732" stroke="#2e3543" stroke-width="0.8">
    <!-- North America -->
    <path d="M 95 220 Q 115 195 145 195 L 215 200 Q 250 205 270 220 L 305 250 Q 320 270 305 295 L 290 320 Q 270 345 230 355 L 195 365 Q 165 360 145 345 L 120 320 Q 95 295 90 270 Z"/>
    <!-- Central America / Mexico -->
    <path d="M 240 350 Q 260 360 280 380 L 300 405 Q 305 420 290 425 L 270 420 Q 250 405 240 385 Z"/>
    <!-- South America -->
    <path d="M 285 415 Q 310 420 325 440 L 340 480 Q 348 530 335 565 L 320 595 Q 305 610 290 605 L 275 580 Q 268 540 275 495 L 280 450 Z"/>
    <!-- Europe -->
    <path d="M 555 205 Q 580 190 615 195 L 650 205 Q 680 215 690 235 L 685 260 Q 670 280 645 285 L 615 290 Q 585 285 565 270 L 550 245 Z"/>
    <!-- Scandinavia bump -->
    <path d="M 605 165 Q 625 158 645 165 L 660 185 Q 660 200 645 205 L 620 205 Q 605 198 600 185 Z"/>
    <!-- British Isles -->
    <path d="M 528 215 Q 540 208 552 215 L 555 240 Q 550 255 538 255 L 525 245 Z"/>
    <!-- Africa -->
    <path d="M 580 295 Q 615 295 645 305 L 670 340 Q 680 380 670 425 L 650 470 Q 625 500 600 505 L 575 495 Q 555 470 555 430 L 558 385 Q 562 340 575 305 Z"/>
    <!-- Asia -->
    <path d="M 695 205 Q 745 195 810 205 L 880 220 Q 930 235 970 260 L 990 295 Q 985 320 955 335 L 905 345 Q 855 340 820 325 L 770 305 Q 720 285 695 260 Z"/>
    <!-- India -->
    <path d="M 800 320 Q 825 320 840 340 L 845 380 Q 835 395 815 395 L 795 380 Q 790 350 800 325 Z"/>
    <!-- Southeast Asia / archipelago -->
    <path d="M 905 380 Q 925 380 940 395 L 950 415 Q 945 430 925 430 L 905 420 Z"/>
    <!-- Australia -->
    <path d="M 945 470 Q 975 465 1005 475 L 1030 495 Q 1035 520 1020 535 L 990 545 Q 965 540 950 525 L 940 500 Z"/>
    <!-- Japan -->
    <path d="M 985 270 Q 998 265 1005 280 L 1008 305 Q 1000 312 990 308 L 985 290 Z"/>
  </g>

  <!-- Caribbean inset frame -->
  <g transform="translate(155, 365)">
    <rect x="0" y="0" width="220" height="155" rx="6" ry="6" fill="#13161c" stroke="#3b4252" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="10" y="16" fill="#a3a7b0" font-size="10" letter-spacing="1.5">CARIBBEAN DETAIL</text>
    <!-- Inset land sketches -->
    <g fill="#222732" stroke="#2e3543" stroke-width="0.6">
      <path d="M 20 35 Q 50 28 80 32 L 95 45 Q 100 58 88 65 L 60 68 Q 35 62 22 55 Z"/>
      <path d="M 100 75 Q 115 70 130 75 L 138 85 Q 138 95 125 98 L 110 95 Q 100 88 100 80 Z"/>
      <path d="M 145 100 Q 158 96 170 100 L 175 110 Q 170 118 158 118 L 148 112 Z"/>
    </g>
    <!-- Nassau pin (inset) -->
    <g transform="translate(55, 50)">
      <circle r="9" fill="url(#pinIsland)" filter="url(#glow)"/>
      <circle r="3" fill="#fff"/>
      <text x="14" y="3" fill="#f3eed9" font-size="11" font-weight="600">Nassau</text>
      <text x="14" y="16" fill="#a3a7b0" font-size="9">Compass Point</text>
    </g>
    <!-- Plymouth Montserrat pin (inset) -->
    <g transform="translate(160, 112)">
      <circle r="9" fill="url(#pinIsland)" filter="url(#glow)"/>
      <circle r="3" fill="#fff"/>
      <text x="-90" y="3" fill="#f3eed9" font-size="11" font-weight="600" text-anchor="end">Montserrat (Salem)</text>
      <text x="-90" y="16" fill="#a3a7b0" font-size="9" text-anchor="end">AIR Montserrat</text>
    </g>
  </g>

  <!-- Main world map pins -->
  <!-- Los Angeles -->
  <g transform="translate(155, 285)">
    <circle r="11" fill="url(#pinPrimary)" filter="url(#glow)"/>
    <circle r="4" fill="#fff"/>
    <text x="-18" y="-18" fill="#f3eed9" font-size="13" font-weight="700" text-anchor="end">LOS ANGELES</text>
    <text x="-18" y="-4" fill="#c9a227" font-size="10" text-anchor="end">Village Recorder · Sunset Sound</text>
    <text x="-18" y="9" fill="#7d8290" font-size="9" text-anchor="end">Aja · Off the Wall · Thriller</text>
  </g>

  <!-- New York -->
  <g transform="translate(285, 268)">
    <circle r="11" fill="url(#pinPrimary)" filter="url(#glow)"/>
    <circle r="4" fill="#fff"/>
    <text x="18" y="-12" fill="#f3eed9" font-size="13" font-weight="700">NEW YORK</text>
    <text x="18" y="2" fill="#c9a227" font-size="10">Power Station · A&amp;R</text>
    <text x="18" y="15" fill="#7d8290" font-size="9">The Nightfly · mixing capital</text>
  </g>

  <!-- Philadelphia -->
  <g transform="translate(275, 290)">
    <circle r="8" fill="url(#pinSatellite)" filter="url(#glow)"/>
    <circle r="2.5" fill="#fff"/>
    <text x="14" y="22" fill="#f3eed9" font-size="11" font-weight="600">Philadelphia</text>
    <text x="14" y="33" fill="#a3a7b0" font-size="9">Sigma Sound</text>
  </g>

  <!-- London -->
  <g transform="translate(538, 230)">
    <circle r="11" fill="url(#pinPrimary)" filter="url(#glow)"/>
    <circle r="4" fill="#fff"/>
    <text x="-18" y="-12" fill="#f3eed9" font-size="13" font-weight="700" text-anchor="end">LONDON</text>
    <text x="-18" y="2" fill="#c9a227" font-size="10" text-anchor="end">AIR · Townhouse · Sarm</text>
    <text x="-18" y="15" fill="#7d8290" font-size="9" text-anchor="end">Diamond Life · sophisti-pop</text>
  </g>

  <!-- Bath / Somerset -->
  <g transform="translate(528, 252)">
    <circle r="8" fill="url(#pinSatellite)" filter="url(#glow)"/>
    <circle r="2.5" fill="#fff"/>
    <text x="-12" y="20" fill="#f3eed9" font-size="11" font-weight="600" text-anchor="end">Bath / Somerset</text>
    <text x="-12" y="31" fill="#a3a7b0" font-size="9" text-anchor="end">Wool Hall · Ashcombe</text>
  </g>

  <!-- Stockholm -->
  <g transform="translate(625, 180)">
    <circle r="8" fill="url(#pinSatellite)" filter="url(#glow)"/>
    <circle r="2.5" fill="#fff"/>
    <text x="14" y="-4" fill="#f3eed9" font-size="11" font-weight="600">Stockholm</text>
    <text x="14" y="8" fill="#a3a7b0" font-size="9">Polar Studios</text>
  </g>

  <!-- Munich (parenthetical) -->
  <g transform="translate(605, 235)" opacity="0.65">
    <circle r="6" fill="url(#pinSatellite)" stroke="#444c5b" stroke-dasharray="2 2"/>
    <circle r="2" fill="#fff"/>
    <text x="11" y="3" fill="#a3a7b0" font-size="10" font-style="italic">Munich (Musicland)</text>
  </g>

  <!-- Connecting lines: the transatlantic mixing flow -->
  <g stroke="#3a3f4d" stroke-width="0.8" stroke-dasharray="3 4" fill="none" opacity="0.7">
    <!-- Compass Point to Power Station (mixing) -->
    <path d="M 210 415 Q 250 350 285 268"/>
    <!-- AIR Montserrat to Power Station -->
    <path d="M 315 477 Q 305 380 290 270"/>
    <!-- London to AIR Montserrat (parent studio) -->
    <path d="M 540 232 Q 420 320 320 478"/>
  </g>

  <!-- Footer caption block -->
  <g transform="translate(60, 660)">
    <text x="0" y="0" fill="#7d8290" font-size="11">
      Citizen of Nowhere · The Velvet Rock Index ranks eight metros by their concentration in the producer-driven recording economy of 1974 to 1989.
    </text>
    <text x="0" y="18" fill="#5e636e" font-size="10" font-style="italic">
      Dashed lines indicate the transatlantic tracking-to-mixing flow that produced the era's signature records. Both island studios closed (Compass Point 2010; AIR Montserrat destroyed September 17, 1989, by Hurricane Hugo).
    </text>
  </g>
</svg>
