# Schedule table for dispatcher.py. Every time is UTC. Never local time:
# launchd calendar intervals are local, which silently shifts every slot by an
# hour twice a year, and these slots were chosen against market and fixture
# clocks, not against British Summer Time.
#
# weekdays: ISO, 1=Mon .. 7=Sun. Empty or absent = every day.
# months:   1-12. Empty or absent = all year.
# catchup_hours: how late a slot may still usefully run. Past this the
#   dispatcher records MISSED and alerts rather than firing a stale slot just
#   before the next one is due. Daily jobs get less room than multi-day ones,
#   because for a daily job "tomorrow" is close and for a Tue/Fri job it is not.
# lookback_days: how far back to search for a live occurrence. Leave at the
#   default (8) unless a job runs rarer than weekly. It must not span a seasonal
#   gap or the first tick of a new season fires a spurious MISSED for the last
#   slot of the previous one. Monthly jobs are fine on the default: they resolve
#   the 1st for the first week and then read off-schedule, which is correct.
#
# The four keys below were added 2026-08-06 for the legacy-launchd migration
# (see DST-MIGRATION.md). Nothing uses them yet; they are here so the moves are
# mechanical rather than blocked.
#
# times:    a list, for the jobs with more than one slot a day, e.g.
#             times = ["04:00", "05:00"]
#           Use `time` OR `times`, never both; the dispatcher refuses to start
#           on a table that sets both. State is compared against the exact slot
#           rather than the date, so the second run of a day is not swallowed.
# days:     day-of-month filter, for the two monthly jobs, e.g. days = [1].
#           Composes with weekdays and months.
# args:     positional arguments for the command, e.g. args = ["conflicts"].
#           Four legacy jobs are the SAME script (run-scraper-refresh.sh)
#           distinguished only by one of conflicts|fiba|rugby|substack.
# hc_slug:  opt this job into hc-run.sh, which pings hc-ping.com start/success/
#           fail and gives the job its own tile on the healthchecks dashboard.
#           Every legacy plist wraps its command this way, so a job that moves
#           here WITHOUT hc_slug silently trades a per-job tile for the
#           fleet-wide notify.py alert. Opt-in on purpose: the four jobs that
#           migrated before this existed have no tiles provisioned.
#
# A malformed table is now a hard startup failure rather than a silently
# skipped job. Run `dispatcher.py --self-test` after any edit here; it
# validates this file as its last case.
#
# Each of these mirrors a GitHub workflow whose schedule: block must be
# commented out when the job goes live here. Keep workflow_dispatch in the YAML
# as the manual fallback for when the mini is down. ONE runner per job.

# ROLLOUT STATE (keep this file honest: it is what a fresh clone would run).
# Enabled here == the GitHub schedule for the same job is commented out. The two
# must move together or you get duplicate commits.
#
#   business-daily   LIVE on the mini since 2026-08-05. Action schedule retired.
#   forecast         LIVE on the mini since 2026-08-05. Action schedule retired.
#   predictions-tue  NOT YET. Action still owns it. Unblocked, see ESPN UA below.
#   predictions-fri  NOT YET. Action still owns it. Unblocked, see ESPN UA below.
#   mlb-sim          NOT YET. Action still owns it. Unblocked, see ESPN UA below.
#
# The four below stay commented until each is DRY_RUN-validated on the mini, one
# per day, in that order. Uncommenting one without retiring its Action schedule
# is the failure this comment exists to prevent.
#
# ESPN UA, RESOLVED 2026-08-05. Keep forecast first anyway: its scripts touch
# Wikipedia and parliament.uk only, so it is the one job with no exposure here.
#
# The other three all make REQUIRED (soft=False) calls to site.api.espn.com,
# whose failure path is SystemExit, not a degraded run. They were briefly
# thought to be permanently stuck on Actions because the mini gets Akamai 403s
# from that host. That was a User-Agent problem, not an IP block: Akamai's ESPN
# edge applies DIFFERENT UA policy per PoP, and the mini's edge rejects the
# "CitizenOfNowhere/1.0" token the three scripts used to hardcode, while the
# Windows box accepts it. All three now send no User-Agent and inherit urllib's
# own library token, the only shape that passed from every vantage measured.
# Full matrix in build_mlb_sim.py's fetch_json docstring.
#
# So the three are migratable. Before uncommenting any of them, confirm the
# runner side is still green (mlb-sim-refresh dispatched on the UA change,
# 2026-08-05) and DRY_RUN each on the mini as usual. Do NOT re-point them at
# sports.core.api.espn.com: different shape, and it only covers the soft
# futures call. See HANDOFF.md 2026-08-05 for the measured tables.

[[job]]
id = "business-daily"          # .github/workflows/business-daily-refresh.yml (schedule retired)
time = "05:50"                 # after Asia's close, before the European open
command = "runners/business-daily.sh"
catchup_hours = 14
timeout_minutes = 25

[[job]]
id = "forecast"                # .github/workflows/forecast-weekly.yml (schedule retired)
time = "06:10"
weekdays = [1, 3, 5]           # Mon/Wed/Fri
command = "runners/forecast.sh"
catchup_hours = 20
timeout_minutes = 45

