# Schedule table for dispatcher.py. Every time is UTC. Never local time:
# launchd calendar intervals are local, which silently shifts every slot by an
# hour twice a year, and these slots were chosen against market and fixture
# clocks, not against British Summer Time.
#
# weekdays: ISO, 1=Mon .. 7=Sun. Empty or absent = every day.
# months:   1-12. Empty or absent = all year.
# catchup_hours: how late a slot may still usefully run. Past this the
#   dispatcher records MISSED and alerts rather than firing a stale slot just
#   before the next one is due. Daily jobs get less room than multi-day ones,
#   because for a daily job "tomorrow" is close and for a Tue/Fri job it is not.
# lookback_days: how far back to search for a live occurrence. Leave at the
#   default (8) unless a job runs rarer than weekly. It must not span a seasonal
#   gap or the first tick of a new season fires a spurious MISSED for the last
#   slot of the previous one. Monthly jobs are fine on the default: they resolve
#   the 1st for the first week and then read off-schedule, which is correct.
#
# The four keys below were added 2026-08-06 for the legacy-launchd migration
# (see DST-MIGRATION.md). Nothing uses them yet; they are here so the moves are
# mechanical rather than blocked.
#
# times:    a list, for the jobs with more than one slot a day, e.g.
#             times = ["04:00", "05:00"]
#           Use `time` OR `times`, never both; the dispatcher refuses to start
#           on a table that sets both. State is compared against the exact slot
#           rather than the date, so the second run of a day is not swallowed.
# days:     day-of-month filter, for the two monthly jobs, e.g. days = [1].
#           Composes with weekdays and months.
# args:     positional arguments for the command, e.g. args = ["conflicts"].
#           Four legacy jobs are the SAME script (run-scraper-refresh.sh)
#           distinguished only by one of conflicts|fiba|rugby|substack.
# hc_slug:  opt this job into hc-run.sh, which pings hc-ping.com start/success/
#           fail and gives the job its own tile on the healthchecks dashboard.
#           Every legacy plist wraps its command this way, so a job that moves
#           here WITHOUT hc_slug silently trades a per-job tile for the
#           fleet-wide notify.py alert. Opt-in on purpose: the four jobs that
#           migrated before this existed have no tiles provisioned.
#
# A malformed table is now a hard startup failure rather than a silently
# skipped job. Run `dispatcher.py --self-test` after any edit here; it
# validates this file as its last case.
#
# Each of these mirrors a GitHub workflow whose schedule: block must be
# commented out when the job goes live here. Keep workflow_dispatch in the YAML
# as the manual fallback for when the mini is down. ONE runner per job.

# ROLLOUT STATE (keep this file honest: it is what a fresh clone would run).
# Enabled here == the GitHub schedule for the same job is commented out. The two
# must move together or you get duplicate commits.
#
#   business-daily   LIVE on the mini since 2026-08-05. Action schedule retired.
#   forecast         LIVE on the mini since 2026-08-05. Action schedule retired.
#   predictions-tue  LIVE on the mini since 2026-08-07. Action schedule retirement pending Windows.
#   predictions-fri  LIVE on the mini since 2026-08-07. Action schedule retirement pending Windows.
#   mlb-sim          LIVE on the mini since 2026-08-07. Action schedule retirement pending Windows.
#
# The four below stay commented until each is DRY_RUN-validated on the mini, one
# per day, in that order. Uncommenting one without retiring its Action schedule
# is the failure this comment exists to prevent.
#
# ESPN UA, RESOLVED 2026-08-05. Keep forecast first anyway: its scripts touch
# Wikipedia and parliament.uk only, so it is the one job with no exposure here.
#
# The other three all make REQUIRED (soft=False) calls to site.api.espn.com,
# whose failure path is SystemExit, not a degraded run. They were briefly
# thought to be permanently stuck on Actions because the mini gets Akamai 403s
# from that host. That was a User-Agent problem, not an IP block: Akamai's ESPN
# edge applies DIFFERENT UA policy per PoP, and the mini's edge rejects the
# "CitizenOfNowhere/1.0" token the three scripts used to hardcode, while the
# Windows box accepts it. All three now send no User-Agent and inherit urllib's
# own library token, the only shape that passed from every vantage measured.
# Full matrix in build_mlb_sim.py's fetch_json docstring.
#
# So the three are migratable. Before uncommenting any of them, confirm the
# runner side is still green (mlb-sim-refresh dispatched on the UA change,
# 2026-08-05) and DRY_RUN each on the mini as usual. Do NOT re-point them at
# sports.core.api.espn.com: different shape, and it only covers the soft
# futures call. See HANDOFF.md 2026-08-05 for the measured tables.

[[job]]
id = "business-daily"          # .github/workflows/business-daily-refresh.yml (schedule retired)
time = "05:50"                 # after Asia's close, before the European open
command = "runners/business-daily.sh"
catchup_hours = 14
timeout_minutes = 25

[[job]]
id = "forecast"                # .github/workflows/forecast-weekly.yml (schedule retired)
time = "06:10"
weekdays = [1, 3, 5]           # Mon/Wed/Fri
command = "runners/forecast.sh"
catchup_hours = 20
timeout_minutes = 45

[[job]]
id = "predictions-tue"         # .github/workflows/predictions-refresh.yml, slot 1 (schedule retirement pending Windows)
time = "06:40"                 # grade the weekend's games with final results
weekdays = [2]
command = "runners/predictions.sh"
catchup_hours = 20
timeout_minutes = 45

[[job]]
id = "predictions-fri"         # .github/workflows/predictions-refresh.yml, slot 2 (schedule retirement pending Windows)
time = "11:40"                 # fresh odds + picks ahead of the weekend
weekdays = [5]
command = "runners/predictions.sh"
catchup_hours = 20
timeout_minutes = 45

[[job]]
id = "mlb-sim"                 # .github/workflows/mlb-sim-refresh.yml (schedule to be retired by Windows)
time = "09:40"
months = [3, 4, 5, 6, 7, 8, 9, 10, 11]   # regular season + postseason
command = "runners/mlb-sim.sh"
catchup_hours = 14
timeout_minutes = 25

# ---------------------------------------------------------------------------
# LEGACY LAUNCHD MIGRATION (see DST-MIGRATION.md). Separate thread from the
# GitHub-Actions rollout above: these jobs already run on the mini, just on
# their own StartCalendarInterval plists in LOCAL time, which shifts them an
# hour against UTC when the clocks go back on 25 October 2026.
#
# Rollout state:
#   activity-feed      LIVE on the mini since 2026-08-06. Plist unloaded.
#   substack-daily     LIVE on the mini since 2026-08-06. Plist unloaded.
#   euro-comps         LIVE on the mini since 2026-08-06. Plist unloaded.
#   gap-league-watch   LIVE on the mini since 2026-08-06. Plist unloaded.
#   football-standings LIVE on the mini since 2026-08-06. Plist unloaded.
#   screen-number-ones LIVE on the mini since 2026-08-07. Plist unloaded.
#   rugby-weekly       LIVE on the mini since 2026-08-07. Plist unloaded.
#   cricket-weekly     LIVE on the mini since 2026-08-07. Plist unloaded.
#   fiba-weekly        LIVE on the mini since 2026-08-07. Plist unloaded.
#   sound-weekly       LIVE on the mini since 2026-08-07. Plist unloaded.
#   feed-monitor       LIVE on the mini since 2026-08-07. Plist unloaded.
#   conflicts-monthly  LIVE on the mini since 2026-08-07. Plist unloaded.
#   cricket-monthly    LIVE on the mini since 2026-08-07. Plist unloaded.
#   egress-refresh     LIVE on the mini since 2026-08-07. Plist unloaded. Was
#                      exit-126 since 2026-08-02 (macOS Full Disk Access gate
#                      on launchd, fixed by Ashwin); migrated same-day on a
#                      real successful full-pipeline run, not Sunday's slot.
#
# The order is chosen to prove ONE unexercised mechanism at a time, on the
# fastest-feedback job available, so a mistake shows up the next morning
# rather than next month. activity-feed proved hc_slug and $HOME expansion;
# substack-daily proves args; euro-comps proves times. After those three
# nothing else is new and the remaining eleven are mechanical.
#
# ⚠️ THE FLIP IS NOT THE SAME SHAPE AS THE ACTIONS ONE. For those, both
# runners live briefly and the overlap is harmless, because GitHub's 1-4h
# dispatch lag separates them in practice. Here BOTH runners are the mini and
# both fire at the same UTC minute, so an overlap is a genuine race: two
# copies of the same script doing git pull / commit / push against one
# working tree. So uncomment the row below and `launchctl unload` the plist
# in the SAME sitting, having proved the invocation by hand first.

[[job]]
id = "activity-feed"           # launchd/com.citizenofnowhere.activity-feed.plist (unloaded)
time = "02:30"                 # was 03:30 LOCAL, which is 02:30 UTC today
command = "$HOME/Projects/Metro Area Project/mac-mini-jobs/run-activity-feed.sh"
hc_slug = "activity-feed"      # keep the existing healthchecks tile
catchup_hours = 14
timeout_minutes = 20
#
# Notes for whoever flips this:
#  - The command is a $HOME path ON PURPOSE. Unlike most jobs, this one runs
#    from the repo checkout, not from ~/metro-mini-jobs/. The dispatcher
#    expands ~ and $VARS before deciding whether a path is absolute, so both
#    styles work, but the path contains spaces and must stay quoted here.
#  - hc_slug reproduces exactly what the plist does today
#    (hc-run.sh activity-feed ...), so the healthchecks tile carries over
#    rather than going dark.
#  - 02:30 UTC preserves today's effective time. After 25 October the plist
#    would have drifted to 03:30 UTC; this row will not.
#  - The script is already safe to run twice (it early-exits when the feed is
#    unchanged, and its own commits are excluded from the feed), but that is
#    not a licence to leave both runners live: the race is on git, not on the
#    data.

# --- NEXT: substack-daily. The job that proves `args`. ---------------------
# Daily, single slot, one positional. run-scraper-refresh.sh is shared by four
# jobs and reads exactly one of conflicts|fiba|rugby|substack (confirmed by the
# mini: JOB="${1:?...}", case-matched, fail on anything else). It lives in
# ~/metro-mini-jobs/, so the command is relative to HERE, unlike activity-feed.
#
[[job]]
id = "substack-daily"          # launchd/com.citizenofnowhere.substack-daily.plist (unloaded)
time = "06:00"                 # was 07:00 LOCAL = 06:00 UTC today
command = "run-scraper-refresh.sh"
args = ["substack"]
hc_slug = "substack-daily"
catchup_hours = 14
timeout_minutes = 20

# --- THEN: euro-comps. The job that proves `times`. ------------------------
# Two slots a day, an hour apart. This is the first row where last_slot rather
# than last_run_date does the work: after the 03:00 run, the 04:00 run must
# still be seen as due, and a date-only comparison would swallow it. Verify on
# the mini that BOTH fire, not just the first — that is the whole point of the
# move and the one thing a single morning's glance could miss.
#
[[job]]
id = "euro-comps"              # launchd/com.citizenofnowhere.euro-comps.plist (unloaded)
time = "04:00"                 # SIMPLIFIED 2026-08-06, was times ["03:00","04:00"].
                               # The pair was my error: the old plist bracketed
                               # local 04:00+05:00 and the script's UTC guard ran
                               # the real job only at 04:00 UTC, so it was always
                               # ONE run, fired twice and filtered. The 03:00 slot
                               # could never do anything. Behaviour-neutral change.
command = "run-euro-comps.sh"
hc_slug = "euro-comps"
catchup_hours = 12
timeout_minutes = 30
#
# run-euro-comps.sh's own internal UTC-hour guard (a leftover from when the
# plist bracketed local 04:00/05:00 to survive the DST switch) is deleted as
# of this commit, now that the row above is single-slot. jobs.toml is the only
# schedule for this job.

# --- BATCH 3: gap-league-watch and football-standings ----------------------
# Both are repo-checkout jobs, so their commands are $HOME paths. Both carry an
# internal UTC-hour guard today; see DST-MIGRATION.md, "delete the guards as
# each job migrates". In both rows below the slots MATCH the guard exactly, so
# the flip is safe whether or not the guard is removed first. Remove it anyway,
# for hygiene, in the SAME sitting as unloading the plist and never before:
# these scripts run straight from the repo checkout, so a guard deleted while
# the plist is still loaded takes effect on the mini's next git pull and the
# job starts firing at BOTH bracketed local hours.

[[job]]
id = "gap-league-watch"        # launchd/com.citizenofnowhere.gap-league-watch.plist (unloaded)
time = "05:00"                 # NOT a pair. The plist brackets local 05:00+06:00
                                # and the script's guard picks 05:00 UTC; one run.
command = "$HOME/Projects/Metro Area Project/mac-mini-jobs/run-gap-league-watch.sh"
hc_slug = "gap-league-watch"
catchup_hours = 14
timeout_minutes = 20

# --- football-standings: this one CHANGES behaviour, deliberately ----------
# Ashwin's call, 2026-08-06: restore the documented cadence. The script's own
# header says "Scheduled 4x/day at 05:00, 11:00, 17:00, 23:00 UTC" and its guard
# allows all four, but the plist only ever fires local 05:00+06:00, so 05:00 is
# the only UTC hour it can reach. The 11:00, 17:00 and 23:00 runs have never
# happened, and the site's live standings and continental fixtures have been
# refreshing once a day rather than four times.
#
# This row is therefore NOT a like-for-like port. It quadruples this job's
# api-football request usage. Watch for 429s or quota warnings in the first few
# days; if they appear, drop to ["05:00", "17:00"] rather than reverting to one.
#
[[job]]
id = "football-standings"      # launchd/com.citizenofnowhere.football-standings.plist (unloaded)
times = ["05:00", "11:00", "17:00", "23:00"]
command = "$HOME/Projects/Metro Area Project/mac-mini-jobs/run-football-standings.sh"
hc_slug = "football-standings"
catchup_hours = 4              # deliberately short: slots are 6h apart, so a
                                # slot missed by more than 4h should be recorded
                                # MISSED rather than fired just before the next.
timeout_minutes = 30
#
# Note both jobs sit at 05:00 alongside each other, as they do today. The
# dispatcher runs a tick's due jobs sequentially, so they will not race, and
# euro-comps at 04:00 still leads them by an hour as its header intends.

# --- BATCH 4: screen-number-ones. The `times` list at full stretch. --------
# Nine firings a week: three times a day on Mon, Tue and Wed. No internal guard,
# so this is a straight preservation of the current effective UTC times.
#
# On the 9-vs-1 question, which looks like football-standings but is NOT: the
# script header says "Runs TUESDAY", while the plist fires Mon/Tue/Wed x3. That
# is deliberate polling rather than a gap. The US weekend number-one is only
# tallied Mon/Tue, so the spread catches it whenever Wikipedia publishes, and
# the script is change-gated (no diff, no commit), which makes the other eight
# firings cheap no-ops. Preserved as-is; the header wording is what is loose,
# not the schedule. Worth a one-line header fix at some point to say "polls
# Mon-Wed, commits when the number-one lands", so the next reader is not
# misled the way I nearly was.
#
[[job]]
id = "screen-number-ones"      # launchd/com.citizenofnowhere.screen-number-ones.plist (unloaded)
times = ["05:00", "13:00", "21:00"]   # was 06:00/14:00/22:00 LOCAL
weekdays = [1, 2, 3]                  # Mon, Tue, Wed
command = "$HOME/Projects/Metro Area Project/mac-mini-jobs/run-screen-number-ones.sh"
hc_slug = "screen-number-ones"
catchup_hours = 6              # slots are 8h apart; a slot missed by more than
                               # 6h should be recorded MISSED, not fired just
                               # before the next poll makes it redundant.
timeout_minutes = 25
#
# Repo-checkout job, so the $HOME path is required. No guard to delete on this
# one, which makes it a simpler flip than batch 3 despite the bigger table.

