<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crest Sort — Play &amp; Learn</title>
<style>
  :root{--ink:#16324f;--accent:#1f9e82;--gold:#f6b93b;--paper:#eef6fc}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:560px;margin:0 auto}
  .logo{font-size:1.3rem;font-weight:900}
  .hbtns{display:flex;gap:8px}
  .snd,.backb{border:none;background:#fff;border-radius:14px;font-size:1.15rem;padding:6px 12px;box-shadow:0 4px 0 #cfe0ee;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:900}
  main{max-width:560px;margin:0 auto;padding:0 14px 20px;text-align:center}
  .ask{font-size:1.05rem;font-weight:800;margin:2px 0 8px}
  .stage{background:#fff;border-radius:20px;box-shadow:0 8px 20px #16324f1c;padding:16px 12px 8px}
  .crest{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 5px 4px #0002);animation:drop .45s cubic-bezier(.2,1.3,.4,1)}
  @keyframes drop{0%{transform:translateY(-26px) scale(.6);opacity:0}}
  .cname{font-size:1.25rem;font-weight:900;margin:6px 0 2px}
  .read{border:none;background:#eef6fc;border-radius:12px;font-size:1rem;padding:5px 12px;cursor:pointer;font-weight:800;color:var(--ink)}
  .reveal{min-height:1.4em;font-weight:800;color:var(--accent);margin-top:6px}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .opt{border:none;border-radius:16px;background:#f6fbff;box-shadow:0 5px 0 #d7e6f2;cursor:pointer;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;font-weight:800;color:var(--ink);font-size:.95rem;transition:transform .12s}
  .opt:active{transform:scale(.95)}
  .opt .fl{width:76px;height:52px;border-radius:8px;background-size:cover;background-position:center;box-shadow:0 0 0 2px #dcebf6}
  .opt.good{background:#e8fbf4;box-shadow:0 5px 0 #bfe6da,0 0 0 3px var(--accent)}
  .opt.bad{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .next{margin-top:12px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .next:disabled{opacity:.35;cursor:default}
  .pass{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .stamp{width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px #dcebf6;display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.4;filter:grayscale(1)}
  .stamp.on{opacity:1;filter:none;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
  .toast{position:fixed;left:50%;top:10%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:1.1rem;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .toast.show{opacity:1}
  .conf{position:fixed;top:-12px;font-size:1.3rem;pointer-events:none;z-index:15;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
  .finale{position:fixed;inset:0;background:#fffef7;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20}
  .finale.show{display:flex}
  .btn{border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:12px 22px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
</style>
</head>
<body>
<header>
  <div class="logo">🛡️ Crest Sort</div>
  <div class="hbtns"><a class="backb" id="back" href="/play">←</a><button class="snd" id="snd">🔊</button></div>
</header>
<main>
  <div class="ask">Which country does this club play in?</div>
  <div class="stage">
    <img class="crest" id="crest" src="" alt="club badge">
    <div class="cname" id="cname"></div>
    <button class="read" id="read">🔊 Read it to me</button>
    <div class="reveal" id="reveal"></div>
    <div class="opts" id="opts"></div>
    <button class="next" id="next" disabled>Next →</button>
  </div>
  <div class="pass" id="pass"></div>
</main>
<div class="toast" id="toast"></div>
<div class="finale" id="finale">
  <h1 style="font-size:2.2rem">🏆 Badge Master!</h1>
  <p style="font-size:1.15rem;font-weight:800" id="finp">You sorted every club badge into its country.</p>
  <button class="btn" onclick="location.reload()">Play again 🔁</button>
  <a href="/play" style="display:inline-block;margin:10px 6px 0;padding:12px 22px;border-radius:16px;background:#5b7b97;color:#fff;font-weight:900;text-decoration:none;font-family:inherit;font-size:1.05rem;box-shadow:0 6px 0 #40566b">All games 🎮</a>
</div>

   el.innerHTML='<span class="fl" style="background-image:url('+FLAGS[b.iso]+')"></span>'+b.c;
   el.onclick=()=>choose(b.c,el,q); box.appendChild(el);
 });
 speak("Which country do "+q.n+" play in?"); buildPass();
}
function choose(c,el,q){
 if($("next").disabled===false)return;
 if(c===q.c){
   [...$("opts").children].forEach(x=>{if(x.dataset.c===q.c)x.classList.add("good");});
   $("reveal").textContent="✅ "+q.n+" play in "+q.c+".";
   $("next").disabled=false; solved=Math.max(solved,idx+1);
   toast(pick(["Yes! 🎉","Correct! ⭐","Nice! 🙌"])); speak("Yes! "+q.n+" play in "+c+"."); confetti(8); buildPass();
 } else { el.classList.add("bad"); setTimeout(()=>el.classList.remove("bad"),420); toast("Try again 🤔"); speak("Not that one."); }
}
let tT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),1200);}
function confetti(n){const em=["🛡️","⭐","🎉","⚽"];for(let i=0;i<n;i++){const s=document.createElement("div");s.className="conf";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.5+Math.random())+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
function finale(){$("finale").classList.add("show");speak("Amazing! You are a Badge Master!");confetti(20);}
$("next").onclick=()=>{ if(idx<order.length-1){idx++;render();} else {finale();} };
$("read").onclick=()=>{const q=order[idx];speak("Which country do "+q.n+" play in?");};
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊":"🔇";if(!sound)speechSynthesis.cancel();};
if(location.protocol==="file:")$("back").setAttribute("href","index.html");
/* balanced sample: max 3 per country */
(function(){
 const byC={}; shuffle(POOL).forEach(p=>{(byC[p.c]=byC[p.c]||[]).push(p);});
 let out=[]; Object.values(byC).forEach(list=>{out=out.concat(list.slice(0,3));});
 order=shuffle(out).slice(0,N);
})();
render();
</script>
