<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chart Champions — Play &amp; Learn</title>
<style>
  :root{--ink:#16324f;--accent:#1f9e82;--gold:#f6b93b;--paper:#eef6fc;--hot:#ff6b6b;--blue:#3b6fd4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:560px;margin:0 auto}
  .logo{font-size:1.25rem;font-weight:900}
  .hbtns{display:flex;gap:8px}
  .snd,.backb{border:none;background:#fff;border-radius:14px;font-size:1.1rem;padding:6px 12px;box-shadow:0 4px 0 #cfe0ee;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:900}
  main{max-width:560px;margin:0 auto;padding:0 14px 20px;text-align:center}
  .lvlchip{display:inline-block;background:#fff;border-radius:12px;padding:3px 12px;font-weight:900;font-size:.85rem;color:#5b7b97;box-shadow:0 3px 0 #cfe0ee;margin-bottom:6px}
  .stage{background:#fff;border-radius:20px;box-shadow:0 8px 20px #16324f1c;padding:16px 12px}
  .q{font-size:1.12rem;font-weight:900;margin:2px 0 6px}
  .read{border:none;background:#eef6fc;border-radius:12px;font-size:.95rem;padding:5px 12px;cursor:pointer;font-weight:800;color:var(--ink)}
  .reveal{min-height:1.5em;font-weight:800;color:var(--accent);margin-top:8px;font-size:1rem}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.wide{grid-template-columns:1fr}
  .opts.wide .opt{font-size:1.3rem}
  .opt{border:none;border-radius:16px;background:#f6fbff;box-shadow:0 5px 0 #d7e6f2;cursor:pointer;padding:14px 6px;font-family:inherit;font-weight:900;color:var(--ink);font-size:1.15rem;transition:transform .12s}
  .opt:active{transform:scale(.95)}
  .opt.good{background:#e8fbf4;box-shadow:0 5px 0 #bfe6da,0 0 0 3px var(--accent)}
  .opt.bad{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .next{margin-top:12px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .next:disabled{opacity:.35;cursor:default}
  .check{margin-top:12px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 6px 0 #24509e}
  .pass{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .stamp{width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px #dcebf6;display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.4;filter:grayscale(1)}
  .stamp.on{opacity:1;filter:none;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
  .toast{position:fixed;left:50%;top:9%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:1.05rem;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
  .toast.show{opacity:1}
  .conf{position:fixed;top:-12px;font-size:1.3rem;pointer-events:none;z-index:40;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
  .cover{position:fixed;inset:0;background:#eef6fcf2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20;overflow:auto}
  .cover h1{font-size:2rem;margin:8px 0}
  .cover p{font-size:1.05rem;font-weight:700;color:#5b7b97;max-width:430px;margin:4px 0 14px}
  .lvlbtn{display:block;width:min(330px,86vw);margin:7px auto;border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.18rem;padding:14px 20px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 6px 0 #cfe0ee;text-align:center}
  .lvlbtn.go{background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .lvlbtn small{display:block;font-size:.82rem;font-weight:800;color:#5b7b97}
  .lvlbtn.go small{color:#d6f5ec}
  .bigbtn{border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.15rem;padding:14px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 7px 0 #15705d;margin:6px}
  .homebtn{display:inline-block;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.15rem;padding:14px 26px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 7px 0 #cfe0ee;margin:6px;text-decoration:none}
  .hidden{display:none !important}
  .chart{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:190px;margin-top:14px;padding:0 8px;border-bottom:3px solid #5b7b97;position:relative}
  .chart .gl{position:absolute;left:0;right:0;border-top:2px dashed #dcebf6;z-index:0}
  .chart .gl span{position:absolute;left:2px;top:-9px;font-size:.62rem;font-weight:800;color:#5b7b97;background:#fff;padding:0 3px}
  .cbar{position:relative;width:52px;border:none;cursor:pointer;background:var(--accent);border-radius:5px 5px 0 0;z-index:1;transition:transform .12s;padding:0}
  .cbar:active{transform:scaleY(.97)}
  .cbar.hl{background:var(--gold)}
  .cbar .val{position:absolute;top:-22px;left:0;right:0;font-weight:900;font-size:.85rem;color:var(--ink);opacity:0}
  .cbar .val.show{opacity:1}
  .cbar img{position:absolute;bottom:-46px;left:50%;transform:translateX(-50%);width:26px;height:26px;object-fit:contain}
  .cbar .nm{position:absolute;bottom:-64px;left:50%;transform:translateX(-50%);font-size:.6rem;font-weight:800;color:#5b7b97;white-space:nowrap}
  .chartpad{height:66px}
  .picto{margin:14px auto 0;display:table;border-collapse:separate;border-spacing:0 6px}
  .picto .prow{display:table-row}
  .picto .plab{display:table-cell;text-align:right;padding-right:10px;font-weight:900;font-size:.9rem;vertical-align:middle}
  .picto .pico{display:table-cell;text-align:left;font-size:1.25rem;letter-spacing:2px;vertical-align:middle}
  .pkey{margin-top:10px;font-weight:800;color:#5b7b97;font-size:.9rem}
  .mtable{margin:14px auto 0;border-collapse:collapse}
  .mtable th,.mtable td{border:2px solid #dcebf6;padding:7px 14px;font-weight:800;font-size:.95rem}
  .mtable th{background:#f6fbff;text-transform:uppercase;font-size:.7rem;letter-spacing:1px;color:#5b7b97}
  .mtable td.num{font-size:1.1rem;font-weight:900;text-align:right}
  svg.tg{width:min(340px,86vw);height:auto;margin-top:12px}
</style>
</head>
<body>
<header>
  <div class="logo">📊 Chart Champions</div>
  <div class="hbtns"><a class="backb" id="back" href="/play">←</a><button class="snd" id="snd">🔊</button></div>
</header>
<main>
  <div class="lvlchip" id="lvlchip"></div>
  <div class="stage">
    <div class="q" id="q"></div>
    <button class="read" id="read">🔊 Read it to me</button>
    <div id="zone"></div>
    <div class="reveal" id="reveal"></div>
    <button class="next" id="next" disabled>Next →</button>
  </div>
  <div class="pass" id="pass"></div>
</main>
<div class="toast" id="toast"></div>

<div class="cover" id="start">
  <div style="font-size:3.6rem">📊🏆</div>
  <h1>Chart Champions</h1>
  <p>Real league titles and real skyscraper skylines, turned into bar charts, pictograms and tables. Read the scale, tap the right bar!</p>
  <button class="lvlbtn go" id="lvl3">⭐ Year 3<small>Bar charts · pictograms with half-symbols · tables · one-step questions</small></button>
  <button class="lvlbtn" id="lvl4">🌟 Year 4<small>Time graphs · two-step chart problems · trickier scales</small></button>
  <button class="lvlbtn" id="lvl5">🚀 Expert<small>Real city scales to 600 · big differences · millions on the axis</small></button>
</div>

<div class="cover hidden" id="finale">
  <div style="font-size:3.8rem">📊🥇</div>
  <h1 id="finh1">Data detective!</h1>
  <p id="finp">Charts, tables and pictograms all cracked. Statistician of the season!</p>
  <div>
    <div id="finaleMount"></div>
    <button class="bigbtn" id="again">Play again 🔁</button>
    <a class="homebtn" id="homelink" href="/play">All games 🎮</a>
  </div>
</div>

<script src="assets/scoring.js"></script>
<script>
const $=id=>document.getElementById(id);
const N=8;
let sound=true,LEVEL=3,idx=0,done=false,actx=null,nudges=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function speak(t){if(!sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
function ctx(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();return actx;}catch(e){return null;}}
function tone(f,d,type,when,g){if(!sound)return;const a=ctx();if(!a)return;const o=a.createOscillator(),gn=a.createGain();o.type=type||"sine";o.frequency.value=f;gn.gain.value=g||.12;o.connect(gn);gn.connect(a.destination);const t=a.currentTime+(when||0);o.start(t);gn.gain.setValueAtTime(gn.gain.value,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d);}
function cheer(){[523,659,784,1047].forEach((f,k)=>tone(f,.24,"triangle",k*.09,.13));}
function buzz(){tone(170,.2,"sine",0,.1);}
function confetti(n){const em=["📊","⭐","🎉","🏆"];for(let i=0;i<n;i++){const s=document.createElement("div");s.className="conf";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.4+Math.random())+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
let tT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),1300);}
function buildPass(){const el=$("pass");el.innerHTML="";for(let i=0;i<N;i++){const d=document.createElement("div");const r=Scoring._state.rounds[i];d.className="stamp"+(r?" "+Scoring.tierClass(r.tier):"");d.textContent=r&&r.tier==="grey"?"🆕":"📊";el.appendChild(d);}}
/* Honest Answer loop — PLAY-MASTERY-SPEC.md §1.
   CHOICE sites end the round on one answer. BUILD sites nudge without ending
   it: a construction task is scored on directness, like Note Value Lab, not on
   a single tap. Every round here is CHOICE — reading a chart and tapping the
   one right bar or option, with no ordering or numeric-entry step. */
function onCorrect(msg,sayMsg){
  if(done)return;
  done=true;
  const res = nudges>0 ? Scoring.answerTier("silver") : Scoring.answer(true);
  $("reveal").textContent="✅ "+msg;
  toast(res.tier==="gold"?pick(["Yes! 🎉","Brilliant! ⭐","Maths star! 🙌"]):"You worked it out! 👍");
  cheer();confetti(9);speak(sayMsg||msg);
  idx++;buildPass();
  $("next").disabled=false;
  $("next").textContent = idx>=N ? "See my score →" : "Next →";
}
/* CHOICE miss: one answer, then the correct answer is shown and it still teaches. */
function onMiss(msg,sayMsg){
  if(done)return;
  done=true;
  Scoring.answerTier("grey");
  $("reveal").textContent="🆕 "+msg;
  toast("Now you know it! 🆕");
  learnTone();speak(sayMsg||msg);
  idx++;buildPass();
  $("next").disabled=false;
  $("next").textContent = idx>=N ? "See my score →" : "Next →";
}
/* BUILD nudge: does NOT end the round, but costs the gold. */
function onWrong(hint){ nudges++; toast(hint||"Not yet 🤔"); learnTone(); speak(hint||"Not yet. Have another look."); }
function learnTone(){ [392,523].forEach((f,k)=>tone(f,.22,"triangle",k*.11,.11)); }
function finish(){$("finale").classList.remove("hidden");$("finh1").textContent=Scoring.headline();$("finaleMount").innerHTML=Scoring.finaleHTML();confetti(24);cheer();speak("Data detective! Charts cracked!");}
$("next")&&($("next").onclick=()=>{ if(!done)return; if(idx>=N){finish();} else render(); });
function startRun(lv){LEVEL=lv;$("lvlchip").textContent=(lv===3?"⭐ Year 3":lv===4?"🌟 Year 4":"🚀 Expert");$("start").classList.add("hidden");ctx();idx=0;Scoring.init({slug:"chart-champions",total:N,stampClasses:{base:"stamp",gold:"on",silver:"silver",grey:"miss"},noun:"one"});makeRounds();render();}
$("lvl3").onclick=()=>startRun(3);
$("lvl4").onclick=()=>startRun(4);
$("lvl5").onclick=()=>startRun(5);
$("again").onclick=()=>{$("finale").classList.add("hidden");$("start").classList.remove("hidden");};
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊":"🔇";if(!sound&&"speechSynthesis" in window)speechSynthesis.cancel();};
if(location.protocol==="file:"){$("back").setAttribute("href","index.html");$("homelink").setAttribute("href","index.html");}
buildPass();

/* REAL data from the site: English league titles (domestic-clubs.json) and
   skyscraper counts per metro (metros.json). */
const TITLES=[["Liverpool","liverpool",20],["Man United","manchester-united",20],["Arsenal","arsenal",14],["Man City","manchester-city",10],["Everton","everton",9],["Aston Villa","aston-villa",7],["Chelsea","chelsea",6],["Newcastle","newcastle-united",4]];
const EURO=[["Real Madrid","real-madrid",36],["Benfica","benfica",38],["Ajax","ajax",36],["Bayern","bayern-munich",35],["Juventus","juventus",36],["Porto","fc-porto",31],["Barcelona","fc-barcelona",29]];
const SKY=[["Hong Kong",569],["New York",347],["Shanghai",245],["Tokyo",212],["Chicago",137],["Toronto",123],["Mumbai",113],["Singapore",101],["Miami",88],["Sydney",54],["London",44]];
/* Expert data: same real numbers, chart-ready [name, id, value]. Populations in millions (metros.json). */
const SKYC=SKY.map(d=>[d[0],d[0].toLowerCase().replace(/ /g,"-"),d[1]]);
const POPM=[["Tokyo","tokyo",40],["Jakarta","jakarta",36],["Seoul","seoul",26],["Cairo","cairo",24],["New York","new-york",22],["Moscow","moscow",22],["London","london",17],["Paris","paris",13],["Chicago","chicago",10],["Hong Kong","hong-kong",7]];
let rounds=[];
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function fmt(n){return n.toLocaleString("en-GB");}
function mcq(options,ans,msg,say){
  window.__last={opts:options.map(String),ans:ans}; // test/debug hook
  const wide=options.some(t=>String(t).length>=8);
  const o=document.createElement("div");o.className="opts"+(wide?" wide":"");
  const btns=[];
  options.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=t;
    b.onclick=()=>{if(done||!Scoring.armed())return;
      if(i===ans){b.classList.add("good");onCorrect(msg,say);}
      else{b.classList.add("picked");btns[ans].classList.add("shown");onMiss(msg,say);}};
    btns.push(b);o.appendChild(b);});
  $("zone").appendChild(o);
}
const LABEL={tapbar:"reading a bar chart",diff:"comparing two bars",picto:"reading a pictogram",table:"reading a table",time:"reading a time graph",two:"a two-step chart total",skybar:"reading a big-scale bar chart",skydiff:"comparing two big-scale bars",popbar:"reading a population bar chart",two5:"a two-step total from real data"};
function makeRounds(){
  const kinds=LEVEL===3?["tapbar","diff","picto","table","tapbar","picto","diff","table"]
             :LEVEL===4?["tapbar","diff","picto","table","time","two","time","diff"]
                       :["skybar","skydiff","popbar","two5","skydiff","popbar","skybar","two5"];
  rounds=shuffle(kinds);
}
/* Plausible-error options, randomized position — never symmetric ans±k. */
function opts3(ans,cands){
  const uniq=[...new Set(cands.filter(c=>c!==ans&&c>0&&Number.isFinite(c)))];
  const above=uniq.filter(c=>c>ans), below=uniq.filter(c=>c<ans);
  // Deliberately vary which SIDE the wrongs land on: if one wrong always sat
  // above and one below, the answer would still be the median every time.
  let w; const roll=Math.random();
  if(roll<0.35&&above.length>=2)w=shuffle(above).slice(0,2);
  else if(roll<0.7&&below.length>=2)w=shuffle(below).slice(0,2);
  else w=shuffle(uniq).slice(0,2);
  while(w.length<2)w.push(ans+7+w.length*4);
  return shuffle([ans,...w]);
}
function render(){
  done=false;nudges=0;$("zone").innerHTML="";$("reveal").textContent="";$("next").disabled=true;$("next").textContent="Next →";buildPass();
  const kind=rounds[idx];
  Scoring.beginRound(Scoring.idOf({q:kind}), LABEL[kind]);
  ({tapbar:rTapBar,diff:rDiff,picto:rPicto,table:rTable,time:rTime,two:rTwo,skybar:rSkyBar,skydiff:rSkyDiff,popbar:rPopBar,two5:rTwoFive})[kind]();
}
function drawBars(data,maxV,step,clickable,onPick){
  const wrap=document.createElement("div");
  const ch=document.createElement("div");ch.className="chart";
  for(let g=step;g<=maxV;g+=step){
    const gl=document.createElement("div");gl.className="gl";gl.style.bottom=(g/maxV*100)+"%";
    gl.innerHTML="<span>"+g+"</span>";ch.appendChild(gl);
  }
  data.forEach(d=>{
    const b=document.createElement("button");b.className="cbar";
    b.style.height=Math.max(6,d[2]/maxV*100)+"%";
    b.innerHTML='<span class="val" id="val-'+d[1]+'">'+d[2]+'</span><img src="/team-badges/'+d[1]+'.png" alt="" onerror="this.style.display=\'none\'"><span class="nm">'+d[0]+'</span>';
    if(clickable)b.onclick=()=>{if(!done&&Scoring.armed())onPick(d,b);};
    ch.appendChild(b);
  });
  wrap.appendChild(ch);
  const pad=document.createElement("div");pad.className="chartpad";wrap.appendChild(pad);
  $("zone").appendChild(wrap);
  return ch;
}
function revealVals(){document.querySelectorAll(".cbar .val").forEach(v=>v.classList.add("show"));}
/* tap the right bar */
function rTapBar(){
  const data=shuffle(TITLES).slice(0,5);
  const target=pick(data);
  $("q").innerHTML="Real league titles! Read the scale, then <b>tap the club with "+target[2]+" titles</b>";
  window._say="The bars show real league titles. Tap the club with exactly "+target[2]+".";speak(_say);
  const msg=target[0]+" have won "+target[2]+" league titles", say="Yes! "+target[0]+"!";
  drawBars(data,24,4,true,(d,b)=>{
    if(d[2]===target[2]){b.classList.add("hl");revealVals();onCorrect(msg,say);}
    else{
      b.classList.add("picked");
      const tv=document.getElementById("val-"+target[1]); if(tv)tv.parentElement.classList.add("shown");
      onMiss(msg,say);
    }
  });
}
/* how many more (1-step compare) */
function rDiff(){
  const pool=pick([TITLES,EURO]);
  const two=shuffle(pool).filter((x,i,a)=>i<2);
  if(two[0][2]===two[1][2])return rDiff();
  const hi=two[0][2]>two[1][2]?two[0]:two[1], lo=hi===two[0]?two[1]:two[0];
  const ans=hi[2]-lo[2];
  $("q").innerHTML="How many MORE titles do <b>"+hi[0]+"</b> have than <b>"+lo[0]+"</b>?";
  window._say=hi[0]+" have "+hi[2]+", "+lo[0]+" have "+lo[2]+". How many more?";speak(_say);
  drawBars([hi,lo],Math.max(hi[2],24),4,false);
  revealVals();
  const opts=opts3(ans,[ans+2,ans-2,hi[2]+lo[2],ans+1]);
  mcq(opts.map(String),opts.indexOf(ans),hi[2]+" − "+lo[2]+" = "+ans+" more titles","Subtract to compare!");
}
/* pictogram with half symbols */
function rPicto(){
  const data=shuffle(TITLES.filter(t=>t[2]<=20&&t[2]>=4)).slice(0,4);
  const target=pick(data);
  const per=2;
  $("q").innerHTML="Pictogram! Each 🏆 = <b>"+per+" titles</b>. How many titles do <b>"+target[0]+"</b> have?";
  window._say="Each trophy stands for "+per+" titles. Count "+target[0]+"'s trophies. Half a trophy is one title!";speak(_say);
  const p=document.createElement("div");p.className="picto";
  data.forEach(d=>{
    const full="🏆".repeat(Math.floor(d[2]/per));
    const half=d[2]%per?'<span style="display:inline-block;width:.62em;overflow:hidden">🏆</span>':"";
    p.insertAdjacentHTML("beforeend",'<div class="prow"><span class="plab">'+d[0]+'</span><span class="pico">'+full+half+'</span></div>');
  });
  $("zone").appendChild(p);
  $("zone").insertAdjacentHTML("beforeend",'<div class="pkey">KEY: 🏆 = '+per+' titles (half = 1)</div>');
  const ans=target[2];
  const opts=opts3(ans,[ans+per,ans-per,Math.ceil(ans/per),ans+1]);
  mcq(opts.map(String),opts.indexOf(ans),target[0]+": "+(Math.floor(ans/per))+(ans%per?"½":"")+" trophies × "+per+" = "+ans+" titles","Count the trophies and multiply by two!");
}
/* real table, 1-step */
function rTable(){
  const data=shuffle(SKY).slice(0,4);
  const kind=pick(["most","sum"]);
  const t=document.createElement("table");t.className="mtable";
  t.innerHTML="<tr><th>Metro</th><th>Skyscrapers</th></tr>"+data.map(d=>"<tr><td>"+d[0]+"</td><td class='num'>"+d[1]+"</td></tr>").join("");
  if(kind==="most"){
    const winner=data.slice().sort((a,b)=>b[1]-a[1])[0];
    $("q").innerHTML="Real skyscraper counts! Which metro has the <b>most</b>?";
    window._say="Read the table. Which metro has the most skyscrapers?";speak(_say);
    $("zone").appendChild(t);
    const opts=shuffle(data.map(d=>d[0]));
    mcq(opts,opts.indexOf(winner[0]),winner[0]+" tops this table with "+winner[1]+" skyscrapers","It's "+winner[0]+"!");
  } else {
    const twoRows=data.slice(0,2);
    const ans=twoRows[0][1]+twoRows[1][1];
    $("q").innerHTML="Add <b>"+twoRows[0][0]+"</b> and <b>"+twoRows[1][0]+"</b> together: how many skyscrapers?";
    window._say=twoRows[0][0]+" plus "+twoRows[1][0]+": add their skyscrapers.";speak(_say);
    $("zone").appendChild(t);
    const opts=opts3(ans,[ans+10,ans-10,ans+100,Math.abs(twoRows[0][1]-twoRows[1][1])]);
    mcq(opts.map(fmt),opts.indexOf(ans),fmt(twoRows[0][1])+" + "+fmt(twoRows[1][1])+" = "+fmt(ans),"Add the two rows!");
  }
}
/* Y4: time graph (game data, clearly a match-day story) */
function rTime(){
  const hours=["1pm","2pm","3pm","4pm","5pm"];
  const vals=[ri(2,5)*10,ri(4,8)*10,ri(8,12)*10,ri(5,9)*10,ri(1,4)*10];
  const qi=ri(0,4);
  $("q").innerHTML="Match-day pie sales through the afternoon 🥧 How many were sold at <b>"+hours[qi]+"</b>?";
  window._say="The line graph shows pies sold each hour. How many at "+hours[qi]+"?";speak(_say);
  const maxV=120;
  let svg='<svg class="tg" viewBox="0 0 340 220"><rect width="340" height="220" fill="#fff" rx="12"/>';
  for(let g=0;g<=maxV;g+=20){const y=190-g/maxV*160;
    svg+='<line x1="40" y1="'+y+'" x2="320" y2="'+y+'" stroke="#eef3f9" stroke-width="2"/><text x="34" y="'+(y+4)+'" text-anchor="end" font-size="11" font-weight="800" fill="#5b7b97">'+g+'</text>';}
  const pts=vals.map((v,i)=>[(60+i*62),(190-v/maxV*160)]);
  svg+='<polyline points="'+pts.map(p=>p.join(",")).join(" ")+'" fill="none" stroke="#1f9e82" stroke-width="4" stroke-linejoin="round"/>';
  pts.forEach((p,i)=>{svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===qi?9:6)+'" fill="'+(i===qi?"#f6b93b":"#1f9e82")+'" stroke="#fff" stroke-width="2"/><text x="'+p[0]+'" y="210" text-anchor="middle" font-size="12" font-weight="800" fill="#5b7b97">'+hours[i]+'</text>';});
  svg+='</svg>';
  $("zone").insertAdjacentHTML("beforeend",svg);
  const ans=vals[qi];
  const opts=opts3(ans,[ans+10,ans-10,ans+20,ans-20]);
  mcq(opts.map(String),opts.indexOf(ans),"At "+hours[qi]+" the gold point sits at "+ans+" pies","Read across from the gold point!");
}
/* Y4: two-step from the chart */
function rTwo(){
  const data=shuffle(TITLES).slice(0,3);
  const total=data.reduce((s,d)=>s+d[2],0);
  $("q").innerHTML="Two-step! Add up ALL the titles on this chart";
  window._say="Add all three clubs' titles together.";speak(_say);
  drawBars(data,24,4,false);revealVals();
  const opts=opts3(total,[total+3,total-2,total-data[2][2],total+10]);
  mcq(opts.map(String),opts.indexOf(total),data.map(d=>d[2]).join(" + ")+" = "+total+" titles between them","Add all three!");
}
/* ---- Expert rounds: real city magnitudes ---- */
function rSkyBar(){
  const data=shuffle(SKYC).slice(0,5);
  const target=pick(data);
  $("q").innerHTML="Real skyscraper counts, big scale! Read the gridlines, then <b>tap the metro with about "+target[2]+" skyscrapers</b>";
  window._say="The scale goes up in hundreds. Tap the metro with about "+target[2]+" skyscrapers.";speak(_say);
  const msg=target[0]+" has "+target[2]+" skyscrapers", say="Yes! "+target[0]+"!";
  drawBars(data,600,100,true,(d,b)=>{
    if(d[2]===target[2]){b.classList.add("hl");revealVals();onCorrect(msg,say);}
    else{
      b.classList.add("picked");
      const tv=document.getElementById("val-"+target[1]); if(tv)tv.parentElement.classList.add("shown");
      onMiss(msg,say);
    }
  });
}
function rSkyDiff(){
  const two=shuffle(SKYC).slice(0,2);
  const hi=two[0][2]>two[1][2]?two[0]:two[1], lo=hi===two[0]?two[1]:two[0];
  if(hi[2]-lo[2]<30)return rSkyDiff();
  const ans=hi[2]-lo[2];
  $("q").innerHTML="How many MORE skyscrapers does <b>"+hi[0]+"</b> ("+hi[2]+") have than <b>"+lo[0]+"</b> ("+lo[2]+")?";
  window._say=hi[0]+" has "+hi[2]+", "+lo[0]+" has "+lo[2]+". How many more?";speak(_say);
  drawBars([hi,lo],600,100,false);revealVals();
  // Slips: added instead of subtracting; column slip of 10 or 100.
  const opts=opts3(ans,[hi[2]+lo[2],ans+10,ans-10,ans+100,ans-100]);
  mcq(opts.map(fmt),opts.indexOf(ans),fmt(hi[2])+" − "+fmt(lo[2])+" = "+fmt(ans)+" more","Subtract the real counts!");
}
function rPopBar(){
  const data=shuffle(POPM).slice(0,5);
  const target=pick(data);
  $("q").innerHTML="The axis is in MILLIONS of people! About how many million live in <b>"+target[0]+"</b>?";
  window._say="The bars show metro populations in millions. Read "+target[0]+"'s bar against the scale.";speak(_say);
  drawBars(data,45,5,false);
  // Distractors stay a full gridline (5M) or more away — the bar can be READ to the nearest line.
  const opts=opts3(target[2],[target[2]+5,target[2]-5,target[2]+10,target[2]*2]);
  mcq(opts.map(n=>n+" million"),opts.indexOf(target[2]),target[0]+"'s metro area holds about "+target[2]+" million people","About "+target[2]+" million!");
}
function rTwoFive(){
  const data=shuffle(SKYC).slice(0,3);
  const ans=data[0][2]+data[1][2]-data[2][2];
  if(ans<=0)return rTwoFive();
  $("q").innerHTML="Two steps, real numbers! <b>"+data[0][0]+"</b> + <b>"+data[1][0]+"</b> − <b>"+data[2][0]+"</b> skyscrapers = ?";
  window._say="Add "+data[0][0]+" and "+data[1][0]+"'s skyscrapers, then subtract "+data[2][0]+"'s.";speak(_say);
  const t=document.createElement("table");t.className="mtable";
  t.innerHTML="<tr><th>Metro</th><th>Skyscrapers</th></tr>"+data.map(d=>"<tr><td>"+d[0]+"</td><td class='num'>"+d[2]+"</td></tr>").join("");
  $("zone").appendChild(t);
  const sum=data[0][2]+data[1][2];
  const opts=opts3(ans,[sum,ans+10,ans-10,ans+100,sum+data[2][2]]);
  mcq(opts.map(fmt),opts.indexOf(ans),"("+data[0][2]+" + "+data[1][2]+") − "+data[2][2]+" = "+fmt(ans),"Add first, then subtract!");
}
$("read").onclick=()=>{if(window._say)speak(_say);};

</script>
