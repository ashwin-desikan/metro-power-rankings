<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fraction Football — Play &amp; Learn</title>
<style>
  :root{--ink:#16324f;--accent:#1f9e82;--gold:#f6b93b;--paper:#eef6fc;--hot:#ff6b6b;--blue:#3b6fd4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:560px;margin:0 auto}
  .logo{font-size:1.25rem;font-weight:900}
  .hbtns{display:flex;gap:8px}
  .snd,.backb{border:none;background:#fff;border-radius:14px;font-size:1.1rem;padding:6px 12px;box-shadow:0 4px 0 #cfe0ee;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:900}
  main{max-width:560px;margin:0 auto;padding:0 14px 20px;text-align:center}
  .lvlchip{display:inline-block;background:#fff;border-radius:12px;padding:3px 12px;font-weight:900;font-size:.85rem;color:#5b7b97;box-shadow:0 3px 0 #cfe0ee;margin-bottom:6px}
  .stage{background:#fff;border-radius:20px;box-shadow:0 8px 20px #16324f1c;padding:16px 12px}
  .q{font-size:1.12rem;font-weight:900;margin:2px 0 6px}
  .read{border:none;background:#eef6fc;border-radius:12px;font-size:.95rem;padding:5px 12px;cursor:pointer;font-weight:800;color:var(--ink)}
  .reveal{min-height:1.5em;font-weight:800;color:var(--accent);margin-top:8px;font-size:1rem}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{border:none;border-radius:16px;background:#f6fbff;box-shadow:0 5px 0 #d7e6f2;cursor:pointer;padding:14px 6px;font-family:inherit;font-weight:900;color:var(--ink);font-size:1.15rem;transition:transform .12s}
  .opt:active{transform:scale(.95)}
  .opt.good{background:#e8fbf4;box-shadow:0 5px 0 #bfe6da,0 0 0 3px var(--accent)}
  .opt.bad{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .next{margin-top:12px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .next:disabled{opacity:.35;cursor:default}
  .check{margin-top:12px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 6px 0 #24509e}
  .pass{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .stamp{width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px #dcebf6;display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.4;filter:grayscale(1)}
  .stamp.on{opacity:1;filter:none;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
  .toast{position:fixed;left:50%;top:9%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:1.05rem;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
  .toast.show{opacity:1}
  .conf{position:fixed;top:-12px;font-size:1.3rem;pointer-events:none;z-index:40;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
  .cover{position:fixed;inset:0;background:#eef6fcf2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20;overflow:auto}
  .cover h1{font-size:2rem;margin:8px 0}
  .cover p{font-size:1.05rem;font-weight:700;color:#5b7b97;max-width:430px;margin:4px 0 14px}
  .lvlbtn{display:block;width:min(330px,86vw);margin:7px auto;border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.18rem;padding:14px 20px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 6px 0 #cfe0ee;text-align:center}
  .lvlbtn.go{background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .lvlbtn small{display:block;font-size:.82rem;font-weight:800;color:#5b7b97}
  .lvlbtn.go small{color:#d6f5ec}
  .bigbtn{border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.15rem;padding:14px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 7px 0 #15705d;margin:6px}
  .homebtn{display:inline-block;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.15rem;padding:14px 26px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 7px 0 #cfe0ee;margin:6px;text-decoration:none}
  .hidden{display:none !important}
  .pgrid{display:grid;gap:5px;margin:12px auto 0;max-width:340px;background:#2f9450;padding:8px;border-radius:14px}
  .pcell{aspect-ratio:1/1;background:#5cc274;border-radius:7px;border:none;cursor:pointer;transition:transform .1s}
  .pcell:active{transform:scale(.93)}
  .pcell.sel{background:#e04848;box-shadow:inset 0 0 0 3px #fff}
  .poss{display:flex;height:44px;border-radius:12px;overflow:hidden;margin:12px auto 0;max-width:380px;box-shadow:0 4px 0 #d7e6f2}
  .poss .red{background:#e04848}
  .poss .blu{background:#3b6fd4}
  .poss span{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
  .numline{position:relative;height:64px;margin:18px 8px 0}
  .numline .rail{position:absolute;left:0;right:0;top:28px;height:6px;background:#cfe0ee;border-radius:3px}
  .numline .tick{position:absolute;top:22px;width:2px;height:18px;background:#5b7b97}
  .numline .lab{position:absolute;top:44px;font-size:.7rem;font-weight:800;color:#5b7b97;transform:translateX(-50%)}
  .numline .ball{position:absolute;top:2px;font-size:22px;transform:translateX(-50%)}
  .fbars{margin-top:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
  .fbar{display:flex;width:300px;height:34px;border-radius:9px;overflow:hidden;box-shadow:0 3px 0 #d7e6f2}
  .fbar div{border-right:2px solid #fff}
  .fbar .f{background:#e04848}
  .fbar .e{background:#e8eef5}
</style>
</head>
<body>
<header>
  <div class="logo">⚽ Fraction Football</div>
  <div class="hbtns"><a class="backb" id="back" href="/play">←</a><button class="snd" id="snd">🔊</button></div>
</header>
<main>
  <div class="lvlchip" id="lvlchip"></div>
  <div class="stage">
    <div class="q" id="q"></div>
    <button class="read" id="read">🔊 Read it to me</button>
    <div id="zone"></div>
    <div class="reveal" id="reveal"></div>
    <button class="next" id="next" disabled>Next →</button>
  </div>
  <div class="pass" id="pass"></div>
</main>
<div class="toast" id="toast"></div>

<div class="cover" id="start">
  <div style="font-size:3.6rem">⚽🍕</div>
  <h1>Fraction Football</h1>
  <p>Halves, quarters, thirds and tenths — all painted onto the pitch. Shade the grass, read the possession bar, and find the ball on the goal-line.</p>
  <button class="lvlbtn go" id="lvl3">⭐ Year 3<small>Halves, thirds, quarters, eighths · tenths · add same-bottom fractions</small></button>
  <button class="lvlbtn" id="lvl4">🌟 Year 4<small>Equivalent fractions · tenths and hundredths as decimals</small></button>
</div>

<div class="cover hidden" id="finale">
  <div style="font-size:3.8rem">⚽🎯</div>
  <h1>Fraction wizard!</h1>
  <p id="finp">You sliced the pitch perfectly every time.</p>
  <div>
    <button class="bigbtn" id="again">Play again 🔁</button>
    <a class="homebtn" id="homelink" href="/play">All games 🎮</a>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const N=8;
let sound=true,LEVEL=3,idx=0,done=false,actx=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function speak(t){if(!sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
function ctx(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();return actx;}catch(e){return null;}}
function tone(f,d,type,when,g){if(!sound)return;const a=ctx();if(!a)return;const o=a.createOscillator(),gn=a.createGain();o.type=type||"sine";o.frequency.value=f;gn.gain.value=g||.12;o.connect(gn);gn.connect(a.destination);const t=a.currentTime+(when||0);o.start(t);gn.gain.setValueAtTime(gn.gain.value,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d);}
function cheer(){[523,659,784,1047].forEach((f,k)=>tone(f,.24,"triangle",k*.09,.13));}
function buzz(){tone(170,.2,"sine",0,.1);}
function confetti(n){const em=["⚽","⭐","🎉","🍕"];for(let i=0;i<n;i++){const s=document.createElement("div");s.className="conf";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.4+Math.random())+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
let tT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),1300);}
function buildPass(){const el=$("pass");el.innerHTML="";for(let i=0;i<N;i++){const d=document.createElement("div");d.className="stamp"+(i<idx?" on":"");d.textContent="🍕";el.appendChild(d);}}
function onCorrect(msg,sayMsg){
  done=true;$("reveal").textContent="✅ "+msg;
  toast(pick(["Yes! 🎉","Brilliant! ⭐","Maths star! 🙌"]));
  cheer();confetti(9);speak(sayMsg||msg);
  idx++;buildPass();
  $("next").disabled=false;
  $("next").textContent = idx>=N ? "See my score →" : "Next →";
}
function onWrong(hint){toast(hint||"Try again 🤔");buzz();speak("Not quite. Try again!");}
function finish(){$("finale").classList.remove("hidden");confetti(24);cheer();speak("Fraction wizard!");}
$("next")&&($("next").onclick=()=>{ if(!done)return; if(idx>=N){finish();} else render(); });
function startRun(lv){LEVEL=lv;$("lvlchip").textContent=(lv===3?"⭐ Year 3":"🌟 Year 4");$("start").classList.add("hidden");ctx();idx=0;makeRounds();render();}
$("lvl3").onclick=()=>startRun(3);
$("lvl4").onclick=()=>startRun(4);
$("again").onclick=()=>{$("finale").classList.add("hidden");$("start").classList.remove("hidden");};
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊":"🔇";if(!sound&&"speechSynthesis" in window)speechSynthesis.cancel();};
if(location.protocol==="file:"){$("back").setAttribute("href","index.html");$("homelink").setAttribute("href","index.html");}
buildPass();

let rounds=[];
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function gcd(a,b){return b?gcd(b,a%b):a;}
function mcq(options,ans,msg,say){
  const o=document.createElement("div");o.className="opts";
  options.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=t;
    b.onclick=()=>{if(done)return;
      if(i===ans){b.classList.add("good");onCorrect(msg,say);}
      else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),420);onWrong();}};
    o.appendChild(b);});
  $("zone").appendChild(o);
}
function fr(n,d){return "<b>"+n+"/"+d+"</b>";}
function makeRounds(){
  const kinds=LEVEL===3?["shade","poss","shots","tenths","addf","shade","poss","shots"]
                       :["shade","dec","shots","tenths","addf","equiv","dec","subf"];
  rounds=shuffle(kinds);
}
function render(){
  done=false;$("zone").innerHTML="";$("reveal").textContent="";$("next").disabled=true;$("next").textContent="Next →";buildPass();
  const k=rounds[idx];
  ({shade:rShade,poss:rPoss,shots:rShots,tenths:rTenths,addf:rAddF,subf:rSubF,equiv:rEquiv,dec:rDec})[k]();
}
/* tap exactly n/d of the pitch squares */
function rShade(){
  const [n,d,cols]=pick([[1,2,4],[1,4,4],[3,4,4],[1,3,3],[2,3,3],[1,8,4],[3,8,4]]);
  const cells=d===3?6:8;             // grid cells (multiple of denominator)
  const need=cells*n/d;
  $("q").innerHTML="Tap "+fr(n,d)+" of the training pitch!";
  window._say="Tap "+n+" "+(d===2?"half":d===3?"thirds":d===4?"quarters":"eighths")+" of the pitch squares. That is "+need+" of the "+cells+" squares.";
  speak("Tap "+n+" out of "+d+" of the pitch!");
  const g=document.createElement("div");g.className="pgrid";g.style.gridTemplateColumns="repeat("+(cells/2)+",1fr)";
  let sel=0;
  for(let i=0;i<cells;i++){const c=document.createElement("button");c.className="pcell";
    c.onclick=()=>{if(done)return;c.classList.toggle("sel");sel+=c.classList.contains("sel")?1:-1;tone(650,.05,"triangle",0,.07);};
    g.appendChild(c);}
  $("zone").appendChild(g);
  const chk=document.createElement("button");chk.className="check";chk.textContent="Check! ✅";
  chk.onclick=()=>{if(done)return;
    if(sel===need)onCorrect(fr(n,d)+" of "+cells+" squares = "+need+" squares","Yes! "+n+" out of "+d+" of "+cells+" squares is "+need+"!");
    else onWrong(sel<need?"Shade a bit more 👀 ("+cells+" squares in total)":"Too many shaded 👀");};
  $("zone").appendChild(chk);
}
/* possession bar */
function rPoss(){
  const [n,d]=pick([[1,2],[1,4],[3,4],[1,3],[2,3]]);
  $("q").innerHTML="The Reds had this much of the ball. What fraction is red?";
  window._say="Look at the possession bar. What fraction is red?";speak(_say);
  const w=document.createElement("div");w.className="poss";
  w.innerHTML='<span class="red" style="flex:'+n+'">Reds</span><span class="blu" style="flex:'+(d-n)+'">Blues</span>';
  $("zone").appendChild(w);
  const wrong=[[1,2],[1,4],[3,4],[1,3],[2,3]].filter(x=>!(x[0]===n&&x[1]===d)).slice(0,2);
  const opts=shuffle([[n,d],...wrong]);
  mcq(opts.map(x=>fr(x[0],x[1])),opts.findIndex(x=>x[0]===n&&x[1]===d),"The bar shows "+n+"/"+d+" red","The Reds had "+n+" out of "+d+"!");
}
/* shots scored as a fraction (+ simplifying) */
function rShots(){
  const pairs=LEVEL===3?[[3,12,"1/4"],[6,12,"1/2"],[4,12,"1/3"],[2,8,"1/4"],[4,8,"1/2"]]
                       :[[3,12,"1/4"],[8,12,"2/3"],[6,8,"3/4"],[2,10,"1/5"],[4,10,"2/5"]];
  const [sc,tot,simp]=pick(pairs);
  $("q").innerHTML="⚽ The strikers scored <b>"+sc+"</b> of their <b>"+tot+"</b> shots. What fraction is that, in its simplest form?";
  window._say="Scored "+sc+" out of "+tot+" shots. What fraction is that?";speak(_say);
  $("zone").insertAdjacentHTML("beforeend",'<div style="font-size:1.6rem;margin-top:8px;letter-spacing:3px">'+"⚽".repeat(sc)+"<span style='filter:grayscale(1);opacity:.5'>"+"⚽".repeat(tot-sc)+"</span></div>");
  const wrong=["1/2","1/3","1/4","2/3","3/4","2/5"].filter(x=>x!==simp).slice(0,2);
  const opts=shuffle([simp,...wrong]);
  mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(simp),sc+"/"+tot+" = "+simp+" — same value, simpler numbers!","That's "+simp+"!");
}
/* tenths on the goal-line */
function rTenths(){
  const n=ri(1,9);
  $("q").innerHTML="The ball sits on the goal-line. Where is it?";
  window._say="The line goes from zero to one in tenths. Where is the ball?";speak(_say);
  const w=document.createElement("div");w.className="numline";
  w.innerHTML='<div class="rail"></div>';
  for(let i=0;i<=10;i++){
    w.insertAdjacentHTML("beforeend",'<div class="tick" style="left:'+(i*10)+'%"></div>');
    if(i===0||i===10)w.insertAdjacentHTML("beforeend",'<div class="lab" style="left:'+(i*10)+'%">'+(i===0?"0":"1")+'</div>');
  }
  w.insertAdjacentHTML("beforeend",'<div class="ball" style="left:'+(n*10)+'%">⚽</div>');
  $("zone").appendChild(w);
  const correct=LEVEL===4?("0."+n):(n+"/10");
  const wrongs=LEVEL===4?["0."+((n%9)+1),(n/100).toFixed(2)]:[((n%9)+1)+"/10",n+"/100"];
  const opts=shuffle([correct,...wrongs]);
  mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(correct),
      "The ball is at "+n+"/10"+(LEVEL===4?" = 0."+n:"")+" — counting in tenths!","It's "+n+" tenths!");
}
/* add fractions, same denominator */
function rAddF(){
  const d=pick([8,6,10]); const a=ri(1,d-3), b=ri(1,d-a-1);
  $("q").innerHTML="First half: "+fr(a,d)+" of the pitch mowed. Second half: "+fr(b,d)+" more. How much is mowed?";
  window._say=a+" over "+d+", plus "+b+" over "+d+"?";speak(_say);
  bars(d,a,b);
  const ans=(a+b)+"/"+d;
  const opts=shuffle([ans,(a+b)+"/"+(d*2),(a+b+1)+"/"+d]);
  mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(ans),a+"/"+d+" + "+b+"/"+d+" = "+ans+" — the bottom number stays the same!","Add the tops, keep the bottom!");
}
function rSubF(){
  const d=pick([8,6,10]); const a=ri(4,d-1), b=ri(1,a-1);
  $("q").innerHTML="The groundskeeper mowed "+fr(a,d)+", then rain washed out "+fr(b,d)+". How much is left?";
  window._say=a+" over "+d+", minus "+b+" over "+d+"?";speak(_say);
  bars(d,a,0);
  const ans=(a-b)+"/"+d;
  const opts=shuffle([ans,(a-b)+"/"+(d-b),(a-b+1)+"/"+d]);
  mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(ans),a+"/"+d+" − "+b+"/"+d+" = "+ans,"Subtract the tops, keep the bottom!");
}
function bars(d,a,b){
  const w=document.createElement("div");w.className="fbars";
  const bar=document.createElement("div");bar.className="fbar";
  for(let i=0;i<d;i++){const s=document.createElement("div");s.style.flex="1";s.className=i<a?"f":(i<a+b?"f":"e");if(i>=a&&i<a+b)s.style.background="#f6b93b";bar.appendChild(s);}
  w.appendChild(bar);$("zone").appendChild(w);
}
/* equivalent fractions */
function rEquiv(){
  const base=pick([[1,2],[1,3],[3,4],[2,5]]);
  const k=ri(2,3);
  const eq=[base[0]*k,base[1]*k];
  $("q").innerHTML="Which fraction is EQUAL to "+fr(base[0],base[1])+"?";
  window._say="Which fraction equals "+base[0]+" over "+base[1]+"?";speak(_say);
  const w=document.createElement("div");w.className="fbars";
  [[base[0],base[1]],[eq[0],eq[1]]].forEach(([n,d])=>{
    const bar=document.createElement("div");bar.className="fbar";
    for(let i=0;i<d;i++){const s=document.createElement("div");s.style.flex="1";s.className=i<n?"f":"e";bar.appendChild(s);}
    w.appendChild(bar);});
  $("zone").appendChild(w);
  const ans=eq[0]+"/"+eq[1];
  const opts=shuffle([ans,(eq[0]+1)+"/"+eq[1],eq[0]+"/"+(eq[1]+2)]);
  mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(ans),base[0]+"/"+base[1]+" = "+ans+" — same shaded amount, look at the bars!","They cover the same amount!");
}
/* Y4: tenths & hundredths as decimals */
function rDec(){
  const kind=pick(["t","h"]);
  if(kind==="t"){
    const n=ri(1,9);
    $("q").innerHTML="Write "+fr(n,10)+" as a decimal";
    window._say=n+" tenths as a decimal?";speak(_say);
    const ans="0."+n;
    const opts=shuffle([ans,n+".0","0.0"+n]);
    mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(ans),n+"/10 = "+ans,"Tenths live one place after the point!");
  } else {
    const n=ri(1,9)*10+ri(1,9);
    $("q").innerHTML="Write "+fr(n,100)+" as a decimal";
    window._say=n+" hundredths as a decimal?";speak(_say);
    const ans="0."+String(n).padStart(2,"0");
    const opts=shuffle([ans,"0."+n+"0","."+n+"0"]);
    const uniq=[...new Set(opts)];while(uniq.length<3)uniq.push(String(n/10));
    mcq(uniq.map(x=>"<b>"+x+"</b>"),uniq.indexOf(ans),n+"/100 = "+ans,"Hundredths take two places!");
  }
}
$("read").onclick=()=>{if(window._say)speak(_say);};

</script>
</body>
</html>
