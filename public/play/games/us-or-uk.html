<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>US or UK? — Play &amp; Learn</title>
<style>
  :root{--ink:#16324f;--accent:#1f9e82;--gold:#f6b93b;--paper:#eef6fc}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:560px;margin:0 auto}
  .logo{font-size:1.3rem;font-weight:900}
  .hbtns{display:flex;gap:8px}
  .snd,.backb{border:none;background:#fff;border-radius:14px;font-size:1.15rem;padding:6px 12px;box-shadow:0 4px 0 #cfe0ee;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:900}
  main{max-width:560px;margin:0 auto;padding:0 14px 20px;text-align:center}
  .ask{font-size:1.02rem;font-weight:800;margin:0 0 8px;color:#5b7b97}
  .item{background:#fff;border-radius:20px;box-shadow:0 8px 20px #16324f1c;padding:18px 14px;margin-bottom:12px}
  .item .em{font-size:2.8rem;animation:drop .4s cubic-bezier(.2,1.3,.4,1)}
  @keyframes drop{0%{transform:translateY(-22px) scale(.6);opacity:0}}
  .item .txt{font-size:1.3rem;font-weight:900;margin-top:4px;min-height:1.6em}
  .read{border:none;background:#eef6fc;border-radius:12px;font-size:1rem;padding:5px 12px;cursor:pointer;font-weight:800;color:var(--ink)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .opt{border:none;border-radius:18px;background:#fff;box-shadow:0 6px 0 #d7e6f2;cursor:pointer;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;font-weight:900;color:var(--ink);font-size:1.1rem;transition:transform .12s}
  .opt:active{transform:scale(.95)}
  .opt img.fl{width:96px;height:64px;border-radius:9px;object-fit:cover;box-shadow:0 0 0 3px #dcebf6}
  .opt.good{background:#e8fbf4;box-shadow:0 6px 0 #bfe6da,0 0 0 4px var(--accent)}
  .opt.bad{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .reveal{min-height:1.5em;font-weight:800;color:var(--accent);margin-top:10px}
  .next{margin-top:8px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .next:disabled{opacity:.35;cursor:default}
  .pass{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .stamp{width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px #dcebf6;display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.4;filter:grayscale(1)}
  .stamp.on{opacity:1;filter:none;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
  .toast{position:fixed;left:50%;top:10%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:1.1rem;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .toast.show{opacity:1}
  .conf{position:fixed;top:-12px;font-size:1.3rem;pointer-events:none;z-index:15;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
  .cover{position:fixed;inset:0;background:#eef6fcf2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20}
  .cover h1{font-size:2.1rem;margin:8px 0}
  .cover p{font-size:1.08rem;font-weight:700;color:#5b7b97;max-width:430px;margin:4px 0 18px}
  .bigbtn{border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.25rem;padding:15px 28px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 7px 0 #15705d}
  .hidden{display:none !important}
</style>
</head>
<body>
<header>
  <div class="logo">🇺🇸🇬🇧 US or UK?</div>
  <div class="hbtns"><a class="backb" id="back" href="/play">←</a><button class="snd" id="snd">🔊</button></div>
</header>
<main>
  <div class="ask">Which country does this belong to? Tap the flag!</div>
  <div class="item"><div class="em" id="em"></div><div class="txt" id="txt"></div>
    <button class="read" id="read">🔊 Read it to me</button></div>
  <div class="opts">
    <button class="opt" id="o-us"><img class="fl" src="https://flagcdn.com/w320/us.png" alt="US flag" onerror="this.style.display='none'">United States</button>
    <button class="opt" id="o-uk"><img class="fl" src="https://flagcdn.com/w320/gb.png" alt="UK flag" onerror="this.style.display='none'">United Kingdom</button>
  </div>
  <div class="reveal" id="reveal"></div>
  <button class="next" id="next" disabled>Next →</button>
  <div class="pass" id="pass"></div>
</main>
<div class="toast" id="toast"></div>

<div class="cover" id="start">
  <div style="font-size:3.8rem">🗽🎡</div>
  <h1>US or UK?</h1>
  <p>Two countries, two ways of doing things. Sort each one to the right flag, and watch out for the <b>tricky ones</b>!</p>
  <button class="bigbtn" id="go">Start sorting! 🚀</button>
</div>

<div class="cover hidden" id="finale">
  <div style="font-size:4rem">🗽🎡⭐</div>
  <h1>Dual-Country Champion!</h1>
  <p>You know both countries inside out.</p>
  <button class="bigbtn" id="again">Play again 🔁</button>
</div>

<script>
const ITEMS=[
 {em:"🗺️", t:"Has 50 states", a:"us", f:"From Alaska to Florida. The UK has 4 nations instead."},
 {em:"🏴󠁧󠁢󠁳󠁣󠁴󠁿", t:"Made of 4 nations", a:"uk", f:"England, Scotland, Wales and Northern Ireland."},
 {em:"🏛️", t:"Laws are made by Congress", a:"us", f:"Congress meets in the Capitol Building in Washington, D.C."},
 {em:"🕰️", t:"Laws are made by Parliament", a:"uk", f:"Parliament meets by Big Ben, in the Palace of Westminster."},
 {em:"🏦", t:"The Senate", a:"us", f:"Two senators for every state: 100 in all."},
 {em:"🎩", t:"The House of Lords", a:"uk", f:"The unelected upper house of Parliament."},
 {em:"🏙️", t:"Capital city: Washington, D.C.", a:"us", f:"D.C. stands for District of Columbia."},
 {em:"🎡", t:"Capital city: London", a:"uk", f:"London is the UK's capital, on the River Thames."},
 {em:"🌊", t:"The Mississippi River", a:"us", f:"One of the longest rivers in the world."},
 {em:"⛵", t:"The River Thames", a:"uk", f:"It flows right past Parliament in London."},
 {em:"🤠", t:"Every state has its own Governor", a:"us", f:"Governors are like mini-presidents for their state."},
 {em:"👑", t:"Has a King as Head of State", a:"uk", f:"The King is Head of State; the Prime Minister runs the government."},
 {em:"🔵", t:"The BLUE team is called the Democrats", a:"us", f:"Democrats are blue; Republicans are red. The UK flips the colours!"},
 {em:"🔴", t:"The RED team is called Labour", a:"uk", f:"Labour is red; the Conservatives are blue. Opposite of America!"},
 {em:"🐘", t:"A party with an ELEPHANT as its symbol", a:"us", f:"The Republican elephant. The Democrats have a donkey!"},
 {em:"🦃", t:"Celebrates Thanksgiving in November", a:"us", f:"Turkey, family and (American) football."},
 {em:"🎆", t:"Celebrates Bonfire Night on 5 November", a:"uk", f:"Remember, remember the fifth of November!"},
 {em:"⚖️", t:"Its top court is the Supreme Court of nine justices", a:"us", f:"Nine justices serve for life."},
 {em:"📅", t:"Picks its President every 4 years", a:"us", f:"Always in November of a leap-ish year: 2024, 2028…"},
 {em:"🗳️", t:"Must hold a General Election at least every 5 years", a:"uk", f:"The Prime Minister can also call one earlier."},
];
const N=12;
const $=id=>document.getElementById(id);
let sound=true,idx=0,order=[],done=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function speak(t){if(!sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
function confetti(n){const em=["🗽","🎡","⭐","🎉"];for(let i=0;i<n;i++){const s=document.createElement("div");s.className="conf";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.4+Math.random())+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
let tT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),1300);}
function buildPass(){const el=$("pass");el.innerHTML="";for(let i=0;i<N;i++){const d=document.createElement("div");d.className="stamp"+(i<idx?" on":"");d.textContent="🌟";el.appendChild(d);}}
function render(){
  done=false; const c=order[idx];
  $("em").textContent=c.em; $("txt").textContent=c.t;
  ["us","uk"].forEach(k=>$("o-"+k).classList.remove("good","bad"));
  $("reveal").textContent=""; $("next").disabled=true;
  buildPass(); speak(c.t+". US, or UK?");
}
function choose(k){
  if(done)return; const c=order[idx];
  if(k===c.a){
    done=true; $("o-"+k).classList.add("good");
    $("reveal").textContent="✅ "+c.f;
    $("next").disabled=false;
    toast(pick(["Yes! 🎉","Sorted! ⭐","Champion! 🙌"]));
    speak("Yes! "+c.f); confetti(9);
    idx++; buildPass();
  } else {
    $("o-"+k).classList.add("bad"); setTimeout(()=>$("o-"+k).classList.remove("bad"),420);
    toast("Try again 🤔"); speak("Not that one. Try again!");
  }
}
$("o-us").onclick=()=>choose("us"); $("o-uk").onclick=()=>choose("uk");
$("next").onclick=()=>{ if(idx>=N){ $("finale").classList.remove("hidden"); confetti(24); speak("Dual country champion!"); } else render(); };
$("go").onclick=()=>{ $("start").classList.add("hidden"); order=shuffle(ITEMS).slice(0,N); idx=0; render(); };
$("again").onclick=()=>{ $("finale").classList.add("hidden"); order=shuffle(ITEMS).slice(0,N); idx=0; render(); };
$("read").onclick=()=>{ speak(order[idx].t+". US, or UK?"); };
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊":"🔇";if(!sound&&"speechSynthesis" in window)speechSynthesis.cancel();};
if(location.protocol==="file:")$("back").setAttribute("href","index.html");
buildPass();
</script>
</body>
</html>
