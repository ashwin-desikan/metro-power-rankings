<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Who's the Boss? — Play &amp; Learn</title>
<style>
  :root{--ink:#16324f;--accent:#1f9e82;--gold:#f6b93b;--paper:#eef6fc}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:560px;margin:0 auto}
  .logo{font-size:1.3rem;font-weight:900}
  .hbtns{display:flex;gap:8px}
  .snd,.backb{border:none;background:#fff;border-radius:14px;font-size:1.15rem;padding:6px 12px;box-shadow:0 4px 0 #cfe0ee;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:900}
  main{max-width:560px;margin:0 auto;padding:0 14px 20px;text-align:center}
  .ask{font-size:1.02rem;font-weight:800;margin:0 0 8px;color:#5b7b97}
  .job{background:#fff;border-radius:20px;box-shadow:0 8px 20px #16324f1c;padding:18px 14px;margin-bottom:12px}
  .job .em{font-size:2.6rem}
  .job .txt{font-size:1.2rem;font-weight:900;margin-top:4px;min-height:2.4em;display:flex;align-items:center;justify-content:center}
  .read{border:none;background:#eef6fc;border-radius:12px;font-size:1rem;padding:5px 12px;cursor:pointer;font-weight:800;color:var(--ink)}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
  .opt{border:none;border-radius:16px;background:#fff;box-shadow:0 5px 0 #d7e6f2;cursor:pointer;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;font-weight:900;color:var(--ink);font-size:.95rem;transition:transform .12s}
  .opt:active{transform:scale(.95)}
  .opt .big{font-size:2.1rem}
  .opt img.fl{width:46px;height:31px;border-radius:5px;object-fit:cover;box-shadow:0 0 0 2px #dcebf6}
  .opt .sub{font-size:.76rem;color:#5b7b97;font-weight:800}
  .opt.good{background:#e8fbf4;box-shadow:0 5px 0 #bfe6da,0 0 0 3px var(--accent)}
  .opt.bad{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .reveal{min-height:1.5em;font-weight:800;color:var(--accent);margin-top:10px}
  .next{margin-top:8px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .next:disabled{opacity:.35;cursor:default}
  .pass{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .stamp{width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px #dcebf6;display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.4;filter:grayscale(1)}
  .stamp.on{opacity:1;filter:none;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
  .toast{position:fixed;left:50%;top:10%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:1.1rem;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .toast.show{opacity:1}
  .conf{position:fixed;top:-12px;font-size:1.3rem;pointer-events:none;z-index:15;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
  .cover{position:fixed;inset:0;background:#eef6fcf2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20}
  .cover h1{font-size:2.1rem;margin:8px 0}
  .cover p{font-size:1.08rem;font-weight:700;color:#5b7b97;max-width:430px;margin:4px 0 18px}
  .bigbtn{border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.25rem;padding:15px 28px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 7px 0 #15705d}
  /* Honest Answer tiers — PLAY-MASTERY-SPEC.md §1.2. Gold = knew it,
     silver = worked it out, amber = learned it just now. No red, no cross. */
  .stamp.silver{opacity:1;filter:none;box-shadow:inset 0 0 0 3px #9fb6ca;animation:pop .4s}
  .stamp.miss{opacity:1;filter:none;box-shadow:inset 0 0 0 3px #e8c86a;background:#fff7e6;animation:pop .4s}
  .opt.shown{background:#e8fbf4;box-shadow:0 6px 0 #bfe6da,0 0 0 4px var(--accent);outline:3px dashed #06372c44;outline-offset:-8px}
  .opt.picked{background:#eef3f8;color:#5b7b97;opacity:.75}
  .tally{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .tally .tl{background:#fff;border-radius:14px;padding:8px 13px;font-weight:800;font-size:.98rem;box-shadow:0 3px 0 #d7e6f2}
  .learned{background:#fff7e6;border-radius:16px;padding:12px 14px;margin:8px auto;text-align:left;max-width:430px}
  .learned .lh{font-weight:900;color:#7a5b00;margin-bottom:4px}
  .learned ul{margin:0;padding-left:20px}
  .learned li{font-weight:700;color:#7a5b00;line-height:1.35;margin:3px 0}
  .hidden{display:none !important}
</style>
</head>
<body>
<header>
  <div class="logo">🏛️ Who's the Boss?</div>
  <div class="hbtns"><a class="backb" id="back" href="/play">←</a><button class="snd" id="snd">🔊</button></div>
</header>
<main>
  <div class="ask">Whose job is this? Tap the right leader!</div>
  <div class="job"><div class="em" id="em"></div><div class="txt" id="txt"></div>
    <button class="read" id="read">🔊 Read it to me</button></div>
  <div class="opts">
    <button class="opt" id="o-pres"><span class="big">🦅</span><img class="fl" src="https://flagcdn.com/w160/us.png" alt="US flag" onerror="this.style.display='none'">The President<span class="sub">The White House</span></button>
    <button class="opt" id="o-pm"><span class="big">🚪</span><img class="fl" src="https://flagcdn.com/w160/gb.png" alt="UK flag" onerror="this.style.display='none'">The Prime Minister<span class="sub">10 Downing Street</span></button>
    <button class="opt" id="o-king"><span class="big">👑</span><img class="fl" src="https://flagcdn.com/w160/gb.png" alt="UK flag" onerror="this.style.display='none'">The King<span class="sub">Buckingham Palace</span></button>
  </div>
  <div class="reveal" id="reveal"></div>
  <button class="next" id="next" disabled>Next job →</button>
  <div class="pass" id="pass"></div>
</main>
<div class="toast" id="toast"></div>

<div class="cover" id="start">
  <div style="font-size:3.8rem">🦅🚪👑</div>
  <h1>Who's the Boss?</h1>
  <p>America has a <b>President</b>. Britain has a <b>Prime Minister</b> AND a <b>King</b>. Ten jobs — who does each one?</p>
  <button class="bigbtn" id="go">Let's find out! 🏛️</button>
</div>

<div class="cover hidden" id="finale">
  <div style="font-size:4rem">🏛️⭐</div>
  <h1>Boss of the Bosses!</h1>
  <p>You know exactly who does what, in both countries.</p>
  <button class="bigbtn" id="again">Play again 🔁</button>
  <a href="/play" style="display:inline-block;margin:10px 6px 0;padding:12px 22px;border-radius:16px;background:#5b7b97;color:#fff;font-weight:900;text-decoration:none;font-family:inherit;font-size:1.05rem;box-shadow:0 6px 0 #40566b">All games 🎮</a>
</div>

<script src="assets/scoring.js"></script>
<script>
const CARDS=[
 {em:"🏠", t:"Lives in the White House", a:"pres", f:"The White House, in Washington, D.C., has 132 rooms!"},
 {em:"🚪", t:"Lives behind the most famous front door in Britain", a:"pm", f:"Number 10 Downing Street, in London. Even the cat is famous!"},
 {em:"👑", t:"Wears the crown", a:"king", f:"The King is crowned at Westminster Abbey in London."},
 {em:"🗳️", t:"Elected every 4 years, in November", a:"pres", f:"Americans vote for their President every four years."},
 {em:"✍️", t:"Signs bills from Congress to make them laws", a:"pres", f:"No signature, no law! The President can also say no: a veto."},
 {em:"🐴", t:"Meets the King for a chat every week", a:"pm", f:"The Prime Minister visits the King about once a week."},
 {em:"🪙", t:"Their face is on the coins and stamps", a:"king", f:"Look at a UK coin: that is the King, not the Prime Minister!"},
 {em:"🎤", t:"Answers questions in Parliament every Wednesday", a:"pm", f:"It is called Prime Minister's Questions: PMQs. It gets LOUD."},
 {em:"🎖️", t:"Commander-in-Chief of the US military", a:"pres", f:"The President is the boss of the US Army, Navy and Air Force."},
 {em:"📜", t:"Opens Parliament by reading a big speech from a throne", a:"king", f:"The King reads the speech, but the government writes it!"},
 {em:"🏆", t:"Becomes the boss by winning the most MPs in an election", a:"pm", f:"Win the most seats in the House of Commons, and the job is yours."},
 {em:"🤫", t:"Head of State, but stays out of politics", a:"king", f:"The King represents the country, but never picks a side."},
 {em:"✈️", t:"Flies on a famous plane called Air Force One", a:"pres", f:"Wherever the President flies, that plane is Air Force One."},
 {em:"🐈", t:"Has a famous cat called the Chief Mouser", a:"pm", f:"Larry the cat has lived at Number 10 since 2011!"},
 {em:"🎂", t:"Has two birthdays every year", a:"king", f:"A real birthday, and an official one in June with a big parade."},
];
const NAMES={pres:"the President 🦅",pm:"the Prime Minister 🚪",king:"the King 👑"};
const N=10;
const $=id=>document.getElementById(id);
let sound=true,idx=0,order=[],done=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function speak(t){if(!sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
function speakThen(t){if(!sound||!("speechSynthesis" in window)){Scoring.readEnded();return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.1;u.onend=()=>Scoring.readEnded();u.onerror=()=>Scoring.readEnded();speechSynthesis.speak(u);}catch(e){Scoring.readEnded();}}
function confetti(n){const em=["🏛️","⭐","🎉","👑"];for(let i=0;i<n;i++){const s=document.createElement("div");s.className="conf";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.4+Math.random())+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
let tT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),1300);}
function buildPass(){const el=$("pass");el.innerHTML="";for(let i=0;i<N;i++){const d=document.createElement("div");const r=Scoring._state.rounds[i];d.className="stamp"+(r?" "+Scoring.tierClass(r.tier):"");d.textContent=r?(r.tier==="grey"?"🆕":"🏛️"):"🏛️";d.title=r?({gold:"Knew it",silver:"Worked it out",grey:"Learned it"})[r.tier]:"";el.appendChild(d);}}
function render(){
  done=false; const c=order[idx];
  Scoring.beginRound(Scoring.idOf({q:c.t}), c.t);
  $("em").textContent=c.em; $("txt").textContent=c.t;
  ["pres","pm","king"].forEach(k=>$("o-"+k).classList.remove("good","bad","shown","picked"));
  $("reveal").textContent=""; $("next").disabled=true;
  buildPass(); speak(c.t+". Whose job is that?");
}
/* Honest Answer loop — PLAY-MASTERY-SPEC.md §1. One tap per round. A miss shows
   the right answer and still gives the fact, so it teaches instead of stalling.
   Previously a wrong tap cost nothing and the round would not advance until the
   answer was right, which made tapping-until-green the winning strategy here:
   with only 3 options, guessing beat knowing. */
function choose(k){
  if(Scoring.answered()||!Scoring.armed())return;
  const c=order[idx], correct=(k===c.a);
  const res=Scoring.answer(correct);
  done=true;
  ["pres","pm","king"].forEach(x=>{
    if(x===c.a) $("o-"+x).classList.add(correct?"good":"shown");
    else if(x===k) $("o-"+x).classList.add("picked");
  });
  if(correct){
    $("reveal").textContent=(res.tier==="gold"?"⭐ ":"👍 ")+c.f;
    toast(res.tier==="gold"?pick(["You knew it! 🎉","Straight away! ⭐"]):"Worked it out! 👍");
    speak("Yes! "+c.f); confetti(9);
  }else{
    $("reveal").textContent="🆕 That's "+NAMES[c.a]+" — "+c.f;
    toast("Now you know it! 🆕");
    speak("That's "+NAMES[c.a].replace(/ .$/,"")+". "+c.f);
  }
  $("next").disabled=false;
  idx++; buildPass();
}

["pres","pm","king"].forEach(k=>$("o-"+k).onclick=()=>choose(k));
$("next").onclick=()=>{ if(idx>=N){ $("finale").classList.remove("hidden"); showTally(); confetti(24); speak("Boss of the bosses! Amazing!"); } else render(); };
$("go").onclick=()=>{ $("start").classList.add("hidden"); order=shuffle(CARDS).slice(0,N); idx=0; Scoring.init({slug:"whos-the-boss",total:N,stampClasses:{base:"stamp",gold:"on",silver:"silver",grey:"miss"}}); render(); };
function showTally(){const h=$("finale").querySelector("h1");if(h)h.textContent=Scoring.headline();let box=document.getElementById("tallybox");if(!box){box=document.createElement("div");box.id="tallybox";$("again").parentNode.insertBefore(box,$("again"));}box.innerHTML=Scoring.finaleHTML();}
$("again").onclick=()=>{ $("finale").classList.add("hidden"); order=shuffle(CARDS).slice(0,N); idx=0; Scoring.init({slug:"whos-the-boss",total:N,stampClasses:{base:"stamp",gold:"on",silver:"silver",grey:"miss"}}); render(); };
$("read").onclick=()=>{ Scoring.readStarted(); speakThen(order[idx].t+". Whose job is that?"); };
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊":"🔇";if(!sound&&"speechSynthesis" in window)speechSynthesis.cancel();};
if(location.protocol==="file:")$("back").setAttribute("href","index.html");
buildPass();
</script>
</body>
</html>
