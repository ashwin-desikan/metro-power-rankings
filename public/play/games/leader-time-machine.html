<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Leader Time Machine — Play &amp; Learn</title>
<style>
  :root{--ink:#16324f;--accent:#1f9e82;--gold:#f6b93b;--paper:#eef6fc;--dem:#3b6fd4;--rep:#d43b3b;--lab:#d43b3b;--con:#3b6fd4;--oth:#8a6fc9}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:560px;margin:0 auto}
  .logo{font-size:1.3rem;font-weight:900}
  .hbtns{display:flex;gap:8px}
  .snd,.backb{border:none;background:#fff;border-radius:14px;font-size:1.15rem;padding:6px 12px;box-shadow:0 4px 0 #cfe0ee;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:900}
  main{max-width:560px;margin:0 auto;padding:0 14px 20px;text-align:center}
  .dial{display:inline-block;background:var(--ink);color:#fff;border-radius:14px;padding:6px 18px;font-weight:900;font-size:1.15rem;margin-bottom:4px;letter-spacing:1px}
  .q{font-size:1.15rem;font-weight:900;margin:6px 0 4px}
  .read{border:none;background:#fff;border-radius:12px;font-size:1rem;padding:5px 12px;cursor:pointer;font-weight:800;color:var(--ink);box-shadow:0 4px 0 #cfe0ee}
  .opts{display:grid;gap:10px;margin-top:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.three{grid-template-columns:1fr}
  .card{position:relative;border:none;border-radius:18px;background:#fff;box-shadow:0 6px 0 #d7e6f2;cursor:pointer;padding:14px 10px;font-family:inherit;color:var(--ink);transition:transform .12s;display:flex;flex-direction:column;align-items:center;gap:6px}
  .opts.three .card{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 16px;text-align:left}
  .card:active{transform:scale(.96)}
  .card img.fl{width:56px;height:38px;border-radius:6px;object-fit:cover;box-shadow:0 0 0 2px #dcebf6}
  .card .nm{font-weight:900;font-size:1.05rem}
  .card .chip{font-size:.8rem;font-weight:900;color:#fff;border-radius:10px;padding:2px 10px}
  .card .yrs{font-size:.9rem;font-weight:800;color:#5b7b97;min-height:1.2em}
  .card.win{background:#e8fbf4;box-shadow:0 6px 0 #bfe6da,0 0 0 4px var(--accent)}
  .card.bad{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .reveal{min-height:1.5em;font-weight:800;color:var(--accent);margin-top:10px}
  .next{margin-top:8px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .next:disabled{opacity:.35;cursor:default}
  .pass{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .stamp{width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px #dcebf6;display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.4;filter:grayscale(1)}
  .stamp.on{opacity:1;filter:none;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
  .toast{position:fixed;left:50%;top:10%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:1.1rem;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .toast.show{opacity:1}
  .conf{position:fixed;top:-12px;font-size:1.3rem;pointer-events:none;z-index:15;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
  .cover{position:fixed;inset:0;background:#eef6fcf2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20}
  .cover h1{font-size:2.1rem;margin:8px 0}
  .cover p{font-size:1.08rem;font-weight:700;color:#5b7b97;max-width:430px;margin:4px 0 18px}
  .big{border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.25rem;padding:15px 28px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 7px 0 #15705d}
  .hidden{display:none !important}
</style>
</head>
<body>
<header>
  <div class="logo">🕰️ Leader Time Machine</div>
  <div class="hbtns"><a class="backb" id="back" href="/play">←</a><button class="snd" id="snd">🔊</button></div>
</header>
<main>
  <div class="dial" id="dial"></div>
  <div class="q" id="q"></div>
  <button class="read" id="read">🔊 Read it to me</button>
  <div class="opts" id="opts"></div>
  <div class="reveal" id="reveal"></div>
  <button class="next" id="next" disabled>Next →</button>
  <div class="pass" id="pass"></div>
</main>
<div class="toast" id="toast"></div>

<div class="cover" id="start">
  <div style="font-size:3.8rem">🕰️🇺🇸🇬🇧</div>
  <h1>Leader Time Machine</h1>

</div>

</div>

am":true},{"n":"James Callaghan","p":"Labour","s":1976,"e":1979,"c":"uk","sd":"1976-04-05","ed":"1979-05-04","fam":false},{"n":"Margaret Thatcher","p":"Conservative","s":1979,"e":1990,"c":"uk","sd":"1979-05-04","ed":"1990-11-28","fam":true},{"n":"John Major","p":"Conservative","s":1990,"e":1997,"c":"uk","sd":"1990-11-28","ed":"1997-05-02","fam":true},{"n":"Tony Blair","p":"Labour","s":1997,"e":2007,"c":"uk","sd":"1997-05-02","ed":"2007-06-27","fam":true},{"n":"Gordon Brown","p":"Labour","s":2007,"e":2010,"c":"uk","sd":"2007-06-27","ed":"2010-05-11","fam":true},{"n":"David Cameron","p":"Conservative","s":2010,"e":2016,"c":"uk","sd":"2010-05-11","ed":"2016-07-13","fam":true},{"n":"Theresa May","p":"Conservative","s":2016,"e":2019,"c":"uk","sd":"2016-07-13","ed":"2019-07-24","fam":true},{"n":"Boris Johnson","p":"Conservative","s":2019,"e":2022,"c":"uk","sd":"2019-07-24","ed":"2022-09-06","fam":true},{"n":"Liz Truss","p":"Conservative","s":2022,"e":2022,"c":"uk","sd":"2022-09-06","ed":"2022-10-25","fam":false},{"n":"Rishi Sunak","p":"Conservative","s":2022,"e":2024,"c":"uk","sd":"2022-10-25","ed":"2024-07-05","fam":true},{"n":"Keir Starmer","p":"Labour","s":2024,"e":2026,"c":"uk","sd":"2024-07-05","ed":"2026-07-21","fam":true},{"n":"Andy Burnham","p":"Labour","s":2026,"e":null,"c":"uk","sd":"2026-07-21","ed":null,"fam":true}],"monarchs":[{"n":"Queen Anne","p":"Stuart","s":1707,"e":1714,"c":"king","sd":"1707-05-01","ed":"1714-08-01","fam":true},{"n":"King George I","p":"Hanover","s":1714,"e":1727,"c":"king","sd":"1714-08-01","ed":"1727-06-11","fam":false},{"n":"King George II","p":"Hanover","s":1727,"e":1760,"c":"king","sd":"1727-06-11","ed":"1760-10-25","fam":false},{"n":"King George III","p":"Hanover","s":1760,"e":1820,"c":"king","sd":"1760-10-25","ed":"1820-01-29","fam":true},{"n":"King George IV","p":"Hanover","s":1820,"e":1830,"c":"king","sd":"1820-01-29","ed":"1830-06-26","fam":false},{"n":"King William IV","p":"Hanover","s":1830,"e":1837,"c":"king","sd":"1830-06-26","ed":"1837-06-20","fam":false},{"n":"Queen Victoria","p":"Saxe-Coburg and Gotha","s":1837,"e":1901,"c":"king","sd":"1837-06-20","ed":"1901-01-22","fam":true},{"n":"King Edward VII","p":"Saxe-Coburg and Gotha","s":1901,"e":1910,"c":"king","sd":"1901-01-22","ed":"1910-05-06","fam":false},{"n":"King George V","p":"Windsor (renamed from Saxe-Coburg)","s":1910,"e":1936,"c":"king","sd":"1910-05-06","ed":"1936-01-20","fam":false},{"n":"King Edward VIII","p":"Windsor","s":1936,"e":1936,"c":"king","sd":"1936-01-20","ed":"1936-12-11","fam":false},{"n":"King George VI","p":"Windsor","s":1936,"e":1952,"c":"king","sd":"1936-12-11","ed":"1952-02-06","fam":true},{"n":"Queen Elizabeth II","p":"Windsor","s":1952,"e":2022,"c":"king","sd":"1952-02-06","ed":"2022-09-08","fam":true},{"n":"King Charles III","p":"Windsor","s":2022,"e":null,"c":"king","sd":"2022-09-08","ed":null,"fam":true}]};
const FLAG={us:"https://flagcdn.com/w160/us.png",uk:"https://flagcdn.com/w160/gb.png",king:"https://flagcdn.com/w160/gb.png"};
const ROLE={us:"President",uk:"Prime Minister",king:"Monarch"};
const N=8;
const $=id=>document.getElementById(id);
let sound=true,idx=0,cur=null,done=false,rounds=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function speak(t){if(!sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
function confetti(n){const em=["🕰️","⭐","🎉","👑"];for(let i=0;i<n;i++){const s=document.createElement("div");s.className="conf";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.4+Math.random())+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
let tT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),1300);}
function buildPass(){const el=$("pass");el.innerHTML="";for(let i=0;i<N;i++){const d=document.createElement("div");d.className="stamp"+(i<idx?" on":"");d.textContent="🕰️";el.appendChild(d);}}
function partyColor(p,c){
  if(c==="us") return p==="Democratic"?"var(--dem)":(p==="Republican"?"var(--rep)":"var(--oth)");
  if(p==="Labour") return "var(--lab)"; if(p==="Conservative") return "var(--con)";
  return "var(--oth)";
}
function yrs(e){return e.s+" – "+(e.e===null?"today":e.e);}
function famous(list){const seen={};return list.filter(x=>x.fam&&!seen[x.n]&&(seen[x.n]=1));}
const FP=famous(DATA.presidents), FM=famous(DATA.pms), FK=famous(DATA.monarchs);
function overlap(a,b){const as=a.s,ae=a.e===null?9999:a.e,bs=b.s,be=b.e===null?9999:b.e;return Math.min(ae,be)-Math.max(as,bs);}

/* ---- question builders ---- */
function qDuel(){
  const list=Math.random()<.5?FP:FM;
  const two=shuffle(list).slice(0,2).filter(Boolean);
  if(two.length<2||two[0].s===two[1].s)return qDuel();
  const role=ROLE[two[0].c];
  const first=two[0].s<two[1].s?two[0]:two[1];
  return {kind:"duel",dial:"WHO CAME FIRST?",say:"Who was "+role+" first: "+two[0].n+", or "+two[1].n+"?",
    q:"Who was "+role+" FIRST?",opts:two,ans:two.indexOf(first),
    fact:first.n+" came first ("+yrs(first)+"). "+(two[two.indexOf(first)?0:1]).n+" was later ("+yrs(two[two.indexOf(first)?0:1])+").",
    layout:"two",showYears:false};
}
function qYear(){
  const list=Math.random()<.5?DATA.presidents:DATA.pms;
  const flist=list===DATA.presidents?FP:FM;
  const truthTerm=pick(list.filter(x=>x.fam));
  const span=(truthTerm.e===null?2026:truthTerm.e)-truthTerm.s;
  const year=truthTerm.s+1+Math.floor(Math.random()*Math.max(1,span-1));
  const role=ROLE[truthTerm.c];
  const wrong=shuffle(flist.filter(x=>x.n!==truthTerm.n&&!(x.s<=year&&(x.e===null?9999:x.e)>=year))).slice(0,2);
  const opts=shuffle([truthTerm,...wrong]);
  return {kind:"year",dial:"YEAR "+year,say:"The dial says "+year+". Who was "+role+" in "+year+"?",
    q:"Who was "+role+" in "+year+"?",opts,ans:opts.indexOf(truthTerm),
    fact:truthTerm.n+" was "+role+" from "+yrs(truthTerm)+".",layout:"three",showYears:false};
}
function qCross(useKing){
  const pres=pick(FP.filter(p=>p.s>=1789));
  const presTerms=DATA.presidents.filter(t=>t.n===pres.n);
  const others=useKing?DATA.monarchs:DATA.pms;
  let best=null,bestOv=-1;
  for(const o of others){const t=presTerms.map(pt=>overlap(pt,o)).sort((a,b)=>b-a)[0];if(t>bestOv){bestOv=t;best=o;}}
  if(!best||bestOv<1)return qCross(useKing);
  const pool=(useKing?FK:FM).filter(x=>x.n!==best.n&&presTerms.every(pt=>overlap(pt,x)<0));
  if(pool.length<2)return qCross(useKing);
  const wrong=shuffle(pool).slice(0,2);
  const opts=shuffle([best,...wrong]);
  const role=useKing?"on the throne":"Prime Minister";
  return {kind:"cross",dial:pres.n.toUpperCase(),say:"When "+pres.n+" was President, who was "+role+" in the UK?",
    q:"When <b>"+pres.n+"</b> 🇺🇸 was President, who was "+(useKing?"on the throne 👑":"Prime Minister")+"?",
    opts,ans:opts.indexOf(best),
    fact:best.n+" ("+yrs(best)+") and "+pres.n+" ("+yrs(pres)+") were in charge at the same time.",
    layout:"three",showYears:false};
}
function makeRounds(){
  const r=[qDuel(),qDuel(),qDuel(),qYear(),qYear(),qCross(false),qCross(false),qCross(true)];
  return shuffle(r);
}
function render(){
  done=false; cur=rounds[idx];
  $("dial").textContent="🕰️ "+cur.dial;
  $("q").innerHTML=cur.q;
  const o=$("opts"); o.innerHTML=""; o.className="opts "+cur.layout;
  cur.opts.forEach((e,i)=>{
    const b=document.createElement("button"); b.className="card";
    b.innerHTML='<img class="fl" src="'+FLAG[e.c]+'" alt="" onerror="this.style.display=\'none\'">'
      +'<span class="nm">'+(e.c==="king"?"👑 ":"")+e.n+'</span>'
      +'<span class="chip" style="background:'+partyColor(e.p,e.c)+'">'+(e.p||"—")+'</span>'
      +'<span class="yrs" data-y="'+yrs(e)+'"></span>';
    b.onclick=()=>choose(i,b); o.appendChild(b);
  });
  $("reveal").textContent=""; $("next").disabled=true;
  buildPass(); speak(cur.say);
}
function choose(i,b){
  if(done)return;
  if(i===cur.ans){
    done=true; b.classList.add("win");
    [...$("opts").children].forEach(c=>{const y=c.querySelector(".yrs");y.textContent=y.dataset.y;});
    $("reveal").textContent="✅ "+cur.fact;
    $("next").disabled=false;
    toast(pick(["Time travel genius! 🕰️","Yes! ⭐","History hero! 🎉"]));
    speak(cur.fact); confetti(10);
    idx++; buildPass();
  } else {
    b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),420);
    toast("Try again 🤔"); speak("Not that one. Try again!");
  }
}
$("next").onclick=()=>{ if(idx>=N){ $("finale").classList.remove("hidden"); confetti(24); speak("History hero! Amazing!"); } else render(); };
$("go").onclick=()=>{ $("start").classList.add("hidden"); rounds=makeRounds(); idx=0; render(); };
$("again").onclick=()=>{ $("finale").classList.add("hidden"); rounds=makeRounds(); idx=0; render(); };
$("read").onclick=()=>{ if(cur)speak(cur.say); };
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊":"🔇";if(!sound&&"speechSynthesis" in window)speechSynthesis.cancel();};
if(location.protocol==="file:")$("back").setAttribute("href","index.html");
buildPass();
</script>
