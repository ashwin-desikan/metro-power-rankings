<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Then &amp; Now — Play &amp; Learn</title>
<style>
  :root{--ink:#16324f;--sea:#bfe3ff;--sea2:#a9d7fb;--land:#8fd6a9;--accent:#1f9e82;--gold:#f6b93b;--red:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2","Segoe UI",system-ui,-apple-system,sans-serif;background:#eef6fc;color:var(--ink);overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
  .logo{font-size:1.35rem;font-weight:900}
  .snd{border:none;background:#fff;border-radius:14px;font-size:1.3rem;padding:6px 12px;box-shadow:0 4px 0 #cfe0ee;cursor:pointer}
  main{max-width:1000px;margin:0 auto;padding:0 14px 14px}
  .prompt{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 8px 0 #d6e6f2;margin-bottom:10px}
  .crown{font-size:2.4rem;flex:none}
  .prompt .big{font-size:1.5rem;font-weight:900;line-height:1.1}
  .prompt .era{font-size:1rem;font-weight:800;color:var(--accent);margin-top:2px}
  .say{margin-left:auto;border:none;background:var(--gold);color:#5a3d00;border-radius:16px;font-size:1.5rem;padding:8px 14px;box-shadow:0 5px 0 #cf9526;cursor:pointer;flex:none}
  .ask{font-size:1.05rem;font-weight:800;color:var(--ink);opacity:.85;margin:2px 2px 8px}
  .mapwrap{position:relative;width:100%;aspect-ratio:2/1;background:linear-gradient(180deg,var(--sea),var(--sea2));border-radius:26px;box-shadow:inset 0 0 0 5px #ffffff, 0 10px 0 #cbdff0;overflow:hidden}
  svg.map{position:absolute;inset:0;width:100%;height:100%}
  .land{fill:var(--land);stroke:#5fb783;stroke-width:2}
  .marker{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;transition:transform .12s}
  .marker:active{transform:translate(-50%,-50%) scale(.92)}
  .marker .flag{width:44px;height:32px;border-radius:7px;background:#fff center/cover no-repeat;box-shadow:0 3px 0 #00000030, 0 0 0 3px #fff;display:block}
  .marker .nm{font-size:.78rem;font-weight:800;background:#ffffffcc;border-radius:8px;padding:1px 6px;white-space:nowrap}
  .marker.good .flag{box-shadow:0 0 0 4px var(--accent), 0 0 22px 6px #1f9e8288}
  .marker.bad{animation:shake .4s}
  .marker.dim{opacity:.28;filter:grayscale(.6)}
  @keyframes shake{25%{transform:translate(-50%,-50%) rotate(-8deg)}75%{transform:translate(-50%,-50%) rotate(8deg)}}
  .halo{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:#ffd86b55;border:3px dashed #f0a72e;pointer-events:none;opacity:0;transition:opacity .3s}
  .dialwrap{background:#fff;border-radius:20px;padding:10px 16px 14px;box-shadow:0 8px 0 #d6e6f2;margin-top:10px}
  .diallbl{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;color:#6d8aa4}
  input[type=range]{width:100%;height:30px;accent-color:var(--accent);margin-top:4px}
  .row{display:flex;gap:10px;margin-top:8px;align-items:center}
  .btn{border:none;border-radius:16px;font-weight:900;font-size:1.05rem;padding:12px 18px;cursor:pointer}
  .next{background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d;margin-left:auto}
  .next:disabled{opacity:.4;box-shadow:none}
  .see{background:#eaf3fb;color:var(--ink);text-decoration:none;box-shadow:0 5px 0 #cfe0ee;font-size:.95rem}
  .pass{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;justify-content:center}
  .stamp{width:34px;height:34px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px #dcebf6;display:flex;align-items:center;justify-content:center;font-size:1.1rem;opacity:.4;filter:grayscale(1)}
  .stamp.on{opacity:1;filter:none;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.35) rotate(-8deg)}}
  .toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:1.2rem;padding:12px 20px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s, top .25s;z-index:9}
  .toast.show{opacity:1;top:12%}
  .finale{position:fixed;inset:0;background:#fffef7;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20}
  .finale.show{display:flex}
  .finale h1{font-size:2.4rem;margin:.2em}
  .conf{position:fixed;top:-10px;font-size:1.4rem;pointer-events:none;z-index:15;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .reveal{font-size:1.1rem;font-weight:800;color:var(--accent);min-height:1.4em;text-align:center;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="logo"><span>🗺️</span> Then &amp; Now</div>
  <button class="snd" id="snd" aria-label="sound on off">🔊</button>
</header>
<main>
  <div class="prompt">
    <div class="crown" id="crown">👑</div>
    <div><div class="big" id="empName">—</div><div class="era" id="era">—</div></div>
    <button class="say" id="say" aria-label="read aloud">📣</button>
  </div>
  <div class="ask">Tap the country that is on this land <b>today</b>.</div>
  <div class="mapwrap" id="mapwrap">
    <svg class="map" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
      <path class="land" d="M60,120 q40,-60 150,-45 q70,8 95,55 q10,60 -40,70 q-30,55 -95,40 q-70,-6 -95,-55 q-30,-40 -20,-65z"/>
      <path class="land" d="M250,300 q35,-30 70,-10 q35,25 30,80 q-6,70 -45,95 q-40,18 -60,-25 q-22,-70 -5,-120 q4,-15 10,-20z"/>
      <path class="land" d="M470,175 q40,-30 95,-15 q55,20 60,85 q8,75 -40,120 q-45,35 -80,-5 q-40,-55 -45,-125 q-2,-40 10,-60z"/>
      <path class="land" d="M470,120 q40,-40 95,-30 q40,8 40,42 q-4,34 -55,40 q-55,4 -80,-20 q-14,-20 0,-32z"/>
      <path class="land" d="M600,110 q90,-55 220,-30 q95,20 110,80 q6,55 -70,70 q-60,50 -170,35 q-110,-8 -150,-70 q-30,-55 -10,-100 q25,-30 60,-55z"/>
      <path class="land" d="M812,360 q45,-24 90,-6 q30,18 20,52 q-14,38 -70,40 q-52,0 -66,-40 q-8,-30 26,-46z"/>
    </svg>
    <div class="halo" id="halo"></div>
    <div id="markers"></div>
  </div>
  <div class="reveal" id="reveal"></div>
  <div class="dialwrap">
    <div class="diallbl"><span>⏪ Long, long ago</span><span>Today ⏩</span></div>
    <input type="range" id="dial" min="0" max="11" step="1" value="0" aria-label="time dial">
    <div class="row">
      <a class="btn see" id="see" href="#" target="_blank" rel="noopener" style="visibility:hidden">See it on the map →</a>
      <button class="btn next" id="next" disabled>Next ▶</button>
    </div>
  </div>
  <div class="pass" id="pass"></div>
</main>
<div class="toast" id="toast"></div>
<div class="finale" id="finale">
  <h1>🏆 You are a Time Explorer!</h1>
  <p style="font-size:1.2rem;font-weight:800" id="finaleP">You matched every empire to its land today.</p>
  <button class="btn next" id="again" style="margin:18px 0 0" onclick="location.reload()">Play again 🔁</button>
</div>

   const b=document.createElement("button"); b.className="marker"; b.style.left=p.x+"%"; b.style.top=p.y+"%";
   b.innerHTML='<span class="flag" style="background-image:url('+flagUrl(k)+')"></span><span class="nm">'+c.n+'</span>';
   b.onclick=()=>choose(k,b); M.appendChild(b); });
 const ask=r.yes.length>1?"Tap a country on this land today!":"Which country is here today?";
 speak(r.emp+", "+r.era+". "+ask); buildPass();
}
function choose(k,btn){
 const r=order[idx];
 if(r.yes.includes(k)){
   if(!solved[idx]) solved[idx]=true;
   [...document.querySelectorAll('.marker')].forEach(m=>{ const nm=m.querySelector('.nm').textContent;
     const key=Object.keys(C).find(x=>C[x].n===nm); if(r.yes.includes(key)) m.classList.add('good'); else m.classList.add('dim'); });
   $("reveal").textContent="✅ "+r.fact;
   const first=C[r.yes[0]]; const s=$("see"); s.href=SITE+"/countries/"+first.slug; s.style.visibility="visible";
   $("next").disabled=false; toast(pick(["Yes! 🎉","Nice! ⭐","You got it! 🙌","Time Explorer! 🧭"]));
   speak("Yes! "+r.fact); confetti(); buildPass();
   if(solved.every(Boolean)) setTimeout(finale,900);
 } else {
   btn.classList.remove('bad'); void btn.offsetWidth; btn.classList.add('bad');
   toast("Try again! 🤔"); speak("Not quite. Look for where "+r.emp.replace('The ','').replace(' (West)','')+" was.");
   const p=proj(C[r.yes[0]].lat,C[r.yes[0]].lon); const h=$("halo"); h.style.left=p.x+"%"; h.style.top=p.y+"%"; h.style.width="90px"; h.style.height="90px"; h.style.opacity=1;
   setTimeout(()=>h.style.opacity=0,1400);
 }
}
let tT; function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(tT); tT=setTimeout(()=>el.classList.remove("show"),1300); }
function confetti(){ const em=["🎉","⭐","🏆","✨","🎊","👑"]; for(let i=0;i<18;i++){ const s=document.createElement("div"); s.className="conf"; s.textContent=em[i%em.length]; s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(1.6+Math.random()*1.4)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),3000);} }
function finale(){ buildPass(); $("finale").classList.add("show"); speak("Amazing! You matched every empire to its land today. You are a Time Explorer!"); confetti(); }
$("next").onclick=()=>{ if(idx<order.length-1){ idx++; render(); } else if(solved.every(Boolean)){ finale(); } };
$("dial").oninput=e=>{ idx=+e.target.value; render(); };
$("say").onclick=()=>{ const r=order[idx]; speak(r.emp+", "+r.era+". Which country is on this land today?"); };
$("snd").onclick=()=>{ sound=!sound; $("snd").textContent=sound?"🔊":"🔇"; if(!sound) speechSynthesis.cancel(); };
order=shuffle(ROUNDS).slice(0,PICK).sort((a,b)=>a.y-b.y); solved=new Array(order.length).fill(false); $("dial").max=order.length-1; render();
</script>
</body>
