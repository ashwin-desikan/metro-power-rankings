<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Higher or Lower — Play and Learn</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  /* number-line kit (game-specific, mobile-first, no horizontal scroll) */
  .hunt{margin-top:10px}
  .rangeLab{font-size:1rem;font-weight:800;color:#16324f;margin-bottom:8px}
  .trackWrap{position:relative;padding:18px 0 26px}
  .track{position:relative;height:26px;border-radius:999px;background:#dff1e9;cursor:pointer;overflow:hidden;box-shadow:inset 0 2px 4px #16324f22}
  .elim{position:absolute;top:0;bottom:0;background:#c9d3dc;transition:width .25s}
  #elimLeft{left:0;border-radius:999px 0 0 999px}
  #elimRight{right:0;border-radius:0 999px 999px 0}
  .zone{position:absolute;top:0;bottom:0;background:#b9ecd9;transition:all .25s}
  .marker{position:absolute;top:-12px;width:4px;height:50px;background:#ff6b6b;border-radius:2px;transform:translateX(-2px);transition:left .15s;pointer-events:none}
  .marker::after{content:"▼";position:absolute;top:-16px;left:50%;transform:translateX(-50%);color:#ff6b6b;font-size:.9rem}
  .lineLabs{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;color:#5b7b97;padding:4px 2px 0}
  .guessRow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .nudge{border:none;background:#f3f7fb;border-radius:14px;width:52px;height:52px;font-size:1.5rem;font-weight:800;color:#16324f;cursor:pointer;box-shadow:0 4px 0 #c9d8e6}
  .nudge:active{transform:translateY(2px);box-shadow:0 2px 0 #c9d8e6}
  .guessVal{min-width:120px;font-size:1.5rem;font-weight:800;color:#16324f}
  .robotBtn{border:none;background:#eaf6ff;color:#1d6fb8;font-weight:800;border-radius:999px;padding:10px 16px;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 #c3ddf1}
  .robotBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #c3ddf1}
  .goBtn{border:none;background:var(--coral);color:#fff;font-weight:800;font-size:1.25rem;border-radius:999px;padding:13px 30px;cursor:pointer;box-shadow:0 6px 0 #d2453f}
  .goBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #d2453f}
  .triesLab{min-height:22px;font-size:.95rem;font-weight:700;color:#5b7b97;margin-top:8px}
  .scoreLine{font-size:1.05rem;font-weight:700;color:#16324f;max-width:460px;margin:6px auto;line-height:1.4}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="ball" id="logoEmoji">🎯</span> <span id="logoText">Higher or Lower</span></div>
  <div class="hgroup">
    <a class="back" id="back" href="/play">← All games</a>
    <button class="sound" id="snd" aria-label="sound on or off">🔊</button>
  </div>
</header>
<div class="passport" id="passport"></div>
<main>
  <div class="card" id="card">
    <div class="scene" id="scene">
      <span class="flag" id="flag"></span>
      <span class="city" id="city">🎯</span>
      <svg class="pip" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#7fd1ff" stroke="#16324f" stroke-width="4"/><rect x="24" y="30" width="52" height="34" rx="8" fill="#fff" stroke="#16324f" stroke-width="3"/><circle cx="40" cy="45" r="5" fill="#16324f"/><circle cx="60" cy="45" r="5" fill="#16324f"/><rect x="40" y="54" width="20" height="4" rx="2" fill="#16324f"/><rect x="46" y="20" width="8" height="10" fill="#16324f"/><circle cx="50" cy="16" r="5" fill="#ffd23f" stroke="#16324f" stroke-width="2"/></svg>
    </div>
    <div class="place" id="place">—<small id="sub">—</small></div>
    <div class="q" id="q">Loading…</div>
    <button class="readbtn" id="read">🔊 Read it to me</button>
    <div class="hunt" id="hunt">
      <div class="rangeLab" id="range">—</div>
      <div class="trackWrap">
        <div class="track" id="track">
          <div class="elim" id="elimLeft" style="width:0%"></div>
          <div class="elim" id="elimRight" style="width:0%"></div>
          <div class="zone" id="zone"></div>
        </div>
        <div class="marker" id="marker" style="left:50%"></div>
        <div class="lineLabs"><span id="loLab">—</span><span id="hiLab">—</span></div>
      </div>
      <div class="guessRow">
        <button class="nudge" id="minus" aria-label="a bit lower">−</button>
        <div class="guessVal" id="guessVal">—</div>
        <button class="nudge" id="plus" aria-label="a bit higher">+</button>
      </div>
      <div class="guessRow">
        <button class="robotBtn" id="robot">🤖 Robot tip: the middle</button>
        <button class="goBtn" id="guessBtn">Guess!</button>
      </div>
      <div class="triesLab" id="tries"></div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="reveal" id="reveal"><div class="fact" id="fact"></div><a class="golink" id="golink" target="_blank" rel="noopener">See on the site →</a></div>
    <button class="next" id="next">Next →</button>
    <div class="finale" id="finale">
      <h2 id="finaleH">🎯 You did it!</h2>
      <p id="finaleP" style="font-size:1.2rem;font-weight:700;color:#16324f">Great searching!</p>
      <p class="scoreLine" id="scoreLine"></p>
      <div class="stamps" id="finalStamps"></div>
      <button class="next show" id="again">Play again 🔁</button>
    </div>
  </div>
</main>
<p class="grown" id="grownText"></p>
<script src="pools/higher-or-lower.js"></script>
<script src="assets/hl-engine.js"></script>
</body>
</html>
