<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kick-Off Clock — Play &amp; Learn</title>
<style>
  :root{--ink:#16324f;--accent:#1f9e82;--gold:#f6b93b;--paper:#eef6fc;--hot:#ff6b6b;--blue:#3b6fd4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:560px;margin:0 auto}
  .logo{font-size:1.25rem;font-weight:900}
  .hbtns{display:flex;gap:8px}
  .snd,.backb{border:none;background:#fff;border-radius:14px;font-size:1.1rem;padding:6px 12px;box-shadow:0 4px 0 #cfe0ee;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:900}
  main{max-width:560px;margin:0 auto;padding:0 14px 20px;text-align:center}
  .lvlchip{display:inline-block;background:#fff;border-radius:12px;padding:3px 12px;font-weight:900;font-size:.85rem;color:#5b7b97;box-shadow:0 3px 0 #cfe0ee;margin-bottom:6px}
  .stage{background:#fff;border-radius:20px;box-shadow:0 8px 20px #16324f1c;padding:16px 12px}
  .q{font-size:1.12rem;font-weight:900;margin:2px 0 6px}
  .read{border:none;background:#eef6fc;border-radius:12px;font-size:.95rem;padding:5px 12px;cursor:pointer;font-weight:800;color:var(--ink)}
  .reveal{min-height:1.5em;font-weight:800;color:var(--accent);margin-top:8px;font-size:1rem}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{border:none;border-radius:16px;background:#f6fbff;box-shadow:0 5px 0 #d7e6f2;cursor:pointer;padding:14px 6px;font-family:inherit;font-weight:900;color:var(--ink);font-size:1.15rem;transition:transform .12s}
  .opt:active{transform:scale(.95)}
  .opt.good{background:#e8fbf4;box-shadow:0 5px 0 #bfe6da,0 0 0 3px var(--accent)}
  .opt.bad{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .next{margin-top:12px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .next:disabled{opacity:.35;cursor:default}
  .check{margin-top:12px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 6px 0 #24509e}
  .pass{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .stamp{width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px #dcebf6;display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.4;filter:grayscale(1)}
  .stamp.on{opacity:1;filter:none;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
  .toast{position:fixed;left:50%;top:9%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:1.05rem;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
  .toast.show{opacity:1}
  .conf{position:fixed;top:-12px;font-size:1.3rem;pointer-events:none;z-index:40;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
  .cover{position:fixed;inset:0;background:#eef6fcf2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20;overflow:auto}
  .cover h1{font-size:2rem;margin:8px 0}
  .cover p{font-size:1.05rem;font-weight:700;color:#5b7b97;max-width:430px;margin:4px 0 14px}
  .lvlbtn{display:block;width:min(330px,86vw);margin:7px auto;border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.18rem;padding:14px 20px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 6px 0 #cfe0ee;text-align:center}
  .lvlbtn.go{background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .lvlbtn small{display:block;font-size:.82rem;font-weight:800;color:#5b7b97}
  .lvlbtn.go small{color:#d6f5ec}
  .bigbtn{border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.15rem;padding:14px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 7px 0 #15705d;margin:6px}
  .homebtn{display:inline-block;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.15rem;padding:14px 26px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 7px 0 #cfe0ee;margin:6px;text-decoration:none}
  .hidden{display:none !important}
  svg.clk{width:min(230px,64vw);height:auto;margin-top:10px}
  svg.pitchp{width:min(330px,84vw);height:auto;margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="logo">🕰️ Kick-Off Clock</div>
  <div class="hbtns"><a class="backb" id="back" href="/play">←</a><button class="snd" id="snd">🔊</button></div>
</header>
<main>
  <div class="lvlchip" id="lvlchip"></div>
  <div class="stage">
    <div class="q" id="q"></div>
    <button class="read" id="read">🔊 Read it to me</button>
    <div id="zone"></div>
    <div class="reveal" id="reveal"></div>
    <button class="next" id="next" disabled>Next →</button>
  </div>
  <div class="pass" id="pass"></div>
</main>
<div class="toast" id="toast"></div>

<div class="cover" id="start">
  <div style="font-size:3.6rem">🕰️⚽</div>
  <h1>Kick-Off Clock</h1>
  <p>Read the stadium clock with its Roman numerals, switch between 12-hour and 24-hour kick-off times, and jog the pitch perimeter!</p>
  <button class="lvlbtn go" id="lvl3">⭐ Year 3<small>Clock reading · 12h & 24h · Roman numerals · durations · perimeter</small></button>
  <button class="lvlbtn" id="lvl4">🌟 Year 4<small>Any-minute clocks · area · converting km, m and minutes</small></button>
</div>

<div class="cover hidden" id="finale">
  <div style="font-size:3.8rem">🕰️🏅</div>
  <h1>Right on time!</h1>
  <p id="finp">Never late for kick-off again. Timekeeper of the season!</p>
  <div>
    <button class="bigbtn" id="again">Play again 🔁</button>
    <a class="homebtn" id="homelink" href="/play">All games 🎮</a>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const N=8;
let sound=true,LEVEL=3,idx=0,done=false,actx=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function speak(t){if(!sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
function ctx(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();return actx;}catch(e){return null;}}
function tone(f,d,type,when,g){if(!sound)return;const a=ctx();if(!a)return;const o=a.createOscillator(),gn=a.createGain();o.type=type||"sine";o.frequency.value=f;gn.gain.value=g||.12;o.connect(gn);gn.connect(a.destination);const t=a.currentTime+(when||0);o.start(t);gn.gain.setValueAtTime(gn.gain.value,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d);}
function cheer(){[523,659,784,1047].forEach((f,k)=>tone(f,.24,"triangle",k*.09,.13));}
function buzz(){tone(170,.2,"sine",0,.1);}
function confetti(n){const em=["🕰️","⭐","🎉","⏱️"];for(let i=0;i<n;i++){const s=document.createElement("div");s.className="conf";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.4+Math.random())+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
let tT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),1300);}
function buildPass(){const el=$("pass");el.innerHTML="";for(let i=0;i<N;i++){const d=document.createElement("div");d.className="stamp"+(i<idx?" on":"");d.textContent="⏱️";el.appendChild(d);}}
function onCorrect(msg,sayMsg){
  done=true;$("reveal").textContent="✅ "+msg;
  toast(pick(["Yes! 🎉","Brilliant! ⭐","Maths star! 🙌"]));
  cheer();confetti(9);speak(sayMsg||msg);
  idx++;buildPass();
  $("next").disabled=false;
  $("next").textContent = idx>=N ? "See my score →" : "Next →";
}
function onWrong(hint){toast(hint||"Try again 🤔");buzz();speak("Not quite. Try again!");}
function finish(){$("finale").classList.remove("hidden");confetti(24);cheer();speak("Right on time! Timekeeper of the season!");}
$("next")&&($("next").onclick=()=>{ if(!done)return; if(idx>=N){finish();} else render(); });
function startRun(lv){LEVEL=lv;$("lvlchip").textContent=(lv===3?"⭐ Year 3":"🌟 Year 4");$("start").classList.add("hidden");ctx();idx=0;makeRounds();render();}
$("lvl3").onclick=()=>startRun(3);
$("lvl4").onclick=()=>startRun(4);
$("again").onclick=()=>{$("finale").classList.add("hidden");$("start").classList.remove("hidden");};
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊":"🔇";if(!sound&&"speechSynthesis" in window)speechSynthesis.cancel();};
if(location.protocol==="file:"){$("back").setAttribute("href","index.html");$("homelink").setAttribute("href","index.html");}
buildPass();

const ROMAN=["XII","I","II","III","IV","V","VI","VII","VIII","IX","X","XI"];
let rounds=[];
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function mcq(options,ans,msg,say){
  const o=document.createElement("div");o.className="opts"+(options.length===2?" two":"");
  options.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=t;
    b.onclick=()=>{if(done)return;
      if(i===ans){b.classList.add("good");onCorrect(msg,say);}
      else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),420);onWrong();}};
    o.appendChild(b);});
  $("zone").appendChild(o);
}
function clockSVG(h,m){
  let s='<svg class="clk" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#16324f" stroke-width="6"/><circle cx="100" cy="100" r="88" fill="none" stroke="#dcebf6" stroke-width="2"/>';
  for(let i=0;i<12;i++){
    const a=(i*30-90)*Math.PI/180;
    s+='<text x="'+(100+72*Math.cos(a)).toFixed(1)+'" y="'+(100+72*Math.sin(a)+5).toFixed(1)+'" text-anchor="middle" font-size="15" font-weight="800" fill="#16324f">'+ROMAN[i]+'</text>';
  }
  for(let i=0;i<60;i+=5){const a=(i*6-90)*Math.PI/180;
    s+='<line x1="'+(100+84*Math.cos(a)).toFixed(1)+'" y1="'+(100+84*Math.sin(a)).toFixed(1)+'" x2="'+(100+90*Math.cos(a)).toFixed(1)+'" y2="'+(100+90*Math.sin(a)).toFixed(1)+'" stroke="#5b7b97" stroke-width="3"/>';}
  const ha=((h%12)*30+m*0.5-90)*Math.PI/180, ma=(m*6-90)*Math.PI/180;
  s+='<line x1="100" y1="100" x2="'+(100+44*Math.cos(ha)).toFixed(1)+'" y2="'+(100+44*Math.sin(ha)).toFixed(1)+'" stroke="#16324f" stroke-width="8" stroke-linecap="round"/>';
  s+='<line x1="100" y1="100" x2="'+(100+66*Math.cos(ma)).toFixed(1)+'" y2="'+(100+66*Math.sin(ma)).toFixed(1)+'" stroke="#e04848" stroke-width="5" stroke-linecap="round"/>';
  s+='<circle cx="100" cy="100" r="6" fill="#f6b93b"/></svg>';
  return s;
}
function two(n){return String(n).padStart(2,"0");}
function makeRounds(){
  const kinds=LEVEL===3?["readc","readc","conv","dur","perim","readc","roman","dur"]
                       :["readc","conv","dur","perim","area","units","readc","dur"];
  rounds=shuffle(kinds);
}
function render(){
  done=false;$("zone").innerHTML="";$("reveal").textContent="";$("next").disabled=true;$("next").textContent="Next →";buildPass();
  ({readc:rRead,conv:rConv,dur:rDur,perim:rPerim,area:rArea,units:rUnits,roman:rRoman})[rounds[idx]]();
}
/* read the stadium clock */
function rRead(){
  const h=ri(1,12), m=LEVEL===3?pick([0,15,30,45,5,10,20,25,35,40,50,55]):ri(1,59);
  $("q").innerHTML="The stadium clock says it's kick-off! What time is it?";
  window._say="Read the clock. The little hand is hours, the big hand is minutes.";speak(_say);
  $("zone").insertAdjacentHTML("beforeend",clockSVG(h,m));
  const ans=h+":"+two(m);
  const w1=((h%12)+1)+":"+two(m);
  const w2=h+":"+two((m+ (m<30?15:-15)+60)%60);
  const opts=shuffle([...new Set([ans,w1,w2])]);
  while(opts.length<3)opts.push(h+":"+two((m+5)%60));
  mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(ans),"The clock shows "+ans+" — Roman numeral "+ROMAN[h%12]+" is the "+h+"!","It's "+h+" "+(m===0?"o'clock":two(m))+"!");
}
/* 24h <-> 12h */
function rConv(){
  const h=ri(13,22), m=pick([0,15,30,45]);
  const dir=pick([true,false]);
  if(dir){
    $("q").innerHTML="Kick-off is at <b>"+two(h)+":"+two(m)+"</b>. What is that on a 12-hour clock?";
    window._say="Kick off at "+h+" "+two(m)+" on the 24 hour clock. What time is that in the evening?";speak(_say);
    const ans=(h-12)+":"+two(m)+" pm";
    const opts=shuffle([ans,(h-12)+":"+two(m)+" am",(h-11)+":"+two(m)+" pm"]);
    mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(ans),two(h)+":"+two(m)+" = "+ans+" (take away 12 for the afternoon!)","Take away twelve!");
  } else {
    const h12=h-12;
    $("q").innerHTML="The match starts at <b>"+h12+":"+two(m)+" pm</b>. What is that on the 24-hour clock?";
    window._say=h12+" "+(m?two(m):"o'clock")+" p m in 24 hour time?";speak(_say);
    const ans=two(h)+":"+two(m);
    const opts=shuffle([ans,two(h12)+":"+two(m),two(h+1)+":"+two(m)]);
    mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(ans),h12+":"+two(m)+" pm = "+ans+" (add 12 for the evening!)","Add twelve!");
  }
}
/* durations */
function rDur(){
  if(pick([true,false])){
    const h=ri(14,19), m1=pick([0,15,30]), mins=(LEVEL===3?pick([45,50,60,90]):pick([95,105,110,115]));
    const end=new Date(2026,0,1,h,m1+mins);
    $("q").innerHTML="Kick-off at <b>"+two(h)+":"+two(m1)+"</b>. The match lasts <b>"+(mins>=60?Math.floor(mins/60)+" h "+(mins%60?mins%60+" min":""):mins+" min")+"</b>. When does it end?";
    window._say="Kick off at "+h+" "+two(m1)+", the match lasts "+mins+" minutes. When does it finish?";speak(_say);
    const ans=two(end.getHours())+":"+two(end.getMinutes());
    const w1=two(end.getHours())+":"+two((end.getMinutes()+15)%60);
    const w2=two((end.getHours()+1)%24)+":"+two(end.getMinutes());
    const opts=shuffle([ans,w1,w2]);
    mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(ans),"It finishes at "+ans,"Full time at "+ans+"!");
  } else {
    const first=45, added=ri(1,6);
    $("q").innerHTML="The first half is <b>45 min</b> plus <b>"+added+" min</b> added time. How long in total?";
    window._say="45 minutes plus "+added+" added minutes?";speak(_say);
    const ans=45+added;
    const opts=shuffle([ans,45+added+5,40+added]);
    mcq(opts.map(x=>"<b>"+x+" min</b>"),opts.indexOf(ans),"45 + "+added+" = "+ans+" minutes","That's "+ans+" minutes of football!");
  }
}
/* pitch perimeter */
function pitchSVG(wd,ht,showArea){
  return '<svg class="pitchp" viewBox="0 0 340 220"><rect width="340" height="220" fill="#3fa34d" rx="12"/>'
   +'<rect x="60" y="40" width="220" height="140" fill="#5cc274" stroke="#fff" stroke-width="4"/>'
   +'<text x="170" y="30" text-anchor="middle" fill="#fff" font-weight="900" font-size="17">'+wd+' m</text>'
   +'<text x="40" y="115" text-anchor="middle" fill="#fff" font-weight="900" font-size="17">'+ht+' m</text>'
   +(showArea?'<text x="170" y="118" text-anchor="middle" font-size="26">🌱</text>':'<text x="170" y="118" text-anchor="middle" font-size="26">🏃</text>')+'</svg>';
}
function rPerim(){
  const wd=pick([40,50,60,100]), ht=pick([20,30,25]);
  const ans=2*(wd+ht);
  $("q").innerHTML="Warm-up! Jog all the way <b>around</b> the training pitch. How far is that?";
  window._say="The pitch is "+wd+" metres long and "+ht+" metres wide. All the way round: the perimeter?";speak(_say);
  $("zone").insertAdjacentHTML("beforeend",pitchSVG(wd,ht,false));
  const opts=shuffle([ans,wd+ht,ans+10]);
  mcq(opts.map(x=>"<b>"+x+" m</b>"),opts.indexOf(ans),wd+" + "+ht+" + "+wd+" + "+ht+" = "+ans+" m — all four sides!","The perimeter is "+ans+" metres!");
}
/* Y4: area */
function rArea(){
  const wd=pick([9,8,12,10]), ht=pick([5,6,4,7]);
  const ans=wd*ht;
  $("q").innerHTML="How much grass? Count the whole training square: <b>"+wd+" m × "+ht+" m</b>";
  window._say="The area: "+wd+" times "+ht+"?";speak(_say);
  $("zone").insertAdjacentHTML("beforeend",pitchSVG(wd,ht,true));
  const opts=shuffle([ans,2*(wd+ht),ans+wd]);
  const uniq=[...new Set(opts)];while(uniq.length<3)uniq.push(ans+2);
  mcq(uniq.map(x=>"<b>"+x+" m²</b>"),uniq.indexOf(ans),wd+" × "+ht+" = "+ans+" square metres of grass!","Area is length times width!");
}
/* Y4: unit conversion */
function rUnits(){
  const qs=[["The stadium is <b>2 km</b> from the station. How many metres?",2000,[2000,200,20000],"2 km = 2,000 m"],
            ["The keeper's goal kick flew <b>half a km</b>! How many metres?",500,[500,50,5000],"½ km = 500 m"],
            ["The match lasted <b>120 minutes</b> with extra time. How many hours?",2,[2,3,1],"120 min = 2 hours"]];
  const [q,ans,opts0,msg]=pick(qs);
  $("q").innerHTML=q;window._say=q.replace(/<[^>]+>/g,"");speak(_say);
  const opts=shuffle(opts0);
  mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(ans),msg,msg);
}
/* Roman numeral spotting */
function rRoman(){
  const n=ri(1,12);
  $("q").innerHTML="Which Roman numeral means <b>"+n+"</b> on the stadium clock?";
  window._say="Which Roman numeral is "+n+"?";speak(_say);
  const ans=ROMAN[n%12];
  const wrong=shuffle(ROMAN.filter(r=>r!==ans)).slice(0,2);
  const opts=shuffle([ans,...wrong]);
  mcq(opts.map(x=>"<b>"+x+"</b>"),opts.indexOf(ans),n+" is written "+ans,"That's "+n+"!");
}
$("read").onclick=()=>{if(window._say)speak(_say);};

</script>
</body>
</html>
