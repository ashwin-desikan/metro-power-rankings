<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stadium Stacker — Play &amp; Learn</title>
<style>
  :root{--ink:#16324f;--accent:#1f9e82;--gold:#f6b93b;--paper:#eef6fc;--hot:#ff6b6b;--blue:#3b6fd4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:560px;margin:0 auto}
  .logo{font-size:1.25rem;font-weight:900}
  .hbtns{display:flex;gap:8px}
  .snd,.backb{border:none;background:#fff;border-radius:14px;font-size:1.1rem;padding:6px 12px;box-shadow:0 4px 0 #cfe0ee;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:900}
  main{max-width:560px;margin:0 auto;padding:0 14px 20px;text-align:center}
  .lvlchip{display:inline-block;background:#fff;border-radius:12px;padding:3px 12px;font-weight:900;font-size:.85rem;color:#5b7b97;box-shadow:0 3px 0 #cfe0ee;margin-bottom:6px}
  .stage{background:#fff;border-radius:20px;box-shadow:0 8px 20px #16324f1c;padding:16px 12px}
  .q{font-size:1.12rem;font-weight:900;margin:2px 0 6px}
  .read{border:none;background:#eef6fc;border-radius:12px;font-size:.95rem;padding:5px 12px;cursor:pointer;font-weight:800;color:var(--ink)}
  .reveal{min-height:1.5em;font-weight:800;color:var(--accent);margin-top:8px;font-size:1rem}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.wide{grid-template-columns:1fr}
  .opts.wide .opt{font-size:1.3rem}
  .opt{border:none;border-radius:16px;background:#f6fbff;box-shadow:0 5px 0 #d7e6f2;cursor:pointer;padding:14px 6px;font-family:inherit;font-weight:900;color:var(--ink);font-size:1.15rem;transition:transform .12s}
  .opt:active{transform:scale(.95)}
  .opt.good{background:#e8fbf4;box-shadow:0 5px 0 #bfe6da,0 0 0 3px var(--accent)}
  .opt.bad{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .next{margin-top:12px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .next:disabled{opacity:.35;cursor:default}
  .check{margin-top:12px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 6px 0 #24509e}
  .pass{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .stamp{width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px #dcebf6;display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.4;filter:grayscale(1)}
  .stamp.on{opacity:1;filter:none;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
  .toast{position:fixed;left:50%;top:9%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:1.05rem;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
  .toast.show{opacity:1}
  .conf{position:fixed;top:-12px;font-size:1.3rem;pointer-events:none;z-index:40;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
  .cover{position:fixed;inset:0;background:#eef6fcf2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20;overflow:auto}
  .cover h1{font-size:2rem;margin:8px 0}
  .cover p{font-size:1.05rem;font-weight:700;color:#5b7b97;max-width:430px;margin:4px 0 14px}
  .lvlbtn{display:block;width:min(330px,86vw);margin:7px auto;border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.18rem;padding:14px 20px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 6px 0 #cfe0ee;text-align:center}
  .lvlbtn.go{background:var(--accent);color:#fff;box-shadow:0 6px 0 #15705d}
  .lvlbtn small{display:block;font-size:.82rem;font-weight:800;color:#5b7b97}
  .lvlbtn.go small{color:#d6f5ec}
  .bigbtn{border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.15rem;padding:14px 26px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 7px 0 #15705d;margin:6px}
  .homebtn{display:inline-block;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.15rem;padding:14px 26px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 7px 0 #cfe0ee;margin:6px;text-decoration:none}
  .hidden{display:none !important}
  .cols{display:flex;justify-content:center;gap:14px;margin-top:12px}
  .col{background:#f6fbff;border-radius:16px;padding:10px 8px;width:96px;box-shadow:0 4px 0 #d7e6f2}
  .col .lab{font-size:.72rem;font-weight:900;color:#5b7b97;text-transform:uppercase;letter-spacing:1px}
  .col .blocks{min-height:120px;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:6px 0}
  .blk{border-radius:5px}
  .blk.th{width:64px;height:15px;background:#8a6fc9}
  .blk.h{width:56px;height:13px;background:#e04848}
  .blk.t{width:44px;height:11px;background:#f6b93b}
  .blk.o{width:30px;height:9px;background:#3b6fd4}
  .col .cnt{font-size:1.3rem;font-weight:900}
  .col .pm{display:flex;justify-content:center;gap:6px;margin-top:4px}
  .col .pm button{border:none;border-radius:10px;background:#fff;box-shadow:0 3px 0 #cfe0ee;font-size:1.1rem;font-weight:900;width:34px;height:32px;cursor:pointer;color:var(--ink)}
  .total{font-size:1.5rem;font-weight:900;margin-top:10px}
  .ordwrap{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .ordcard{border:none;border-radius:16px;background:#f6fbff;box-shadow:0 5px 0 #d7e6f2;cursor:pointer;padding:12px;font-family:inherit;font-weight:900;color:var(--ink);font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}
  .ordcard.pick{background:#e8fbf4;box-shadow:0 5px 0 #bfe6da,0 0 0 3px var(--accent)}
  .ordcard .n{font-size:1.25rem}
  .seq{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:1.3rem;font-weight:900}
  .seq .step{background:#f6fbff;border-radius:12px;padding:8px 12px;box-shadow:0 4px 0 #d7e6f2}
  .seq .gap{background:var(--gold);color:#5c4300}
</style>
</head>
<body>
<header>
  <div class="logo">🏟️ Stadium Stacker</div>
  <div class="hbtns"><a class="backb" id="back" href="/play">←</a><button class="snd" id="snd">🔊</button></div>
</header>
<main>
  <div class="lvlchip" id="lvlchip"></div>
  <div class="stage">
    <div class="q" id="q"></div>
    <button class="read" id="read">🔊 Read it to me</button>
    <div id="zone"></div>
    <div class="reveal" id="reveal"></div>
    <button class="next" id="next" disabled>Next →</button>
  </div>
  <div class="pass" id="pass"></div>
</main>
<div class="toast" id="toast"></div>

<div class="cover" id="start">
  <div style="font-size:3.6rem">🏟️🧱</div>
  <h1>Stadium Stacker</h1>
  <p>Build match-day crowds from hundreds, tens and ones, order real skyscraper skylines, and count the turnstiles!</p>
  <button class="lvlbtn go" id="lvl3">⭐ Year 3<small>Numbers to 1,000 · 10 or 100 more/less · count in 4s, 8s, 50s, 100s</small></button>
  <button class="lvlbtn" id="lvl4">🌟 Year 4<small>Numbers past 1,000 · rounding · count in 6s, 7s, 9s, 25s · below zero</small></button>
  <button class="lvlbtn" id="lvl5">🚀 Expert<small>Real metro populations to 50 million · place value in the millions · order five · missing terms · through zero</small></button>
</div>

<div class="cover hidden" id="finale">
  <div style="font-size:3.8rem">🏟️⭐</div>
  <h1 id="finh1">Stadium full!</h1>
  <p id="finp">Every stand packed. You are a place-value champion!</p>
  <div>
    <div id="finaleMount"></div>
    <button class="bigbtn" id="again">Play again 🔁</button>
    <a class="homebtn" id="homelink" href="/play">All games 🎮</a>
  </div>
</div>

<script src="assets/scoring.js"></script>
<script>
const $=id=>document.getElementById(id);
const N=8;
let sound=true,LEVEL=3,idx=0,done=false,actx=null,nudges=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function speak(t){if(!sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
function ctx(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();return actx;}catch(e){return null;}}
function tone(f,d,type,when,g){if(!sound)return;const a=ctx();if(!a)return;const o=a.createOscillator(),gn=a.createGain();o.type=type||"sine";o.frequency.value=f;gn.gain.value=g||.12;o.connect(gn);gn.connect(a.destination);const t=a.currentTime+(when||0);o.start(t);gn.gain.setValueAtTime(gn.gain.value,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d);}
function cheer(){[523,659,784,1047].forEach((f,k)=>tone(f,.24,"triangle",k*.09,.13));}
function buzz(){tone(170,.2,"sine",0,.1);}
function confetti(n){const em=["🏟️","⭐","🎉","🧱"];for(let i=0;i<n;i++){const s=document.createElement("div");s.className="conf";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.4+Math.random())+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
let tT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),1300);}
function buildPass(){const el=$("pass");el.innerHTML="";for(let i=0;i<N;i++){const d=document.createElement("div");const r=Scoring._state.rounds[i];d.className="stamp"+(r?" "+Scoring.tierClass(r.tier):"");d.textContent=r&&r.tier==="grey"?"🆕":"🏟️";el.appendChild(d);}}
/* Honest Answer loop — PLAY-MASTERY-SPEC.md §1.
   CHOICE sites end the round on one answer. BUILD sites nudge without ending
   it: a construction task is scored on directness, like Note Value Lab, not on
   a single tap. */
function onCorrect(msg,sayMsg){
  if(done)return;
  done=true;
  const res = nudges>0 ? Scoring.answerTier("silver") : Scoring.answer(true);
  $("reveal").textContent="✅ "+msg;
  toast(res.tier==="gold"?pick(["Yes! 🎉","Brilliant! ⭐","Maths star! 🙌"]):"You worked it out! 👍");
  cheer();confetti(9);speak(sayMsg||msg);
  idx++;buildPass();
  $("next").disabled=false;
  $("next").textContent = idx>=N ? "See my score →" : "Next →";
}
/* CHOICE miss: one answer, then the correct answer is shown and it still teaches. */
function onMiss(msg,sayMsg){
  if(done)return;
  done=true;
  Scoring.answerTier("grey");
  $("reveal").textContent="🆕 "+msg;
  toast("Now you know it! 🆕");
  learnTone();speak(sayMsg||msg);
  idx++;buildPass();
  $("next").disabled=false;
  $("next").textContent = idx>=N ? "See my score →" : "Next →";
}
/* BUILD nudge: does NOT end the round, but costs the gold. */
function onWrong(hint){ nudges++; toast(hint||"Not yet 🤔"); learnTone(); speak(hint||"Not yet. Have another look."); }
function learnTone(){ [392,523].forEach((f,k)=>tone(f,.22,"triangle",k*.11,.11)); }
function finish(){$("finale").classList.remove("hidden");$("finh1").textContent=Scoring.headline();$("finaleMount").innerHTML=Scoring.finaleHTML();confetti(24);cheer();speak("Stadium full! Place value champion!");}
$("next")&&($("next").onclick=()=>{ if(!done)return; if(idx>=N){finish();} else render(); });
function startRun(lv){LEVEL=lv;$("lvlchip").textContent=(lv===3?"⭐ Year 3":lv===4?"🌟 Year 4":"🚀 Expert");$("start").classList.add("hidden");ctx();idx=0;Scoring.init({slug:"stadium-stacker",total:N,stampClasses:{base:"stamp",gold:"on",silver:"silver",grey:"miss"},noun:"one"});makeRounds();render();}
$("lvl3").onclick=()=>startRun(3);
$("lvl4").onclick=()=>startRun(4);
$("lvl5").onclick=()=>startRun(5);
$("again").onclick=()=>{$("finale").classList.add("hidden");$("start").classList.remove("hidden");};
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊":"🔇";if(!sound&&"speechSynthesis" in window)speechSynthesis.cancel();};
if(location.protocol==="file:"){$("back").setAttribute("href","index.html");$("homelink").setAttribute("href","index.html");}
buildPass();

// Real skyscraper counts from the site's metro data (public/data/metros.json).
const SKY=[["Hong Kong","🇭🇰",569],["New York","🇺🇸",347],["Shanghai","🇨🇳",245],["Tokyo","🇯🇵",212],["Chicago","🇺🇸",137],["Toronto","🇨🇦",123],["Mumbai","🇮🇳",113],["Singapore","🇸🇬",101],["Miami","🇺🇸",88],["Sydney","🇦🇺",54],["London","🇬🇧",44],["Los Angeles","🇺🇸",31],["Paris","🇫🇷",24],["Madrid","🇪🇸",7]];
const CLUBS=["Liverpool","Arsenal","Real Madrid","Barcelona","Bayern Munich","Ajax","Celtic","Inter Miami"];
let rounds=[];
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function mcq(options,ans,msg,say){
  window.__last={opts:options.map(String),ans:ans}; // test/debug hook
  const wide=options.some(t=>String(t).length>=8);
  const o=document.createElement("div");o.className="opts"+(options.length===2?" two":"")+(wide?" wide":"");
  const btns=[];
  options.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>{if(done||!Scoring.armed())return; if(i===ans){b.classList.add("good");onCorrect(msg,say);}else{b.classList.add("picked");btns[ans].classList.add("shown");onMiss(msg,say);}};
    btns.push(b);o.appendChild(b);});
  $("zone").appendChild(o);
}
/* Build a 3-option set from PLAUSIBLE-ERROR candidates. Never `ans ± step`
   symmetric pairs: that makes the correct answer the median of the three,
   which a pattern-spotting kid learns to exploit in one session. Two wrongs
   are drawn at random from the slip pool, so the answer's position (and its
   rank among the values) is unpredictable. */
function opts3(ans,cands){
  const uniq=[...new Set(cands.filter(c=>c!==ans&&Number.isFinite(c)))];
  const above=uniq.filter(c=>c>ans), below=uniq.filter(c=>c<ans);
  // Deliberately vary which SIDE the wrongs land on: if one wrong always sat
  // above and one below, the answer would still be the median every time.
  let w; const roll=Math.random();
  if(roll<0.35&&above.length>=2)w=shuffle(above).slice(0,2);
  else if(roll<0.7&&below.length>=2)w=shuffle(below).slice(0,2);
  else w=shuffle(uniq).slice(0,2);
  while(w.length<2)w.push(ans+7+w.length*4);
  return shuffle([ans,...w]);
}
const LABEL={build:"building the crowd",more:"10 or 100 more or less",round:"rounding the crowd",order:"ordering skyscraper counts",steps:"counting in steps",neg:"counting back through zero",pv:"place value in the millions",biground:"rounding a metro population",order5:"ordering five metros",gap:"the missing number in a sequence",negx:"counting back through zero"};
function makeRounds(){
  const kinds = LEVEL===3 ? ["build","build","more","order","steps","build","more","steps"]
              : LEVEL===4 ? ["build","build","round","order","steps","build","round","neg"]
                          : ["pv","pv","biground","order5","gap","negx","biground","gap"];
  rounds=shuffle(kinds);
}
/* Real metro-area populations from the site's metros.json (Expert level). */
const METROS=[["Tokyo","🏙️",40317972],["Delhi","🏙️",36790184],["Jakarta","🏙️",36157354],["Mexico City","🏙️",26370664],["Seoul","🏙️",26043325],["Cairo","🏙️",23708237],["New York","🏙️",22342624],["Sao Paulo","🏙️",22305115],["Moscow","🏙️",21534777],["Los Angeles","🏙️",18507255],["London","🏙️",16821649],["Paris","🏙️",12878104],["Chicago","🏙️",9941597],["Hong Kong","🏙️",7411945],["Madrid","🏙️",6930703],["Sydney","🏙️",5497131]];
function fmt(n){return n.toLocaleString("en-GB");}
function render(){
  done=false;nudges=0;$("zone").innerHTML="";$("reveal").textContent="";$("next").disabled=true;$("next").textContent="Next →";buildPass();
  const kind=rounds[idx];
  Scoring.beginRound(Scoring.idOf({q:kind}), LABEL[kind]);
  if(kind==="build") rBuild();
  else if(kind==="more") rMore();
  else if(kind==="round") rRound();
  else if(kind==="order") rOrder();
  else if(kind==="steps") rSteps();
  else if(kind==="neg") rNeg();
  else if(kind==="pv") rPV();
  else if(kind==="biground") rBigRound();
  else if(kind==="order5") rOrder5();
  else if(kind==="gap") rGap();
  else if(kind==="negx") rNegX();
}
/* ---- Expert rounds: real metro populations, place value into the millions ---- */
function rPV(){
  const m=pick(METROS);
  const digits=String(m[2]).split("").map(Number);
  const places=digits.length; // 7 or 8
  let di=ri(0,places-4); // only the millions/hundred-thousands end, and never a zero digit
  let guard=0; while(digits[di]===0&&guard++<10)di=ri(0,places-4);
  if(digits[di]===0)di=0;
  const place=Math.pow(10,places-1-di);
  const ans=digits[di]*place;
  $("q").innerHTML=m[1]+" "+m[0]+" metro has <b>"+fmt(m[2])+"</b> people. What is the VALUE of the digit <b>"+digits[di]+"</b>?";
  window._say=m[0]+" has "+m[2]+" people. What is the value of the digit "+digits[di]+"?";speak(_say);
  const opts=opts3(ans,[ans/10,ans*10,digits[di],digits[di]*Math.pow(10,Math.max(0,places-2-di))]);
  mcq(opts.map(fmt),opts.indexOf(ans),"In "+fmt(m[2])+", that "+digits[di]+" is worth "+fmt(ans),"That digit means "+ans);
}
function rBigRound(){
  const m=pick(METROS);
  const to=pick([100000,1000000]);
  const ans=Math.round(m[2]/to)*to;
  $("q").innerHTML="Round "+m[1]+" "+m[0]+" — <b>"+fmt(m[2])+"</b> people — to the nearest <b>"+fmt(to)+"</b>";
  window._say="Round "+m[0]+"'s population, "+m[2]+", to the nearest "+(to===1000000?"million":"hundred thousand");speak(_say);
  const trunc=Math.floor(m[2]/to)*to;
  const wrongPow=Math.round(m[2]/(to*10))*(to*10);
  const opts=opts3(ans,[trunc,ans+to,ans-to,wrongPow]);
  mcq(opts.map(fmt),opts.indexOf(ans),fmt(m[2])+" rounds to "+fmt(ans),"It rounds to "+ans);
}
function rOrder5(){
  const cards=shuffle(METROS).slice(0,5);
  const sorted=cards.slice().sort((a,b)=>a[2]-b[2]);
  $("q").innerHTML="Real metro populations! Tap the metros from <b>smallest to biggest</b>";
  window._say="Five real metro areas. Tap them in order, smallest population first.";speak(_say);
  const wrap=document.createElement("div");wrap.className="ordwrap";
  let pos=0;
  shuffle(cards).forEach(c=>{
    const b=document.createElement("button");b.className="ordcard";
    b.innerHTML="<span>"+c[1]+" "+c[0]+"</span><span class='n'>"+fmt(c[2])+"</span>";
    b.onclick=()=>{if(done||b.classList.contains("pick"))return;
      if(c===sorted[pos]){b.classList.add("pick");b.innerHTML="<span>"+(pos+1)+"️⃣ "+c[1]+" "+c[0]+"</span><span class='n'>"+fmt(c[2])+"</span>";pos++;tone(600+pos*120,.08,"triangle",0,.1);
        if(pos===5)onCorrect(sorted.map(x=>x[0]).join(" → "),"Perfect ordering — five metros, smallest to biggest!");}
      else onWrong("Compare the millions digits first 👀");};
    wrap.appendChild(b);});
  $("zone").appendChild(wrap);
}
function rGap(){
  const step=pick([6,7,9,25,250,1000]);
  const start=step*ri(2,9);
  const ans=start+step; // the MISSING middle term
  $("q").innerHTML="The turnstile counts in <b>"+fmt(step)+"s</b> — but one number is smudged! What is it?";
  window._say="Counting in "+step+"s: "+start+", something, "+(start+step*2)+", "+(start+step*3)+". What is the missing number?";speak(_say);
  const w=document.createElement("div");w.className="seq";
  w.innerHTML='<span class="step">'+fmt(start)+'</span><span class="step gap">?</span><span class="step">'+fmt(start+step*2)+'</span><span class="step">'+fmt(start+step*3)+'</span>';
  $("zone").appendChild(w);
  const off=step>=250?step/5:step>25?5:1;
  const opts=opts3(ans,[ans+off,ans-off,start+step*2,ans+step]);
  mcq(opts.map(fmt),opts.indexOf(ans),fmt(start)+", "+fmt(ans)+", "+fmt(start+step*2)+", "+fmt(start+step*3)+" — counting in "+fmt(step)+"s!");
}
function rNegX(){
  const step=pick([3,4,5]);
  const start=step*pick([1,2])+ (Math.random()<.5?0:step===3?1:2);
  const seq=[start,start-step,start-2*step];
  const ans=start-3*step; // negative or crossing zero
  $("q").innerHTML="Goal difference is sliding — count back in <b>"+step+"s</b>, straight through zero!";
  window._say="Count back in "+step+"s. "+seq.join(", ")+". What comes next?";speak(_say);
  const w=document.createElement("div");w.className="seq";
  w.innerHTML=seq.map(n=>'<span class="step">'+n+'</span>').join("")+'<span class="step gap">?</span>';
  $("zone").appendChild(w);
  const opts=opts3(ans,[Math.abs(ans),ans-step,ans+1,ans-1,0]);
  mcq(opts.map(String),opts.indexOf(ans),seq.join(", ")+", "+ans+" — below zero is negative, and the step stays "+step+"!");
}
/* build the crowd from place-value blocks */
function rBuild(){
  const th=LEVEL===4?ri(1,4):0, h=ri(1,9), t=ri(0,9), o=ri(1,9);
  const target=th*1000+h*100+t*10+o;
  const club=pick(CLUBS);
  $("q").innerHTML="Build the crowd at the "+club+" game: <b>"+fmt(target)+"</b> fans";
  window._say="Build the number "+target+" from "+(LEVEL===4?"thousands, ":"")+"hundreds, tens and ones.";
  speak(_say);
  const cols=LEVEL===4?[["Thousands","th",1000],["Hundreds","h",100],["Tens","t",10],["Ones","o",1]]:[["Hundreds","h",100],["Tens","t",10],["Ones","o",1]];
  const st={};
  const wrap=document.createElement("div");wrap.className="cols";
  cols.forEach(([lab,cls,val])=>{
    st[cls]=0;
    const c=document.createElement("div");c.className="col";
    c.innerHTML='<div class="lab">'+lab+'</div><div class="blocks" id="bl-'+cls+'"></div><div class="cnt" id="cn-'+cls+'">0</div>';
    const pm=document.createElement("div");pm.className="pm";
    const mk=(txt,d)=>{const b=document.createElement("button");b.textContent=txt;
      b.onclick=()=>{if(done)return;st[cls]=Math.max(0,Math.min(9,st[cls]+d));upd();tone(d>0?700:420,.06,"triangle",0,.08);};return b;};
    pm.appendChild(mk("−",-1));pm.appendChild(mk("+",1));
    c.appendChild(pm);wrap.appendChild(c);
  });
  $("zone").appendChild(wrap);
  const tot=document.createElement("div");tot.className="total";tot.id="tot";$("zone").appendChild(tot);
  const chk=document.createElement("button");chk.className="check";chk.textContent="Check! ✅";
  chk.onclick=()=>{if(done)return;
    const got=cols.reduce((s,[,cls,val])=>s+st[cls]*val,0);
    if(got===target){onCorrect(fmt(target)+" = "+cols.map(([lab,cls])=>st[cls]+" "+lab.toLowerCase()).join(" + "),"Yes! "+target+" built perfectly!");}
    else onWrong(got<target?"Not enough fans yet 👀":"Too many fans! 👀");};
  $("zone").appendChild(chk);
  function upd(){
    cols.forEach(([lab,cls])=>{
      $("cn-"+cls).textContent=st[cls];
      const bl=$("bl-"+cls);bl.innerHTML="";
      for(let i=0;i<st[cls];i++){const d=document.createElement("div");d.className="blk "+cls;bl.appendChild(d);}
    });
    $("tot").textContent="Crowd so far: "+fmt(cols.reduce((s,[,cls,val])=>s+st[cls]*val,0));
  }
  upd();
}
/* 10 / 100 more or less */
function rMore(){
  const base=ri(2,8)*100+ri(1,9)*10+ri(1,9);
  const step=pick([10,100]); const dir=pick([1,-1]);
  const ans=base+dir*step;
  $("q").innerHTML=(dir>0?step+" more fans arrive! ":step+" fans go home. ")+"What is "+fmt(base)+(dir>0?" + ":" − ")+step+"?";
  window._say=(dir>0?"What is "+step+" more than "+base+"?":"What is "+step+" less than "+base+"?");speak(_say);
  // Slips: forgot to change anything; changed the wrong column; off by one.
  const wrongCol=base+dir*(step===10?100:10);
  const opts=opts3(ans,[base,wrongCol,ans+1,ans-1]);
  mcq(opts.map(fmt),opts.indexOf(ans),fmt(base)+(dir>0?" + ":" − ")+step+" = "+fmt(ans));
}
/* Y4: rounding */
function rRound(){
  const n=ri(1,8)*1000+ri(1,9)*100+ri(1,9)*10+ri(1,9);
  const to=pick([10,100,1000]);
  const ans=Math.round(n/to)*to;
  $("q").innerHTML="Round the crowd of <b>"+fmt(n)+"</b> to the nearest "+fmt(to);
  window._say="Round "+n+" to the nearest "+to;speak(_say);
  // Slips: truncated instead of rounding; rounded to the wrong power; a step off.
  const trunc=Math.floor(n/to)*to;
  const wrongPow=Math.round(n/(to*10))*(to*10);
  const opts=opts3(ans,[trunc,wrongPow,ans+to,ans-to].filter(x=>x>=0));
  mcq(opts.map(fmt),opts.indexOf(ans),fmt(n)+" rounds to "+fmt(ans));
}
/* order real skyscraper counts, smallest first */
function rOrder(){
  const cards=shuffle(SKY).slice(0,3);
  const sorted=cards.slice().sort((a,b)=>a[2]-b[2]);
  $("q").innerHTML="Real skyscraper counts! Tap the metros from <b>smallest to biggest</b>";
  window._say="Tap the metros in order, smallest number of skyscrapers first.";speak(_say);
  const wrap=document.createElement("div");wrap.className="ordwrap";
  let pos=0;
  shuffle(cards).forEach(c=>{
    const b=document.createElement("button");b.className="ordcard";
    b.innerHTML="<span>"+c[1]+" "+c[0]+"</span><span class='n'>"+c[2]+"</span>";
    b.onclick=()=>{if(done||b.classList.contains("pick"))return;
      if(c===sorted[pos]){b.classList.add("pick");b.innerHTML="<span>"+(pos+1)+"️⃣ "+c[1]+" "+c[0]+"</span><span class='n'>"+c[2]+"</span>";pos++;tone(600+pos*120,.08,"triangle",0,.1);
        if(pos===3)onCorrect(sorted.map(x=>x[0]+" ("+x[2]+")").join(" → "),"Perfect ordering!");}
      else onWrong("Which number is smallest? 👀");};
    wrap.appendChild(b);});
  $("zone").appendChild(wrap);
}
/* counting in steps */
function rSteps(){
  const step=LEVEL===3?pick([4,8,50,100]):pick([6,7,9,25,1000]);
  const start=step*ri(1,4);
  const seq=[start,start+step,start+step*2];
  const ans=start+step*3;
  $("q").innerHTML="The turnstile counts fans in <b>"+fmt(step)+"s</b>. What comes next?";
  window._say="Counting in "+step+"s. "+seq.join(", ")+". What comes next?";speak(_say);
  const w=document.createElement("div");w.className="seq";
  w.innerHTML=seq.map(n=>'<span class="step">'+fmt(n)+'</span>').join("")+'<span class="step gap">?</span>';
  $("zone").appendChild(w);
  // Slips: off by one; repeated the last term; overshot by a step.
  const off=step>=50?10:1;
  const opts=opts3(ans,[ans+off,ans-off,seq[2],ans+step]);
  mcq(opts.map(fmt),opts.indexOf(ans),seq.join(", ")+", "+fmt(ans)+" — counting in "+fmt(step)+"s!");
}
/* Y4: counting back through zero (goal difference) */
function rNeg(){
  const start=ri(1,3);
  const seq=[start,start-1,start-2];
  const ans=start-3;
  $("q").innerHTML="Goal difference is falling! Count back: what comes next?";
  window._say="Count backwards. "+seq.join(", ")+". What comes next?";speak(_say);
  const w=document.createElement("div");w.className="seq";
  w.innerHTML=seq.map(n=>'<span class="step">'+n+'</span>').join("")+'<span class="step gap">?</span>';
  $("zone").appendChild(w);
  const opts=opts3(ans,[Math.abs(ans),ans-1,ans+1,0]);
  mcq(opts.map(String),opts.indexOf(ans),seq.join(", ")+", "+ans+" — below zero is a negative number!");
}
$("read").onclick=()=>{if(window._say)speak(_say);};
