<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Offside or Onside? — Play &amp; Learn</title>
<style>
  :root{--ink:#16324f;--accent:#1f9e82;--gold:#f6b93b;--paper:#eef6fc;--hot:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:560px;margin:0 auto}
  .logo{font-size:1.3rem;font-weight:900}
  .hbtns{display:flex;gap:8px}
  .snd,.backb{border:none;background:#fff;border-radius:14px;font-size:1.15rem;padding:6px 12px;box-shadow:0 4px 0 #cfe0ee;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:900}
  main{max-width:560px;margin:0 auto;padding:0 12px 20px;text-align:center}
  .ask{font-size:1.05rem;font-weight:800;margin:0 0 8px}
  .pitchwrap{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 8px 20px #16324f22;background:#2f9e54}
  svg{display:block;width:100%;height:auto}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .call{border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.3rem;padding:16px 8px;cursor:pointer;color:#fff;box-shadow:0 6px 0 #00000030;transition:transform .1s}
  .call:active{transform:translateY(3px)}
  .call.on{background:var(--accent);box-shadow:0 6px 0 #15705d}
  .call.off{background:var(--hot);box-shadow:0 6px 0 #b34545}
  .call:disabled{opacity:.5;cursor:default}
  .verdict{min-height:1.6em;font-weight:900;font-size:1.1rem;margin-top:10px;color:var(--accent)}
  .next{margin-top:8px;border:none;border-radius:16px;font-family:inherit;font-weight:900;font-size:1.05rem;padding:11px 26px;cursor:pointer;background:var(--ink);color:#fff;box-shadow:0 6px 0 #0b1a29;visibility:hidden}
  .next.show{visibility:visible}
  .pass{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .stamp{width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px #dcebf6;display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.4;filter:grayscale(1)}
  .stamp.on{opacity:1;filter:none;box-shadow:inset 0 0 0 3px var(--gold);animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
  .toast{position:fixed;left:50%;top:10%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:1.1rem;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .toast.show{opacity:1}
  .conf{position:fixed;top:-12px;font-size:1.3rem;pointer-events:none;z-index:15;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
  .cover{position:fixed;inset:0;background:#eef6fcf2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20}
  .cover h1{font-size:2.1rem;margin:8px 0}
  .cover p{font-size:1.08rem;font-weight:700;color:#5b7b97;max-width:430px;margin:4px 0 18px}
  .big{border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.25rem;padding:15px 28px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 7px 0 #15705d}
  .hidden{display:none !important}
</style>
</head>
<body>
<header>
  <div class="logo">🚩 Offside or Onside?</div>
  <div class="hbtns"><a class="backb" id="back" href="/play">←</a><button class="snd" id="snd">🔊</button></div>
</header>
<main>
  <div class="ask">The pass is about to be played. <b>Make the call!</b></div>
  <div class="pitchwrap">
    <svg id="pitch" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grass" width="400" height="80" patternUnits="userSpaceOnUse">
          <rect width="400" height="40" fill="#37a355"/><rect y="40" width="400" height="40" fill="#2f9450"/>
        </pattern>
      </defs>
      <rect width="400" height="520" fill="url(#grass)"/>
      <!-- pitch lines -->
      <rect x="12" y="12" width="376" height="496" fill="none" stroke="#ffffffcc" stroke-width="3"/>
      <line x1="12" y1="340" x2="388" y2="340" stroke="#ffffffcc" stroke-width="3"/>
      <circle cx="200" cy="340" r="46" fill="none" stroke="#ffffffcc" stroke-width="3"/>
      <rect x="110" y="12" width="180" height="66" fill="none" stroke="#ffffffcc" stroke-width="3"/>
      <rect x="155" y="12" width="90" height="28" fill="none" stroke="#ffffffcc" stroke-width="3"/>
      <!-- goal -->
      <rect x="160" y="4" width="80" height="9" fill="#fff" stroke="#d7e6f2" stroke-width="2"/>
      <text x="200" y="500" text-anchor="middle" font-size="15" fill="#ffffffaa" font-weight="800">⬆ attacking this way ⬆</text>
      <!-- offside line (hidden until reveal) -->
      <line id="oline" x1="12" y1="0" x2="388" y2="0" stroke="#ffe45e" stroke-width="3" stroke-dasharray="10 8" opacity="0"/>
      <text id="olabel" x="380" y="0" text-anchor="end" font-size="14" fill="#ffe45e" font-weight="900" opacity="0">last defender</text>
      <g id="players"></g>
      <text id="flagman" x="386" y="0" text-anchor="middle" font-size="30" opacity="0">🚩</text>
      <circle id="ball" r="7" fill="#fff" stroke="#16324f" stroke-width="2" opacity="0"/>
    </svg>
  </div>
  <div class="btns">
    <button class="call on" id="bOn">✅ ONSIDE</button>
    <button class="call off" id="bOff">🚩 OFFSIDE</button>
  </div>
  <div class="verdict" id="verdict"></div>
  <button class="next" id="next">Next play →</button>
  <div class="pass" id="pass"></div>
</main>
<div class="toast" id="toast"></div>

<div class="cover" id="start">
  <div style="font-size:3.8rem">🚩⚽</div>
  <h1>Offside or Onside?</h1>
  <p>You're the linesman! Look at the freeze-frame, then tap <b>ONSIDE</b> or <b>OFFSIDE</b>. The yellow line shows you the answer after every call.</p>
  <button class="big" id="go">Raise your flag! 🚩</button>
</div>

<div class="cover hidden" id="finale">
  <div style="font-size:4rem">🥇🚩</div>
  <h1>Top linesman!</h1>
  <p id="finp">You read the line like a pro referee.</p>
  <button class="big" id="again">Play again 🔁</button>
  <a href="/play" style="display:inline-block;margin:10px 6px 0;padding:12px 22px;border-radius:16px;background:#5b7b97;color:#fff;font-weight:900;text-decoration:none;font-family:inherit;font-size:1.05rem;box-shadow:0 6px 0 #40566b">All games 🎮</a>
</div>

<script>
const $=id=>document.getElementById(id);
const ROUNDS=8;
let sound=true,idx=0,cur=null,locked=false,firstTry=true,perfect=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function speak(t){if(!sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
function confetti(n){const em=["🚩","⭐","⚽","🎉"];for(let i=0;i<n;i++){const s=document.createElement("div");s.className="conf";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.4+Math.random())+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
let tT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),1300);}
function buildPass(){const el=$("pass");el.innerHTML="";for(let i=0;i<ROUNDS;i++){const d=document.createElement("div");d.className="stamp"+(i<idx?" on":"");d.textContent="🚩";el.appendChild(d);}}

/* scenario cases:
   off  — attacker beyond the last defender (OFFSIDE)
   lvl  — level with last defender (ONSIDE)
   behind — behind the defender line (ONSIDE)
   own  — beyond the line but in own half (ONSIDE)
   ball — beyond the line but behind the ball (ONSIDE) */
const CASES=["off","lvl","behind","own","ball"];
const WHY={
  off:"Offside! He was past the last defender when the ball was kicked.",
  lvl:"Onside! Level with the last defender counts as onside.",
  behind:"Onside! He was behind the defenders when the ball was kicked.",
  own:"Onside! You can never be offside in your own half.",
  ball:"Onside! He was behind the ball. That is always onside."
};
function rx(min,max){return min+Math.random()*(max-min);}
function makeScenario(kind){
  let Dy, Ay, Py, Ax=rx(120,280), Px;
  if(kind==="own"){ Dy=rx(420,450); Ay=rx(360,Dy-40); Py=rx(Ay+40,495); }
  else{
    Dy=rx(150,240);
    if(kind==="off") Ay=Dy-rx(45,80);
    else if(kind==="lvl") Ay=Dy;
    else if(kind==="behind") Ay=Dy+rx(45,90);
    else Ay=Dy-rx(45,80); // ball case: beyond line
    Py=rx(Math.max(Ay+60,300),480);
    if(kind==="ball"){ Py=Ay-rx(35,60); } // passer even closer to goal
  }
  Py=Math.min(Py,468);
  Px=Ax<200?rx(Ax+60,340):rx(60,Ax-60);
  const defs=[{x:rx(60,140),y:Dy},{x:rx(230,340),y:Math.min(Dy+rx(14,40),466)},{x:rx(150,240),y:Math.min(Dy+rx(40,80),466)}];
  // ensure the line defender is the closest-to-goal outfielder
  return {kind, Dy, Ay, Ax, Py, Px, defs, offside: kind==="off"};
}
function jersey(g,x,y,color,num,ring){
  const NS="http://www.w3.org/2000/svg";
  const c=document.createElementNS(NS,"circle");
  c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",13);
  c.setAttribute("fill",color);c.setAttribute("stroke",ring||"#ffffff");c.setAttribute("stroke-width",3);
  g.appendChild(c);
  const t=document.createElementNS(NS,"text");
  t.setAttribute("x",x);t.setAttribute("y",y+5);t.setAttribute("text-anchor","middle");
  t.setAttribute("font-size","13");t.setAttribute("font-weight","900");t.setAttribute("fill","#fff");
  t.textContent=num; g.appendChild(t);
}
function render(){
  locked=false; firstTry=true;
  cur=seq[idx]?makeScenario(seq[idx]):makeScenario(pick(CASES));
  const g=$("players"); g.innerHTML="";
  jersey(g,200,26,"#f0c33c","1","#b78a00");                 // keeper
  cur.defs.forEach((d,i)=>jersey(g,d.x,d.y,"#3b6fd4",String(i+2)));
  jersey(g,cur.Ax,cur.Ay,"#e04848","9");                     // striker
  jersey(g,cur.Px,cur.Py,"#e04848","10");                    // passer
  const b=$("ball"); b.setAttribute("cx",cur.Px+16); b.setAttribute("cy",cur.Py); b.setAttribute("opacity",1);
  b.style.transition="none";
  $("oline").setAttribute("opacity",0); $("olabel").setAttribute("opacity",0);
  $("flagman").setAttribute("opacity",0);
  $("verdict").textContent=""; $("next").classList.remove("show");
  $("bOn").disabled=false; $("bOff").disabled=false;
  buildPass();
  speak("Number ten is about to pass to number nine. Onside, or offside?");
}
function reveal(){
  const lineY=cur.kind==="own"?cur.Dy:cur.Dy;      // last outfield defender line
  $("oline").setAttribute("y1",lineY); $("oline").setAttribute("y2",lineY);
  $("oline").setAttribute("opacity",1);
  $("olabel").setAttribute("y",lineY-8); $("olabel").setAttribute("opacity",1);
  // animate ball to the striker
  const b=$("ball");
  b.style.transition="cx .6s ease, cy .6s ease";
  requestAnimationFrame(()=>{ b.setAttribute("cx",cur.Ax); b.setAttribute("cy",cur.Ay); });
  if(cur.offside){ $("flagman").setAttribute("y",cur.Dy); $("flagman").setAttribute("opacity",1); }
}
function choose(callOffside){
  if(locked)return;
  const correct = callOffside===cur.offside;
  if(correct){
    locked=true; if(firstTry)perfect++;
    reveal();
    $("bOn").disabled=true; $("bOff").disabled=true;
    const why=WHY[cur.kind];
    $("verdict").textContent=(cur.offside?"🚩 ":"✅ ")+why;
    toast(pick(["Great call! 🎉","Sharp eyes! ⭐","Just like a real ref! 🙌"]));
    speak(why); confetti(10);
    idx++; buildPass();
    $("next").textContent = idx>=ROUNDS ? "See my score →" : "Next play →";
    $("next").classList.add("show");
  } else {
    firstTry=false;
    toast("Look at the yellow-shirt line 👀 Try again!");
    speak("Not quite. Look where the last defender is standing, then try again.");
  }
}
let seq=[];
function startRun(){
  // guarantee variety: all five cases + 3 random
  seq=shuffle(CASES.concat(shuffle(CASES).slice(0,ROUNDS-CASES.length)));
  idx=0; perfect=0; render();
}
$("bOn").onclick=()=>choose(false);
$("bOff").onclick=()=>choose(true);
$("next").onclick=()=>{ if(idx>=ROUNDS){ $("finp").textContent = perfect>=7 ? "Perfect calls on "+perfect+" of 8. FIFA, call this kid!" : "You got all 8, with "+perfect+" first-time calls. Play again to go perfect!"; $("finale").classList.remove("hidden"); confetti(24); speak("Top linesman!"); } else render(); };
$("go").onclick=()=>{ $("start").classList.add("hidden"); startRun(); };
$("again").onclick=()=>{ $("finale").classList.add("hidden"); startRun(); };
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊":"🔇";if(!sound&&"speechSynthesis" in window)speechSynthesis.cancel();};
if(location.protocol==="file:")$("back").setAttribute("href","index.html");
buildPass();
</script>
</body>
</html>
